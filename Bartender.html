<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartender The Right Mix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #status {
            position: absolute;
            color: #fff;
            font-size: 18px;
            z-index: 10;
        }
        ruffle-player {
            width: 800px;
            height: 600px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="status">Loading game...</div>
        <div id="player"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            letterbox: "on",
            backgroundColor: "#000000"
        };

        window.addEventListener("DOMContentLoaded", () => {
            const status = document.getElementById("status");
            const container = document.getElementById("player");

            try {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                container.appendChild(player);

                player.style.width = "800px";
                player.style.height = "600px";

                player.load("https://files.crazygames.com/bartendertherightmix.swf")
                    .then(() => {
                        status.style.display = "none";
                        console.log("Game loaded successfully");
                    })
                    .catch((err) => {
                        status.textContent = "Failed to load game. Error: " + err;
                        console.error(err);
                    });
            } catch (e) {
                status.textContent = "Ruffle failed to start: " + e.message;
            }
        });
    </script>
</body>
</html>
