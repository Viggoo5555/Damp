<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartender The Right Mix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #status {
            color: white;
            font-size: 18px;
            text-align: center;
            z-index: 10;
        }
        ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="status">Loading Ruffle...</div>
    </div>

    <script>
        // Load Ruffle
        const script = document.createElement("script");
        script.src = "https://unpkg.com/@ruffle-rs/ruffle";
        script.onload = () => {
            document.getElementById("status").textContent = "Loading game...";

            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                autoplay: "on",
                unmuteOverlay: "hidden",
                letterbox: "on",
                backgroundColor: "#000000"
            };

            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("game-container");

            // Clear the status text
            container.innerHTML = "";
            container.appendChild(player);

            player.load("https://files.crazygames.com/bartendertherightmix.swf")
                .then(() => {
                    console.log("Game loaded!");
                })
                .catch((err) => {
                    container.innerHTML = `<div id="status" style="color:red">
                        Failed to load game<br><br>
                        ${err}<br><br>
                        Try opening the Console (F12) for more info
                    </div>`;
                    console.error(err);
                });
        };

        script.onerror = () => {
            document.getElementById("status").innerHTML = `
                Failed to load Ruffle.<br>
                Check your internet connection or try again.
            `;
        };

        document.head.appendChild(script);
    </script>
</body>
</html>
