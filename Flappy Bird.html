<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe3ea;--panel:#ded895;--ink:#543847;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10262c}}
:root[data-theme="dark"]{--bg:#10262c}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Press Start 2P',ui-monospace,monospace}
#stage{position:relative;--s:1;touch-action:none;cursor:pointer}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ui{position:absolute;inset:0;pointer-events:none}
.ui button{pointer-events:auto}
.panel{position:absolute;left:50%;transform:translateX(-50%);width:92%;text-align:center;color:#fff;-webkit-text-stroke:calc(var(--s)*4px) var(--ink);paint-order:stroke fill}
.panel .card{-webkit-text-stroke:0}
.hide{display:none}
h1,h2{margin:0;font-weight:400;line-height:1.3}
h1{font-size:calc(var(--s)*26px);color:var(--hd,#ffa72b)}
h2{font-size:calc(var(--s)*22px);color:var(--hd,#ffa72b)}
#start{top:13%}#over{top:22%}#get{top:16%}#get p{font-size:calc(var(--s)*9px);margin:calc(var(--s)*12px) 0 0}#play{background:var(--b4,#74c02c)}
#start p{font-size:calc(var(--s)*8px);line-height:1.8;margin:calc(var(--s)*14px) 0 calc(var(--s)*16px)}
.btn{font:inherit;font-size:calc(var(--s)*11px);padding:calc(var(--s)*10px) calc(var(--s)*18px);background:var(--b1,#ee7a1c);color:#fff;-webkit-text-stroke:calc(var(--s)*2px) var(--ink);paint-order:stroke fill;border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*5px);box-shadow:inset 0 0 0 calc(var(--s)*2px) var(--b2,#ffd9a0),0 calc(var(--s)*4px) 0 var(--b3,#8a3c0a);cursor:pointer}
.btn:active{transform:translateY(calc(var(--s)*3px));box-shadow:0 calc(var(--s)*1px) 0 #b8863a}
.btn:focus-visible{outline:calc(var(--s)*3px) solid #fff;outline-offset:calc(var(--s)*2px)}
#mute{position:absolute;top:calc(var(--s)*8px);right:calc(var(--s)*8px);font-size:calc(var(--s)*7px);padding:calc(var(--s)*6px) calc(var(--s)*8px);box-shadow:none;-webkit-text-stroke:0}
.card{background:var(--panel);color:var(--ct,var(--ink));border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*4px);margin:calc(var(--s)*16px) auto;width:80%;padding:calc(var(--s)*12px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--s)*10px);font-size:calc(var(--s)*10px);text-align:left}
.card b{font-weight:400;text-align:right}
#medal{width:calc(var(--s)*32px);height:calc(var(--s)*32px);border-radius:50%;grid-row:span 2;border:calc(var(--s)*3px) solid var(--ink);box-sizing:border-box;visibility:hidden}
.sub{font-size:calc(var(--s)*8px);margin-top:calc(var(--s)*16px)}
#tot{font-size:calc(var(--s)*7px);margin:0 0 calc(var(--s)*14px)}
.sm{font-size:calc(var(--s)*7px);padding:calc(var(--s)*6px) calc(var(--s)*9px)}
.btn:disabled{opacity:.5;cursor:default}
#shop{position:absolute;inset:0;background:rgba(10,20,25,.92);color:#fff;font-size:calc(var(--s)*8px);padding:calc(var(--s)*12px);box-sizing:border-box;overflow:auto;touch-action:pan-y;pointer-events:auto;cursor:default;display:flex;flex-direction:column;gap:calc(var(--s)*10px)}
#shop.hide{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--s)*6px)}
.sh b{font-weight:400;font-size:calc(var(--s)*14px);color:var(--hd,#ffa72b)}
.tabs{display:flex;gap:calc(var(--s)*6px)}
.tabs .on{background:var(--b4,#74c02c)}
#items{display:flex;flex-direction:column;gap:calc(var(--s)*8px)}
.it{display:flex;align-items:center;gap:calc(var(--s)*8px);background:rgba(255,255,255,.1);padding:calc(var(--s)*6px);border-radius:calc(var(--s)*4px)}
.it span{flex:1;line-height:1.5}
.it .sw{width:calc(var(--s)*44px);height:calc(var(--s)*30px);flex:none;border:calc(var(--s)*2px) solid var(--ink);border-radius:calc(var(--s)*3px);box-sizing:border-box}
.it canvas.sw{background:#70c5ce}
.it small{font-size:calc(var(--s)*6px);opacity:.85;line-height:1.7}
.row2{display:flex;gap:calc(var(--s)*8px);justify-content:center;margin-top:calc(var(--s)*12px)}
.sm2{font-size:calc(var(--s)*8px);padding:calc(var(--s)*8px) calc(var(--s)*12px)}
#dbtn{position:absolute;right:calc(var(--s)*12px);bottom:calc(var(--s)*80px);width:calc(var(--s)*64px);height:calc(var(--s)*64px);border-radius:50%;padding:0;font-size:calc(var(--s)*8px);z-index:3;touch-action:none}
#tutsw{position:absolute;left:0;right:0;bottom:calc(var(--s)*70px);display:flex;justify-content:center;gap:calc(var(--s)*6px);pointer-events:none;z-index:3}
#tutsw.hide{display:none}#tutsw button{pointer-events:auto}
#stage{--sky:#70c5ce;--g1:#73bf2e;--sd:#ded895}
#skp{position:absolute;inset:0;z-index:2;color:#fff;font-size:calc(var(--s)*8px);padding:calc(var(--s)*12px);box-sizing:border-box;overflow:auto;touch-action:pan-y;pointer-events:auto;cursor:default;display:flex;flex-direction:column;gap:calc(var(--s)*10px);background:radial-gradient(ellipse calc(var(--s)*26px) calc(var(--s)*9px) at 18% 9%,rgba(255,255,255,.55) 70%,transparent 72%),radial-gradient(ellipse calc(var(--s)*20px) calc(var(--s)*7px) at 78% 17%,rgba(255,255,255,.45) 70%,transparent 72%),radial-gradient(ellipse calc(var(--s)*30px) calc(var(--s)*10px) at 52% 31%,rgba(255,255,255,.35) 70%,transparent 72%),linear-gradient(var(--sky) 0 88%,var(--ink) 88% 88.6%,var(--g1) 88.6% 93%,var(--sd) 93%)}
#skp.hide{display:none}
.skh{display:flex;align-items:center;gap:calc(var(--s)*8px)}
.skh h2{flex:1;margin:0;font-size:calc(var(--s)*15px);font-weight:400;color:var(--hd,#ffa72b);-webkit-text-stroke:calc(var(--s)*4px) var(--ink);paint-order:stroke fill}
.chip{display:flex;align-items:center;gap:calc(var(--s)*5px);background:var(--panel);color:var(--ct,var(--ink));border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*4px);padding:calc(var(--s)*5px) calc(var(--s)*8px);box-shadow:0 calc(var(--s)*3px) 0 rgba(0,0,0,.25)}
.coin{width:calc(var(--s)*9px);height:calc(var(--s)*9px);background:#f5c542;border:calc(var(--s)*2px) solid var(--ink);box-sizing:border-box}
.k0{--c:#ffa72b}.k1{--c:#4fb8e8}.k2{--c:#ff7ab8}.k3{--c:#73bf2e}.k4{--c:#9a5cf0}
#skt{position:relative;width:calc(var(--s)*288px);height:calc(var(--s)*330px);margin:0 calc(var(--s)*-12px);flex:none}
#skt>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#skt path{fill:none;stroke-linejoin:miter;stroke-linecap:square}
#skt .o{stroke:var(--ink);stroke-width:8}
#skt .i{stroke:#a39b73;stroke-width:4}
#skt .i.on{stroke:#73bf2e}
.sn{position:absolute;width:calc(var(--s)*46px);height:calc(var(--s)*46px);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*5px);background:#bdb58a;box-shadow:0 calc(var(--s)*4px) 0 rgba(0,0,0,.28);color:var(--ink)}
.sn svg{width:60%;height:60%;fill:#8c8564;stroke:var(--ink);stroke-width:1.2;paint-order:stroke}
.sn.av{background:#fffbe6;animation:bob 1s steps(2) infinite}
.sn.av svg{fill:var(--c)}
.sn.own{background:var(--c);box-shadow:inset 0 0 0 calc(var(--s)*2px) rgba(255,255,255,.55),0 calc(var(--s)*4px) 0 rgba(0,0,0,.28)}
.sn.own svg{fill:#fff}
.sn.sel{outline:calc(var(--s)*3px) solid #fff;outline-offset:calc(var(--s)*2px)}
.sn.pop{animation:pop .6s steps(6)}
@keyframes bob{50%{transform:translateY(calc(var(--s)*-2px))}}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.bd{position:absolute;right:calc(var(--s)*-5px);bottom:calc(var(--s)*-5px);width:calc(var(--s)*15px);height:calc(var(--s)*15px);background:#2fbf4a;border:calc(var(--s)*2px) solid var(--ink);border-radius:calc(var(--s)*3px);display:flex;align-items:center;justify-content:center}
.bd svg{width:70%;height:70%;fill:#fff;stroke:none}
.bd.lkb{background:#8c8564}
.sl{position:absolute;width:calc(var(--s)*62px);text-align:center;font-size:calc(var(--s)*5.5px);line-height:1.7;color:#fff;-webkit-text-stroke:calc(var(--s)*2.5px) var(--ink);paint-order:stroke fill;pointer-events:none}
.sl .ok{color:#9dff8a}.sl .no{color:#ff9a8a}
.skd{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--s)*10px);align-items:center;padding:calc(var(--s)*10px);background:var(--panel);color:var(--ct,var(--ink));border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*5px);box-shadow:0 calc(var(--s)*4px) 0 rgba(0,0,0,.28)}
.skd .sn.big{position:relative;pointer-events:none;box-shadow:none}
.skd b{font-weight:400;font-size:calc(var(--s)*10px);color:var(--ct,var(--ink))}
.skd em{display:block;font-style:normal;font-size:calc(var(--s)*6px);opacity:.75;margin:calc(var(--s)*3px) 0}
.skd p{margin:0;font-size:calc(var(--s)*6px);line-height:1.8}
.skr{grid-column:1/-1}
#skp .det{background:var(--panel);color:var(--ct,var(--ink));border:calc(var(--s)*3px) solid var(--ink);border-radius:calc(var(--s)*5px);box-shadow:0 calc(var(--s)*4px) 0 rgba(0,0,0,.28)}
#hud{position:absolute;inset:0;pointer-events:none}
#lbb{position:absolute;top:calc(var(--s)*8px);left:calc(var(--s)*8px)}
#setb{position:absolute;top:calc(var(--s)*8px);right:calc(var(--s)*8px)}
#lbb.ic,#setb.ic{width:calc(var(--s)*26px);height:calc(var(--s)*26px);padding:0;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--s)*6px)}
.ic svg{width:calc(var(--s)*16px);height:calc(var(--s)*16px);fill:currentColor}
#lbb,#setb,#mute{font-size:calc(var(--s)*7px);padding:calc(var(--s)*6px) calc(var(--s)*8px);box-shadow:none;-webkit-text-stroke:0}
#skip{position:absolute;top:calc(var(--s)*14px);right:calc(var(--s)*8px);z-index:3}
#lbp,#setp{position:absolute;inset:0;background:rgba(10,20,25,.94);color:#fff;font-size:calc(var(--s)*8px);padding:calc(var(--s)*12px);box-sizing:border-box;overflow:auto;touch-action:pan-y;pointer-events:auto;cursor:default;display:flex;flex-direction:column;gap:calc(var(--s)*10px)}
#lbp.hide,#setp.hide{display:none}
#lbl{display:flex;flex-direction:column;gap:calc(var(--s)*8px)}
#tree{position:relative;width:calc(var(--s)*288px);height:calc(var(--s)*270px);margin:0 calc(var(--s)*-12px);flex:none}
#tree svg{position:absolute;inset:0;width:100%;height:100%}
#tree line{stroke:#5a6a72;stroke-width:3}#tree line.on{stroke:#74c02c}
.nd{position:absolute;width:calc(var(--s)*64px);height:calc(var(--s)*50px);padding:0;font:inherit;color:#fff;background:rgba(40,56,64,.95);border:calc(var(--s)*2px) solid #5a6a72;border-radius:calc(var(--s)*5px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--s)*4px)}
.nd b{font-weight:400;font-size:calc(var(--s)*13px)}.nd small{font-size:calc(var(--s)*5px)}
.nd.own{border-color:#74c02c;background:rgba(40,90,30,.95)}.nd.av{border-color:#ffa72b}.nd.lk{opacity:.45}.nd.sel{outline:calc(var(--s)*2px) solid #fff}
.det{background:rgba(255,255,255,.1);padding:calc(var(--s)*8px);border-radius:calc(var(--s)*4px);display:flex;flex-direction:column;gap:calc(var(--s)*6px);align-items:flex-start;line-height:1.6}
.det p{margin:0;font-size:calc(var(--s)*6px);line-height:1.7}
.det canvas{width:calc(var(--s)*44px);height:calc(var(--s)*30px);background:#70c5ce;border:calc(var(--s)*2px) solid var(--ink);box-sizing:border-box}
.sws{display:flex;flex-wrap:wrap;gap:calc(var(--s)*6px);align-items:center}
.csw{width:calc(var(--s)*20px);height:calc(var(--s)*20px);border:calc(var(--s)*2px) solid #fff;border-radius:calc(var(--s)*4px);padding:0;cursor:pointer}
.csw.on{outline:calc(var(--s)*2px) solid #ffa72b}
.det input[type=color]{width:calc(var(--s)*28px);height:calc(var(--s)*22px);padding:0;border:0;background:none}
#stage[data-w="3"]{--ink:#4a2a0a;--hd:#fff3c8;--b1:#b8741c;--b2:#ffe0a0;--b3:#6a3a08;--b4:#e0a030;--panel:#f0d8a0;--ct:#4a2a0a}
#stage[data-w="4"]{--ink:#1c3a52;--hd:#fff;--b1:#2a8ac0;--b2:#d8f4ff;--b3:#14507a;--b4:#3ab0c8;--panel:#dff0f8;--ct:#1c3a52}
#stage[data-w="5"]{--ink:#06243a;--hd:#bff3ff;--b1:#1a8aa8;--b2:#a0ecff;--b3:#0a4560;--b4:#e85a7a;--panel:#0f4a6a;--ct:#d8f6ff}
#stage[data-w="6"]{--ink:#0a0a20;--hd:#d6c8ff;--b1:#5a3ac0;--b2:#c8baff;--b3:#241660;--b4:#2fa8d8;--panel:#1a1a40;--ct:#dcd8ff}
/* world themes for all text and buttons */
#stage[data-w="1"]{--ink:#0a1233;--hd:#a9d4ff;--b1:#2a4fa8;--b2:#9fc4ff;--b3:#0e2058;--b4:#2fa88a;--panel:#1c2a5a;--ct:#dce8ff}
#stage[data-w="2"]{--ink:#2a0508;--hd:#ffb02e;--b1:#b3200f;--b2:#ffb02e;--b3:#4a0a06;--b4:#e8741a;--panel:#2a0c14;--ct:#ffd9a0}
#stage[data-w="1"] :is(h1,h2,p,.sub){text-shadow:0 0 calc(var(--s)*10px) rgba(120,170,255,.6)}
#stage[data-w="2"] :is(h1,h2,p,.sub){text-shadow:0 0 calc(var(--s)*12px) rgba(255,110,20,.85)}
#stage[data-w="1"] #shop{background:rgba(10,16,46,.94)}
#stage[data-w="2"] #shop{background:rgba(34,6,8,.94)}
</style>
</head>
<body>
<main id="stage">
<canvas id="c" role="img" aria-label="Flappy Bird game"></canvas>
<div class="ui">
<div id="hud"><button id="lbb" class="btn ic" aria-label="Leaderboard" title="Leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg></button><button id="setb" class="btn ic" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button></div>
<div id="start" class="panel"><h1>Flappy Bird</h1><p>Tap, click or press Space to flap</p><button id="play" class="btn">Play</button><div class="row2"><button id="skb" class="btn sm2">Skill Tree</button><button id="shopb" class="btn sm2">Worlds</button></div><div id="ptsT" class="sub"></div></div>
<div id="get" class="panel hide"><h2>Get ready!</h2><p>Tap to flap</p></div>
<div id="over" class="panel hide"><h2>Game over</h2><div class="card"><i id="medal"></i><span>Score</span><b id="fs">0</b><span>Best</span><b id="fb">0</b></div><p id="tot"></p><button id="again" class="btn">Restart</button></div>
<div id="shop" class="ov hide"><div class="sh"><b>Worlds</b><span id="pts"></span><button id="sclose" class="btn sm">Back</button></div><div id="items"></div></div>
<div id="skp" class="ov hide"><div class="skh"><h2>SKILL TREE</h2><div class="chip"><i class="coin"></i><span id="skpts">0</span></div><button id="skc" class="btn sm">Back</button></div><div id="skbody"></div></div>
<div id="tutsw" class="hide"></div>
<button id="dbtn" class="btn hide">DASH</button>
<div id="lbp" class="ov hide"><div class="sh"><b>Leaderboard</b><button id="lbc" class="btn sm">Back</button></div><div id="lbs" class="det"></div><div id="lbl"></div></div>
<div id="setp" class="ov hide"><div class="sh"><b>Settings</b><button id="setc" class="btn sm">Back</button></div>
<div class="det"><p>Flap: left click, tap or Space<br>Dash: right click or Shift<br>(touch: the DASH button)</p></div>
<div class="it"><span>Sound</span><button id="mute2" class="btn sm">On</button></div>
<div class="it"><span>Tutorial</span><button id="tutb" class="btn sm">Replay</button></div>
<div class="it"><span>Progress</span><button id="rst" class="btn sm">Reset</button></div></div>
<button id="skip" class="btn sm hide">Skip</button>
</div>
</main>
<script>
(()=>{
const W=288,H=512,GY=432,PW=52,CAP=26,GAP=105,SPD=120,SPACING=170,G=900,FLAP=-276,VMAX=600,BX=84,R=12,STEP=1/120,INK='#543847';
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d'),stage=$('stage');
let s=1;
function fit(){
  const bw=document.body.clientWidth,bh=document.body.clientHeight;
  s=Math.max(.3,Math.min(bw/W,bh/H));
  const dpr=Math.min(window.devicePixelRatio||1,3);
  stage.style.width=W*s+'px';stage.style.height=H*s+'px';stage.style.setProperty('--s',s);
  cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);
}
addEventListener('resize',fit);

/* ---------- audio ---------- */
let ac,muted=false;
function tone(f1,f2,dur,type,vol,delay){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  flap:()=>tone(380,760,.09,'square',.06),
  score:()=>{tone(988,988,.07,'square',.06);tone(1319,1319,.14,'square',.06,.07);},
  hit:()=>{tone(260,40,.3,'sawtooth',.1);tone(120,40,.2,'square',.08);},
  dash:()=>tone(180,720,.4,'sawtooth',.05)
};
function toggleMute(){muted=!muted;$('mute2').textContent=muted?'Off':'On';$('mute2').setAttribute('aria-pressed',muted);}

/* ---------- state ---------- */
let state,time=0,bird,pipes,score,best=0,scroll,flash,shake,pop,overAt=0,lastGap,armed=false;
try{best=+localStorage.getItem('fb-best')||0}catch(e){}
function show(){
  $('start').classList.toggle('hide',state!=='ready'||armed);
  $('get').classList.toggle('hide',state!=='ready'||!armed);
  $('over').classList.toggle('hide',state!=='over');
  $('hud').classList.toggle('hide',state==='play'||state==='dying'||state==='tut');
  $('skip').classList.toggle('hide',state!=='tut'||!save.tuts[tutId]);
  $('dbtn').classList.toggle('hide',!(COARSE&&hasSk('dash')&&(state==='play'||state==='tut')));
}
function reset(){
  bird={y:230,vy:0,rot:0};pipes=[];score=0;scroll=0;flash=0;shake=0;pop=0;lastGap=250;state='ready';armed=false;dash=2;dashing=false;holding=false;dashCd=0;dashLock=false;holdT=0;runT=0;show();refreshPts();
}
function spawn(x){
  const c=Math.min(317,Math.max(115,lastGap+(Math.random()*2-1)*140));
  const gp=(T.gap||GAP)+(hasSk('wide')?10:0);lastGap=c;pipes.push({x,top:c-gp/2,gap:gp,scored:false});
}
function flap(){
  if(state==='ready'){state='play';shield=hasSk('shield')?1:0;inv=0;dash=2;runT=0;spawn(W+30);show();}
  if(state==='play'){bird.vy=FLAP*(hasSk('soft')?.94:1)*(T.fm||1);sfx.flap();}
  if(state==='tut')tutFlap();
}
function press(){
  if(overlayOpen())return;
  if(state==='over'){if(time-overAt>.4)reset();}
  else if(state!=='dying')flap();
}
function die(){
  state='dying';dashing=false;holding=false;flash=1;shake=.25;sfx.hit();addRun();
  if(score>best){best=score;try{localStorage.setItem('fb-best',best)}catch(e){}}
}
function land(){
  bird.y=GY-R;bird.vy=0;state='over';overAt=time;
  $('fs').textContent=score;$('fb').textContent=best;$('tot').textContent='+'+lastEarn+' points, total '+save.pts;
  const mc=score>=40?'#e8f3f5':score>=30?'#f5c542':score>=20?'#c4c9cf':score>=10?'#c9803f':'';
  $('medal').style.background=mc||'transparent';$('medal').style.visibility=mc?'visible':'hidden';show();
}
function hitRect(x,y,w,h){
  const dx=BX-Math.max(x,Math.min(BX,x+w)),dy=bird.y-Math.max(y,Math.min(bird.y,y+h));
  const rr=R-1-(hasSk('tiny')?3:0);return dx*dx+dy*dy<rr*rr;
}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(state==='tut'){updTut(dt);return;}
  if(state==='play'){
    runT+=dt;dashTick(dt);
  }else dashing=false;
  const sm=(T.sp||1)*(dashing?DASHM:1),soft=hasSk('soft');
  if(state==='ready'||state==='play')scroll+=SPD*sm*dt;
  if(state==='ready'){bird.y=230+Math.sin(time*5)*6;}
  else if(state==='play'||state==='dying'){
    if(dashing)bird.vy=0;
    else bird.vy=Math.min(VMAX*(soft?.85:1),bird.vy+G*(soft?.88:1)*(T.gm||1)*dt);
    bird.y+=bird.vy*dt;
  }
  const tgt=dashing?0:bird.vy<0?-.45:Math.min(1.45,bird.vy*.0028);
  bird.rot+=(tgt-bird.rot)*Math.min(1,dt*14);
  if(state==='play'){
    for(const p of pipes)p.x-=SPD*sm*dt;
    if(pipes[0].x+PW+CAP<0)pipes.shift();
    const L=pipes[pipes.length-1];
    if(L.x<=W-SPACING)spawn(L.x+SPACING);
    if(bird.y<R){bird.y=R;if(bird.vy<0)bird.vy=0;}
    for(const p of pipes){
      if(!p.scored&&p.x+PW/2<BX){p.scored=true;score++;pop=1;sfx.score();}
      const b=p.top+p.gap;
      if(inv<=0&&(hitRect(p.x,-500,PW,p.top+500)||hitRect(p.x-2,p.top-CAP,PW+4,CAP)||hitRect(p.x,b,PW,H)||hitRect(p.x-2,b,PW+4,CAP))){
        if(shield>0){shield--;inv=1.2;flash=.5;sfx.hit();bird.vy=FLAP*.6;}else{die();break;}
      }
    }
    if(state==='play'&&bird.y+R>=GY){die();land();}
  }else if(state==='dying'&&bird.y+R>=GY)land();
  inv=Math.max(0,inv-dt);pop=Math.max(0,pop-dt*5);flash=Math.max(0,flash-dt*3);shake=Math.max(0,shake-dt);
}

const SPR=["......KKKKKK.....","....KKYYYYKWK....","...KYYYYYKWWWK...",".KKKKKYYYKWWKWK..","KWWWWWKYYKWWKWK..","KWWWWWKKYYKWWWK..","KYWWWWYKYYYKKKKK.",".KYYYYKYYYKRRRRRK","..KKKKYYYKRKKKKKK",".....KYYYYKRRRRKK","......KKYYYKKKKK.","........KKK......"];
function mk(PAL){return [-1,0,1].map(o=>{
  const c=document.createElement('canvas');c.width=34;c.height=24;const g=c.getContext('2d');
  const put=(rows,ox,oy)=>rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const k=PAL[r[x]];if(k){g.fillStyle=k;g.fillRect((ox+x)*2,(oy+y)*2,2,2);}}});
  put(SPR,0,0);
  if(o){const t=document.createElement('canvas');t.width=34;t.height=24;t.getContext('2d').drawImage(c,0,0);g.clearRect(0,6,14,12);g.fillStyle=PAL.Y;g.fillRect(12,8,2,10);g.drawImage(t,0,6,14,12,0,6+o*2,14,12);}
  return c;
});}
function drawBird(){
  cx.save();cx.translate(BX,bird.y);cx.rotate(bird.rot);
  const f=state==='dying'||state==='over'?1:[1,2,1,0][Math.floor(time*14)%4];
  if(inv>0&&Math.floor(time*18)%2)cx.globalAlpha=.4;
  cx.drawImage(FR[f],-17,-12);cx.globalAlpha=1;
  cx.restore();
  if(shield>0&&state!=='over'){cx.strokeStyle='rgba(120,220,255,'+(.6+.3*Math.sin(time*6))+')';cx.lineWidth=2;cx.beginPath();cx.arc(BX,bird.y,21,0,7);cx.stroke();}
}

const hs=n=>(((n*2654435761)>>>0)%1000)/1000;
let VIG;
function ridge(k,col,base,amp,sp){
  const sx=scroll*k,i0=Math.floor(sx/sp);
  cx.fillStyle=col;cx.beginPath();cx.moveTo(-sp,GY);
  for(let n=-1;n<W/sp+3;n++){const wi=i0+n,x=wi*sp-sx;cx.lineTo(x,base-amp*hs(wi));cx.lineTo(x+sp*.55,base-amp*.55*hs(wi+977));}
  cx.lineTo(W+sp*2,GY);cx.fill();
}
function crack(tx,ty,d,h,x,w){
  cx.beginPath();cx.moveTo(tx+1,ty+d*h*.18);cx.lineTo(tx-4+w*.1,ty+d*h*.36);cx.lineTo(tx+w*.12,ty+d*h*.5);cx.lineTo(x+w*.35,ty+d*h*.72);cx.stroke();
}
function slab(x,base,d,w,h,ln,ph){
  const tx=x+w*.35+ln,ty=base-d*h;
  cx.fillStyle='#7a2840';cx.beginPath();cx.moveTo(x,base);cx.lineTo(tx,ty);cx.lineTo(x+w*.5,base);cx.fill();
  cx.fillStyle='#45152c';cx.beginPath();cx.moveTo(x+w*.5,base);cx.lineTo(tx,ty);cx.lineTo(x+w*.92,base-d*h*.35);cx.lineTo(x+w,base);cx.fill();
  const a=.6+.4*Math.sin(time*2.5+ph);cx.lineJoin='round';
  cx.strokeStyle='rgba(255,90,20,'+.3*a+')';cx.lineWidth=6;crack(tx,ty,d,h,x,w);
  cx.strokeStyle='rgba(255,190,60,'+a+')';cx.lineWidth=2;crack(tx,ty,d,h,x,w);
}
function slabs(k,sp,base,d,h0,h1,wm){
  const sx=scroll*k,i0=Math.floor(sx/sp);
  for(let n=-1;n<W/sp+2;n++){const wi=i0+n,r=hs(wi*3+d);slab(wi*sp-sx+sp*.2*hs(wi+5),base,d,wm+r*30,h0+r*(h1-h0),(hs(wi+11)-.5)*30,wi);}
}

function pipeBody(x,y,w,h,P){

  cx.fillStyle=g;cx.fillRect(x,y,w,h);

    cx.fillStyle='rgba(255,255,255,.05)';for(let k=y+14;k<y+h;k+=20)cx.fillRect(x+3,k,w-6,2);
    const a=.65+.35*Math.sin(time*3+y*.05);cx.lineJoin='round';
    for(let pass=0;pass<2;pass++){
      cx.strokeStyle=pass?'rgba(255,205,90,'+a+')':'rgba(255,90,20,'+.28*a+')';cx.lineWidth=pass?1.5:5;cx.beginPath();
      for(let k=y+10;k<y+h-6;k+=34){
        const j=hs(k|0),m=x+8+j*(w-16);
        cx.moveTo(m,k);cx.lineTo(m-4+j*8,k+9);cx.lineTo(m+3,k+17);cx.lineTo(m-2+j*6,k+27);
        cx.moveTo(m-1,k+9);cx.lineTo(m+(j>.5?10:-10),k+15);

function drop(x,y,len,w){

function lavaFx(p,b){
  const a=.7+.3*Math.sin(time*4+p.top);
  const g1=cx.createLinearGradient(0,p.top,0,p.top+28);g1.addColorStop(0,'rgba(255,110,30,.4)');g1.addColorStop(1,'rgba(255,110,30,0)');

  cx.fillStyle=g2;cx.fillRect(p.x-2,b-28,PW+4,28);

      p.x-=SPD*(dashing?DASHM:1)*dt;
      const b=p.top+p.gap;
      if(hitRect(p.x,-500,PW,p.top+500)||hitRect(p.x-2,p.top-CAP,PW+4,CAP)||hitRect(p.x,b,PW,H)||hitRect(p.x-2,b,PW+4,CAP)){
        if(k==='shield'){if(shield>0){shield--;inv=1.2;flash=.5;sfx.hit();tutBegin(tutI+1);return;}}
        else{tutRetry();break;}
      }
      if(k==='gaps'&&!p.scored&&p.x+PW/2<BX){p.scored=true;tutScore++;score=tutScore;pop=1;sfx.score();}
      if(k==='shield'&&p.x+PW+CAP<BX-30){pipes=[];tutSp=0;break;}
    }
    if(k==='gaps'&&tutScore>=st.n){tutBegin(tutI+1);return;}
  }
  const tgt=dashing?0:bird.vy<0?-.45:Math.min(1.45,bird.vy*.0028);
  bird.rot+=(tgt-bird.rot)*Math.min(1,dt*14);
  pop=Math.max(0,pop-dt*5);flash=Math.max(0,flash-dt*3);shake=Math.max(0,shake-dt);
}
function drawDashFx(){
  if(!dashing)return;
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2;cx.beginPath();
  for(let i=0;i<14;i++){const x=W-((time*1100+i*97)%(W+80))+20,y=(i*53)%GY;cx.moveTo(x,y);cx.lineTo(x+50+(i%3)*14,y);}
  cx.stroke();
}
const DASHM=1.45;
function dashTick(dt){
  if(!holding)dashLock=false;
  const was=dashing;
  if(hasSk('dash')&&holding&&!dashLock&&dash>0&&(was||dash>=.5)){
    dashing=true;dashSum+=dt;dash=Math.max(0,dash-dt);dashCd=.8;
    if(!was)sfx.dash();
    if(dash<=0){dashing=false;dashLock=true;}
  }else{
    dashing=false;
    if(dashCd>0)dashCd-=dt;else dash=Math.min(2,dash+dt*(hasSk('recharge')?.6:.3));
  }
}
function drawMeter(){
  let v=-1;
  const k=tutKind();
  if(state==='play'&&hasSk('dash'))v=dash/2;
  else if(k==='dash'||k==='charge')v=dash/2;
  if(v<0)return;
  const x=W/2-32,y=100;
  cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(x-2,y-2,68,11);
  cx.fillStyle=dashing?'#fff':(dashLock||dash<.5)?'#ff9a7a':'#7fe9ff';cx.fillRect(x,y,64*Math.max(0,v),7);
  cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(x+16,y,1,7);
}
function drawTut(){
  const t=tutT,st=tutSteps[tutI],k=st.k,end=k==='end',bar=56*Math.min(1,t/1.2)*(end?Math.max(0,Math.min(1,(4.2-tutS)/.6)):1);
  cx.fillStyle='#000';cx.fillRect(0,0,W,bar);cx.fillRect(0,H-bar,W,bar);
  cx.textAlign='center';cx.textBaseline='middle';
  let a=Math.min(1,Math.max(0,(t-1.2)/.5));
  a=Math.min(a,k==='intro'?Math.max(0,(3.4-tutS)/.4):tutS/.4);
  const c=(k==='charge'&&dashSum>=1&&st.c2)?st.c2:st.c;
  cx.globalAlpha=a;
  cx.fillStyle='#fff';cx.font='9px "Press Start 2P",ui-monospace,monospace';cx.fillText(c[0],W/2,H-bar+20);
  cx.fillStyle='#ffd25a';cx.font='6px "Press Start 2P",ui-monospace,monospace';cx.fillText(c[1],W/2,H-bar+40);
  cx.globalAlpha=1;
  const z=tutZ(),sx=W/2+(BX-W/2)*z,sy=H/2+(bird.y-H/2)*z,rr=t-tutRing;
  if(rr<.35){cx.strokeStyle='rgba(255,255,255,'+(1-rr/.35)+')';cx.lineWidth=2;cx.beginPath();cx.arc(sx,sy,14+rr*90,0,7);cx.stroke();}
  cx.font='7px "Press Start 2P",ui-monospace,monospace';cx.lineWidth=3;cx.lineJoin='round';
  const tx=(m,y)=>{cx.strokeStyle='#000';cx.strokeText(m,W/2,y);cx.fillStyle='#fff';cx.fillText(m,W/2,y);};
  const kb=(m,on)=>{cx.fillStyle=on?'#fff':'rgba(255,255,255,.4)';cx.fillRect(W/2-48,142,96,16);cx.fillStyle='#000';cx.fillText(m,W/2,150);};
  if(k==='flap'){tx('FLAPS '+tutFlaps+'/'+st.n,100);kb('SPACE / CLICK',t-tutRing<.25);}
  if(k==='gaps')tx('GAPS '+tutScore+'/'+st.n,100);
  if(k==='shield')tx('HIT THE PIPE',100);
  if(k==='dash'||k==='charge'){
    const goal=k==='dash'?st.n:1;
    if(!(k==='charge'&&dashSum>=goal)){
      cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(W/2-34,116,68,9);
      cx.fillStyle='#ffd25a';cx.fillRect(W/2-32,118,64*Math.min(1,dashSum/goal),5);
    }else tx('RECHARGING',120);
    kb('RIGHT CLICK',holding);
  }
  const fa=Math.max(1-t/1.4,end?(tutS-3.3)/.9:0,0);
  if(fa>0){cx.fillStyle='rgba(0,0,0,'+Math.min(1,fa)+')';cx.fillRect(0,0,W,H);}
}
function drawScore(){
  cx.textAlign='center';cx.textBaseline='middle';
  cx.font=`${Math.round(28*(1+.3*pop))}px "Press Start 2P",ui-monospace,monospace`;
  cx.lineWidth=6;cx.lineJoin='round';cx.strokeStyle=T.lava?'#3a0508':T.stars?'#0a1233':'#000';cx.strokeText(score,W/2,78);
  cx.fillStyle=T.lava?'#ffd25a':T.stars?'#e8f0ff':'#fff';if(T.lava){cx.shadowColor='#ff6a1a';cx.shadowBlur=10;}cx.fillText(score,W/2,78);cx.shadowBlur=0;
}
function draw(){
  cx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  cx.imageSmoothingEnabled=false;
  cx.save();
  if(shake>0)cx.translate((Math.random()-.5)*40*shake,(Math.random()-.5)*40*shake);
  if(state==='tut'){const z=tutZ();cx.translate(W/2,H/2);cx.scale(z,z);cx.translate(-W/2,-H/2);}
  drawBg();drawPipes();drawGround();if(T.lava)lavaFront();drawDashFx();drawBird();
  if(state!=='ready'&&!(state==='tut'&&tutKind()!=='gaps'))drawScore();
  drawMeter();
  if(flash>0){cx.fillStyle='rgba(255,255,255,'+flash*.85+')';cx.fillRect(-10,-10,W+20,H+20);}
  cx.restore();
  if(state==='tut')drawTut();
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000||0);last=t;acc+=dt;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  draw();
}

/* ---------- input (bound once) ---------- */
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.ov'))return;e.preventDefault();if(e.button===2){holding=true;return;}if(e.button>0)return;press();});
addEventListener('pointerup',e=>{if(e.button===2)holding=false;});
addEventListener('pointercancel',()=>{holding=false;});
stage.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press();}else if(e.code==='Enter'&&state==='tut'&&save.tuts[tutId])endTut();
  else if(e.code==='KeyM'&&!e.repeat)toggleMute();else if(e.code==='Escape')closeAll();
});
addEventListener('keyup',e=>{if(e.code==='Space')e.preventDefault();});
addEventListener('keydown',e=>{if(e.key==='Shift'&&!e.repeat)holding=true;});
addEventListener('keyup',e=>{if(e.key==='Shift')holding=false;});
addEventListener('blur',()=>{holding=false;});
$('play').addEventListener('click',e=>{e.currentTarget.blur();if(state==='ready'){armed=true;show();}});
$('again').addEventListener('click',e=>{e.currentTarget.blur();if(state==='over'&&time-overAt>.4)reset();});

$('shopb').addEventListener('click',e=>{e.currentTarget.blur();openShop(true);});
$('sclose').addEventListener('click',e=>{e.currentTarget.blur();openShop(false);});
$('shop').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;renderShop();}});
$('lbb').addEventListener('click',e=>{e.currentTarget.blur();openLb(true);});
$('lbc').addEventListener('click',e=>{e.currentTarget.blur();openLb(false);});
$('setb').addEventListener('click',e=>{e.currentTarget.blur();$('setp').classList.remove('hide');});
$('setc').addEventListener('click',e=>{e.currentTarget.blur();$('setp').classList.add('hide');});
$('mute2').addEventListener('click',e=>{e.currentTarget.blur();toggleMute();});
$('tutb').addEventListener('click',e=>{e.currentTarget.blur();startTut('jump','');});
$('skip').addEventListener('click',e=>{e.currentTarget.blur();endTut();});
let rsOk=false;
$('rst').addEventListener('click',e=>{
  const b=e.currentTarget;b.blur();
  if(!rsOk){rsOk=true;b.textContent='Sure?';setTimeout(()=>{rsOk=false;b.textContent='Reset';},3000);return;}
  save={pts:0,own:['w0'],eq:{w:0},sk:['jump'],col:'#ffeb2f',lb:[],longest:0,tuts:{jump:1}};persist();apply();reset();closeAll();rsOk=false;b.textContent='Reset';
});
$('skb').addEventListener('click',e=>{e.currentTarget.blur();openTree(true);});
$('skc').addEventListener('click',e=>{e.currentTarget.blur();openTree(false);});
const db=$('dbtn');
db.addEventListener('pointerdown',e=>{e.preventDefault();holding=true;});
['pointerup','pointercancel','pointerleave'].forEach(t=>db.addEventListener(t,()=>{holding=false;}));
apply();reset();fit();if(!save.tuts.jump)startTut('jump','');requestAnimationFrame(frame);
})();
</script>
