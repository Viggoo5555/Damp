<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battleship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--ink:#06121b;--panel:#0b1f2d;--panel2:#12304a;--line:#2d5878;--brass:#f0b84a;--brass2:#b9801d;--red:#ff5a47;--ok:#46e08a;--fg:#e8f1f6;--dim:#8fa9ba;
 --d:Anton,Impact,"Arial Narrow",sans-serif;--b:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--b);font-weight:600;font-size:18px;overflow:hidden;
 user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000a 100%)}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}

/* buttons */
.btn{--c:var(--brass);position:relative;border:0;padding:11px 22px 10px;background:linear-gradient(#ffd877,var(--c) 55%,var(--brass2));color:#2a1900;
 font:700 20px/1 var(--b);letter-spacing:.08em;text-transform:uppercase;
 clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(1) brightness(.55);cursor:default;transform:none}
.btn.alt{--c:#6fc3ee;background:linear-gradient(#bfe8ff,var(--c) 55%,#2a78a8);color:#04202f}
.btn.ghost{background:#12304acc;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:8px 14px 7px;font-size:16px}
.btn.pulse:not([disabled]){animation:pu 1s infinite alternate}@keyframes pu{to{filter:brightness(1.3)}}
.chip{background:#0b1f2de6;border:2px solid var(--line);color:var(--fg);padding:6px 12px;font:700 16px/1 var(--b);letter-spacing:.08em;text-transform:uppercase}
.chip.on{border-color:var(--brass);color:var(--brass)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 12px 10px}
#hud>*{pointer-events:auto}
#top{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#top .sp{flex:1;pointer-events:none}
#turn{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:200px;max-width:56vw;text-align:center;pointer-events:none;
 background:linear-gradient(#0d2a40f2,#081a28f2);border:2px solid var(--line);border-top:0;padding:6px 18px 8px;
 clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,14px 100%)}
#turn b{display:block;font:400 26px/1.05 var(--d);letter-spacing:.07em;color:var(--brass);text-transform:uppercase}
#turn span{display:block;font-size:15px;color:var(--dim);letter-spacing:.05em;margin-top:1px}
#turn.enemy b{color:var(--red)}
#fleets{position:absolute;top:62px;left:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.fl{background:#07141fcc;border:2px solid var(--line);padding:6px 10px 8px;min-width:126px}
.fl h4{margin:0 0 4px;font:600 13px/1 var(--b);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.fl .row{display:flex;align-items:center;gap:7px;margin-top:5px;min-height:15px}
.fl .row i{display:block;height:7px;width:calc(var(--n)*9px);background:#9db3c2;transform:skewX(-24deg);border-radius:1px}
.fl .row.dead i{background:var(--red);opacity:.5}
.fl .row.dead{text-decoration:line-through}
#views{display:flex;gap:6px}
#bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap;pointer-events:none}
#bottom>*{pointer-events:auto}
#hint{position:absolute;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0));text-align:center;color:var(--fg);font-size:17px;letter-spacing:.05em;
 text-shadow:0 1px 3px #000,0 0 12px #000;pointer-events:none}
#log{position:absolute;right:12px;top:62px;width:min(260px,44vw);display:flex;flex-direction:column;gap:3px;align-items:flex-end;pointer-events:none}
#log div{background:#07141fcc;border-right:3px solid var(--brass);padding:3px 9px;font-size:15px;letter-spacing:.04em;animation:lg 6s forwards}
#log div.bad{border-color:var(--red)}#log div.good{border-color:var(--ok)}
@keyframes lg{0%{opacity:0;transform:translateX(14px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;
 font:400 clamp(44px,12vw,120px)/1 var(--d);font-style:italic;letter-spacing:.04em;color:var(--brass);-webkit-text-stroke:3px #5a2a00;paint-order:stroke fill;
 filter:drop-shadow(0 6px 0 #000a) drop-shadow(0 0 22px #1b6fd0);opacity:0}
#banner.on{animation:bn 1.5s ease-out forwards}#banner.red{color:#ff6a55;-webkit-text-stroke-color:#400}
@keyframes bn{0%{opacity:0;transform:scale(1.7)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.96)}}
#banner.stay{animation:bs .6s ease-out forwards}@keyframes bs{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:none}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,#e6141fbb 100%);opacity:0}
#flash.on{animation:hu .5s}@keyframes hu{from{opacity:1}to{opacity:0}}

/* screens */
.screen{position:absolute;inset:0;display:flex;align-items:center;padding:0 clamp(16px,6vw,90px);z-index:5;
 background:linear-gradient(90deg,#040c13f0 0,#040c13c2 42%,#040c1300 78%);pointer-events:none}
.screen>*{pointer-events:auto}
.screen.mid{justify-content:center;background:radial-gradient(ellipse at center,#040c13dd,#040c13aa 70%,#040c1355)}
.col{display:flex;flex-direction:column;gap:12px;width:min(460px,100%);max-height:100%;overflow:visible;padding:12px 8px 12px 0}
#lobby .col{overflow-y:auto;padding-right:8px}
.logo{white-space:nowrap;font:400 clamp(38px,6.6vw,80px)/.9 var(--d);font-style:italic;letter-spacing:.02em;color:var(--brass);-webkit-text-stroke:3px #5a2a00;paint-order:stroke fill;
 filter:drop-shadow(0 5px 0 #000a) drop-shadow(0 0 24px #1b6fd0);transform:skewX(-6deg)}
.logo small{display:block;font:700 clamp(13px,2vw,18px)/1 var(--b);font-style:normal;letter-spacing:.34em;color:#fff;-webkit-text-stroke:0;margin-top:10px;filter:none;opacity:.9}
.panel{background:#0b1f2df2;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font:400 28px/1 var(--d);letter-spacing:.05em;color:var(--brass);text-transform:uppercase}
.panel h3{margin:6px 0 0;font:700 14px/1 var(--b);letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.panel p{margin:0;color:var(--dim);line-height:1.3;font-size:17px}
.panel p.bad{color:var(--red)}.panel p.ok{color:var(--ok)}
.seg{display:flex;gap:6px}.seg .chip{flex:1;cursor:pointer;text-align:center}
.code{font:400 clamp(40px,8vw,56px)/1 var(--d);letter-spacing:.22em;color:var(--brass);text-align:center;min-height:1.1em}
input[type=text]{width:100%;background:#06121b;border:2px solid var(--line);color:var(--fg);padding:9px 11px;font:700 18px/1 var(--b);letter-spacing:.05em;outline:none;user-select:text;-webkit-user-select:text}
input[type=text]:focus{border-color:var(--brass)}
.irow{display:flex;gap:8px}
.people{display:flex;flex-direction:column;gap:5px;max-height:min(30vh,220px);overflow:auto}
#lbAuth{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
#lbAuth p{margin:0;font-size:15px;color:var(--dim)}
input[type=password]{width:100%;background:#06121b;border:2px solid var(--line);color:var(--fg);padding:9px 11px;font:700 18px/1 var(--b);letter-spacing:.05em;outline:none;user-select:text;-webkit-user-select:text}
input[type=password]:focus{border-color:var(--brass)}
.pp .dot{width:8px;height:8px;border-radius:50%;background:#33526b;flex:none}
.pp .dot.on{background:var(--ok);box-shadow:0 0 6px #46e08a99}
.pp .st{margin-left:auto;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pp{display:flex;align-items:center;gap:8px;background:#06121b;border:2px solid #1b3a52;padding:5px 5px 5px 11px}
.pp span{flex:1;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pp.sent{border-color:var(--ok)}
.lang{position:absolute;top:calc(10px + env(safe-area-inset-top,0));right:12px;z-index:6;display:flex;gap:6px}
#end .col{align-items:center;text-align:center;width:min(480px,100%)}
#end h1{margin:0;font:400 clamp(48px,11vw,104px)/1 var(--d);font-style:italic;color:var(--brass);-webkit-text-stroke:3px #5a2a00;paint-order:stroke fill;filter:drop-shadow(0 0 24px #1b6fd0)}
#end.lose h1{color:#ff6a55;-webkit-text-stroke-color:#400}
.stats{display:flex;gap:18px;justify-content:center;color:var(--dim);font-size:18px;letter-spacing:.06em}.stats b{color:var(--fg);font-size:24px;display:block}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:9;background:#0b1f2def;border:2px solid var(--brass);padding:9px 16px;letter-spacing:.05em;max-width:88vw;text-align:center;pointer-events:none}
#shot{position:absolute;pointer-events:none}
@media (max-width:640px){
 .screen{background:linear-gradient(0deg,#040c13f5 0,#040c13d0 62%,#040c1320 100%);align-items:flex-end}
 .screen.mid{align-items:center}
 #top .chip{padding:5px 8px;font-size:13px;white-space:nowrap}
 #views{gap:4px}
 #bMenu span{display:none}
 #turn{top:54px;min-width:150px;max-width:94vw;padding:4px 14px 6px}
 #turn b{font-size:20px}#turn span{display:none}
 #fleets{top:auto;bottom:calc(88px + env(safe-area-inset-bottom,0));left:10px;right:10px;flex-direction:row;justify-content:center;gap:8px}
 .fl{display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center;padding:5px 8px;min-width:0;flex:1;max-width:200px}
 .fl h4{display:block;flex:0 0 100%;margin:0;font-size:11px}
 .fl .row{margin:0;min-height:0}.fl .row span{display:none}
 .fl .row i{width:calc(var(--n)*5px)}
 #log{display:none}
 #bottom{gap:6px}
 .btn{padding:10px 14px 9px;font-size:17px}
}
@media (max-height:520px){#fleets{display:none}}
</style></head>
<body>
<div id="app">
 <canvas id="gl" tabindex="0"></canvas>
 <div id="vig"></div>

 <div id="hud" class="hide">
  <div id="top">
   <button class="chip" id="bMenu">&larr; <span data-t="menu">Menu</span></button>
   <div class="sp"></div>
   <button class="chip hide" id="bResult" data-t="result">Result</button>
   <div id="views" class="hide">
    <button class="chip" id="vMine" data-t="vMine">My fleet</button>
    <button class="chip" id="vEnemy" data-t="vEnemy">Enemy waters</button>
   </div>
   <button class="chip" id="bSnd" aria-label="Sound">&#9835;</button>
  </div>
  <div id="turn"><b id="turnT"></b><span id="turnS"></span></div>
  <div id="fleets" class="hide">
   <div class="fl" id="flMine"><h4 data-t="yourFleet">Your fleet</h4></div>
   <div class="fl" id="flEnemy"><h4 data-t="enemyFleet">Enemy fleet</h4></div>
  </div>
  <div id="log"></div>
  <div id="hint"></div>
  <div id="bottom">
   <div id="bPlace" class="btns hide">
    <button class="btn alt sm" id="bRotate" data-t="rotate">Rotate (R)</button>
    <button class="btn alt sm" id="bRandom" data-t="random">Random</button>
    <button class="btn ghost sm" id="bReset" data-t="reset">Reset</button>
    <button class="btn pulse" id="bReady" data-t="ready" disabled>Ready!</button>
   </div>
   <div id="bBattle" class="btns hide">
    <button class="btn pulse" id="bFire" data-t="fire" disabled>Fire!</button>
   </div>
  </div>
  <div id="banner"></div>
  <div id="flash"></div>
 </div>

 <div class="lang" id="lang"><button class="chip" id="lDa">DA</button><button class="chip" id="lEn">EN</button></div>

 <!-- main menu -->
 <div id="menu" class="screen">
  <div class="col">
   <div class="logo"><span data-t="title">BATTLESHIP</span><small data-t="sub">SINK THE FLEET</small></div>
   <div class="panel">
    <h3 data-t="level">Computer level</h3>
    <div class="seg"><button class="chip on" id="lvEasy" data-t="easy">Rookie</button><button class="chip" id="lvHard" data-t="hard">Admiral</button></div>
    <button class="btn" id="bAI" data-t="vsAI">Play vs computer</button>
    <button class="btn alt" id="bOnline" data-t="vsFriend">Play online with a friend</button>
   </div>
  </div>
 </div>

 <!-- online lobby -->
 <div id="lobby" class="screen hide">
  <div class="col">
   <div class="panel">
    <h2 data-t="onlineT">Play online</h2>
    <p id="lbStatus"></p>
    <div id="lbAuth" class="hide">
     <p id="lbAuthNote" data-t="signNote">Sign in with your Damp account, then pick a friend to invite.</p>
     <input type="text" id="lbName" placeholder="Username" autocomplete="username" autocapitalize="none">
     <input type="password" id="lbPass" placeholder="Password" autocomplete="current-password">
     <div class="irow"><button class="btn sm" id="lbSignIn" data-t="signIn">Sign in</button><button class="btn alt sm" id="lbSignUp" data-t="signUp">Create account</button></div>
    </div>
    <div id="lbMain">
     <h3 data-t="inviteT">Invite a friend by message</h3>
     <input type="text" id="lbFilter" data-ph="search" placeholder="Search…" autocomplete="off">
     <div class="people" id="lbPeople"></div>
     <h3 data-t="linkT">Or share the link / code</h3>
     <div class="code" id="lbCode"></div>
     <div class="irow"><input type="text" id="lbLink" readonly><button class="btn sm" id="lbCopy" data-t="copy">Copy</button></div>
     <h3 data-t="haveCode">Got a code?</h3>
     <div class="irow"><input type="text" id="lbJoin" maxlength="8" data-ph="codePh" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn alt sm" id="lbJoinBtn" data-t="join">Join</button></div>
    </div>
    <div class="btns"><button class="btn ghost sm" id="lbRetry" data-t="retry">Try again</button><button class="btn ghost sm" id="lbCancel" data-t="cancel">Cancel</button></div>
   </div>
  </div>
 </div>

 <!-- game over -->
 <div id="end" class="screen mid hide">
  <div class="col">
   <h1 id="endT"></h1>
   <p id="endS" style="margin:0;color:var(--dim);font-size:19px"></p>
   <div class="stats" id="endStats"></div>
   <div class="btns"><button class="btn" id="bAgain" data-t="again">Play again</button><button class="btn ghost" id="bBoard" data-t="board">Show boards</button><button class="btn ghost" id="bEndMenu" data-t="menu">Menu</button></div>
  </div>
 </div>
 <div id="toast" class="hide"></div>
</div>
<script>
'use strict';
/* =====================================================================
   Tiny WebGL engine (no libraries): meshes, water, decals, particles
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const damp = (k, dt) => 1 - Math.exp(-k * dt);

/* ---------- vector / matrix (column-major) ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const Mx = {
  ident() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  },
  persp(f, asp, n, fa) {
    const t = 1 / Math.tan(f / 2), m = new Float32Array(16);
    m[0] = t / asp; m[5] = t; m[10] = (fa + n) / (n - fa); m[11] = -1; m[14] = 2 * fa * n / (n - fa);
    return m;
  },
  lookAt(e, c, u) {
    const z = norm(sub(e, c)), x = norm(cross(u, z)), y = cross(z, x);
    return Float32Array.of(x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1);
  },
  trans(x, y, z) { const m = Mx.ident(); m[12] = x; m[13] = y; m[14] = z; return m; },
  scale(x, y, z) { const m = Mx.ident(); m[0] = x; m[5] = y; m[10] = z; return m; },
  rotY(a) { const m = Mx.ident(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
  rotX(a) { const m = Mx.ident(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
  rotZ(a) { const m = Mx.ident(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
  // T * Ry(yaw) * Rz(pitch) * Rx(roll) * S
  compose(x, y, z, yaw, pitch, roll, s) {
    let m = Mx.mul(Mx.trans(x, y, z), Mx.rotY(yaw));
    if (pitch) m = Mx.mul(m, Mx.rotZ(pitch));
    if (roll) m = Mx.mul(m, Mx.rotX(roll));
    if (s !== undefined && s !== 1) m = Mx.mul(m, Mx.scale(s, s, s));
    return m;
  }
};

/* ---------- geometry builder ---------- */
class Geo {
  constructor() { this.v = []; }
  vert(p, n, c) { this.v.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2]); }
  // convex polygon; flat normal (Newell), pointing away from `ref` when given
  poly(pts, c, ref) {
    let n = [0, 0, 0];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
    }
    n = norm(n);
    if (ref) {
      const m = [0, 0, 0]; pts.forEach(p => { m[0] += p[0] / pts.length; m[1] += p[1] / pts.length; m[2] += p[2] / pts.length; });
      if (dot(n, sub(m, ref)) < 0) n = [-n[0], -n[1], -n[2]];
    }
    for (let i = 1; i < pts.length - 1; i++) { this.vert(pts[0], n, c); this.vert(pts[i], n, c); this.vert(pts[i + 1], n, c); }
  }
  box(cx, cy, cz, w, h, d, c, top) {
    top = top === undefined ? 1 : top;
    const x = w / 2, y = h / 2, z = d / 2, tx = x * top, tz = z * top;
    const b = [[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z]], t = [[-tx, y, -tz], [tx, y, -tz], [tx, y, tz], [-tx, y, tz]];
    const P = p => [p[0] + cx, p[1] + cy, p[2] + cz], ref = [cx, cy, cz];
    this.poly(t.map(P), c, ref);
    this.poly(b.map(P), c, ref);
    for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; this.poly([b[i], b[j], t[j], t[i]].map(P), c, ref); }
  }
  // smooth cylinder / cone. axis: 'y' | 'x' | 'z'
  cyl(cx, cy, cz, rt, rb, h, c, seg, axis) {
    seg = seg || 14; axis = axis || 'y';
    const T = (p) => axis === 'x' ? [p[1], -p[0], p[2]] : axis === 'z' ? [p[0], -p[2], p[1]] : p;
    const O = p => { const q = T(p); return [q[0] + cx, q[1] + cy, q[2] + cz]; };
    const slope = (rb - rt) / h;
    for (let i = 0; i < seg; i++) {
      const a0 = i / seg * Math.PI * 2, a1 = (i + 1) / seg * Math.PI * 2;

  if (!keepPc) { try { LB.dc && LB.dc.close(); LB.pc && LB.pc.close(); } catch (e) { } LB.pc = null; LB.dc = null; }
  LB.code = '';
}
function connected(role, oppName) {
  clearTimeout(LB.timer);
  const pc = LB.pc, dc = LB.dc; LB.pc = LB.dc = null;
  if (LB.ref && FB) { FB.F.deleteDoc(LB.ref).catch(() => { }); } LB.ref = null; try { LB.unsub && LB.unsub(); } catch (e) { } LB.unsub = null;
  G.mode = 'online'; G.oppName = oppName || 'Enemy'; G.opp = new Remote(pc, dc, role, oppName);
  toast(t('connected', { n: G.oppName })); SND.horn();
  startPlacement();
}
function armTimeout() { clearTimeout(LB.timer); LB.timer = setTimeout(() => { lbStatus(t('lbFail'), 'bad'); $('lbRetry').classList.remove('hide'); }, 25000); }
function newPc() {
  const pc = new RTCPeerConnection(ICE);
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && G.phase === 'menu') { lbStatus(t('lbFailNet'), 'bad'); $('lbRetry').classList.remove('hide'); } };
  return pc;
}
async function hostRoom() {
  const keptCode = LB.code;
  await closeRoom(); LB.role = 'host'; $('lbCode').textContent = ''; $('lbLink').value = ''; lbStatus(t('lbPrep'));
  const fb = FB, pc = newPc(); LB.pc = pc; const dc = pc.createDataChannel('g'); LB.dc = dc;
  let guestName = '';
  dc.onopen = () => connected('host', guestName);
  await pc.setLocalDescription(await pc.createOffer()); await gathered(pc);
  const L = 'ABCDEFGHJKMNPQRSTUVWXYZ';
  const freshCode = () => 'B' + Array.from({ length: 4 }, () => L[Math.random() * L.length | 0]).join('');
  // Reuse the code when the host retries, so an invite that was already sent
  // still works. Writing the room without merge also clears any half-finished
  // guest from an earlier attempt (which would otherwise say "room is full").
  let code = /^B[A-Z]{4}$/.test(keptCode) ? keptCode : freshCode();
  let ref = fb.F.doc(fb.db, 'rooms', code);
  const room = () => ({ host: fb.auth.currentUser.uid, hostName: myName(), game: 'battleship', offer: { type: 'offer', sdp: pc.localDescription.sdp }, at: Date.now() });
  try {
    await fb.F.setDoc(ref, room());
  } catch (e) {
    for (let i = 0; i < 8; i++) {
      code = freshCode(); ref = fb.F.doc(fb.db, 'rooms', code);
      if ((await fb.F.getDoc(ref)).exists()) continue;
      await fb.F.setDoc(ref, room());
      break;
    }
  }
  LB.ref = ref; LB.code = code; $('lbCode').textContent = code; $('lbLink').value = inviteLink(code);
  lbStatus(t('lbWait'), 'ok'); $('lbRetry').classList.add('hide');
  LB.unsub = fb.F.onSnapshot(ref, s => {
    const d = s.data();
    if (d && d.answer && pc.signalingState === 'have-local-offer') { guestName = d.guestName || ''; lbStatus(t('lbJoining')); armTimeout(); pc.setRemoteDescription(d.answer).catch(() => { lbStatus(t('lbFail'), 'bad'); }); }
  });
}
async function joinRoom(raw) {
  const code = String(raw || '').trim().toUpperCase(); if (!code || LB.joining) return;
  LB.joining = true; lbStatus(t('lbJoining')); $('lbRetry').classList.add('hide');
  try {
    await closeRoom(); const fb = FB; LB.role = 'guest';
    const ref = fb.F.doc(fb.db, 'rooms', code), snap = await fb.F.getDoc(ref);
    if (!snap.exists()) { lbStatus(t('lbNoRoom'), 'bad'); return; }
    const d = snap.data();
    if (d.game && d.game !== 'battleship') { lbStatus(t('lbNoRoom'), 'bad'); return; }
    if (d.guest) { lbStatus(t('lbFull'), 'bad'); return; }
    if (Date.now() - (d.at || 0) > 45 * 60 * 1000) { lbStatus(t('lbOld'), 'bad'); return; }
    const pc = newPc(); LB.pc = pc;
    pc.ondatachannel = e => { LB.dc = e.channel; e.channel.onopen = () => connected('guest', d.hostName); };
    await pc.setRemoteDescription(d.offer); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc);
    await fb.F.updateDoc(ref, { guest: fb.auth.currentUser.uid, guestName: myName(), answer: { type: 'answer', sdp: pc.localDescription.sdp } });
    armTimeout();
  } catch (e) { lbStatus(t('lbErr', { e: (e && (e.code || e.message)) || '?' }), 'bad'); $('lbRetry').classList.remove('hide'); }
  finally { LB.joining = false; }
}
const presenceOn = at => !!at && Date.now() - at < 120000;
async function loadPeople() {
  const fb = FB, uid = fb.auth.currentUser.uid, map = new Map();
  try { (await fb.F.getDocs(fb.F.collection(fb.db, 'people'))).forEach(d => { if (d.id !== uid) map.set(d.id, { id: d.id, name: d.data().name || 'player', at: d.data().at || 0 }); }); } catch (e) { }
  try { (await fb.F.getDocs(fb.F.query(fb.F.collection(fb.db, 'flappy'), fb.F.limit(50)))).forEach(d => { if (d.id !== uid && !map.has(d.id)) map.set(d.id, { id: d.id, name: d.data().name || 'player', at: 0 }); }); } catch (e) { }
  LB.people = Array.from(map.values()).sort((a, b) => (presenceOn(b.at) ? 1 : 0) - (presenceOn(a.at) ? 1 : 0) || a.name.localeCompare(b.name));
  drawPeople();
}
function drawPeople() {
  const q = $('lbFilter').value.trim().toLowerCase(), box = $('lbPeople'); box.textContent = '';
  const list = LB.people.filter(p => !q || p.name.toLowerCase().indexOf(q) >= 0);
  if (!list.length) { const p = document.createElement('p'); p.textContent = t('lbNoPeople'); box.appendChild(p); return; }
  list.forEach(p => {
    const row = document.createElement('div'); row.className = 'pp' + (LB.sent[p.id] ? ' sent' : '');
    const dot = document.createElement('span'); dot.className = 'dot' + (presenceOn(p.at) ? ' on' : '');
    const n = document.createElement('span'); n.textContent = p.name;
    const st = document.createElement('span'); st.className = 'st';
    st.textContent = LB.sent[p.id] ? t('invited') : (presenceOn(p.at) ? t('online') : '');
    const b = document.createElement('button'); b.className = 'btn sm'; b.textContent = LB.sent[p.id] ? t('sent') : t('invite'); b.disabled = !LB.code;
    b.onclick = () => sendInvite(p, b); row.append(dot, n, st, b); box.appendChild(row);
  });
}
// the invite is an ordinary chat message, so it shows up in the site's People / message popup
async function sendInvite(p, btn) {
  if (!LB.code) return; btn.disabled = true;
  const fb = FB, me = fb.auth.currentUser.uid, id = pairId(me, p.id), chat = fb.F.doc(fb.db, 'chats', id), ids = [me, p.id].sort();
  const names = {}; names[me] = myName(); names[p.id] = p.name;
  const text = ('⚓ ' + t('inviteMsg') + ' ' + inviteLink(LB.code)).slice(0, 480), at = Date.now();
  try {
    await fb.F.setDoc(chat, { ids, names }, { merge: true });
    await fb.F.addDoc(fb.F.collection(fb.db, 'chats', id, 'messages'), { from: me, text, at });
    await fb.F.setDoc(chat, { ids, last: text.slice(0, 120), lastAt: at, lastFrom: me }, { merge: true });
    LB.sent[p.id] = true; lbStatus(t('lbSent', { n: p.name }), 'ok'); drawPeople();
  } catch (e) { btn.disabled = false; lbStatus(t('lbErr', { e: (e && (e.code || e.message)) || '?' }), 'bad'); }
}
async function openLobby(joinCode) {
  if (joinCode) LB.pendingCode = joinCode;
  G.mode = 'online'; hideAll(); langVis(true); $('lobby').classList.remove('hide'); $('lbMain').classList.add('hide'); $('lbRetry').classList.add('hide');
  $('lbLoginBtn') && $('lbLoginBtn').remove();
  lbStatus(t('lbJoining'));
  try {
    await fbInit();
    if (!FB.auth.currentUser) {
      lbStatus('');
      $('lbAuth').classList.remove('hide'); $('lbMain').classList.add('hide'); $('lbRetry').classList.add('hide');
      return;
    }
  } catch (e) { lbStatus(t('lbErr', { e: (e && (e.code || e.message)) || '?' }), 'bad'); $('lbRetry').classList.remove('hide'); return; }
  $('lbAuth').classList.add('hide');
  const code = joinCode || LB.pendingCode;
  if (code) { LB.pendingCode = ''; await joinRoom(code); return; }
  $('lbMain').classList.remove('hide'); drawPeople();
  try { await hostRoom(); drawPeople(); } catch (e) { lbStatus(t('lbErr', { e: (e && (e.code || e.message)) || '?' }), 'bad'); $('lbRetry').classList.remove('hide'); }
  loadPeople();
}
function leaveLobby() { closeRoom(); LB.sent = {}; showMenu(); }
async function lbSign(create) {
  try {
    const fb = await fbInit();
    const Au = await import(SDK + 'firebase-auth.js');
    const name = String($('lbName').value || '').trim().toLowerCase();
    const pass = $('lbPass').value;
    if (!name || name.length < 2 || pass.length < 6) { lbStatus(t('lbErr', { e: 'username / password' }), 'bad'); return; }
    const email = loginEmail(name);
    if (create) await Au.createUserWithEmailAndPassword(fb.auth, email, pass).catch(async e => {
      if (e.code === 'auth/email-already-in-use') return Au.signInWithEmailAndPassword(fb.auth, email, pass);
      throw e;
    });
    else await Au.signInWithEmailAndPassword(fb.auth, email, pass);
    $('lbPass').value = '';
    openLobby(LB.pendingCode || undefined);
  } catch (e) { lbStatus(t('lbErr', { e: (e && (e.code || e.message)) || '?' }), 'bad'); }
}
$('lbSignIn').onclick = () => lbSign(false);
$('lbSignUp').onclick = () => lbSign(true);
$('lbPass').onkeydown = e => { if (e.key === 'Enter') lbSign(false); };

/* =====================================================================
   Wiring + boot
   ===================================================================== */
$('lDa').onclick = () => setLang('da'); $('lEn').onclick = () => setLang('en');
$('lvEasy').onclick = () => { G.level = 'easy'; $('lvEasy').classList.add('on'); $('lvHard').classList.remove('on'); SND.click(); };
$('lvHard').onclick = () => { G.level = 'hard'; $('lvHard').classList.add('on'); $('lvEasy').classList.remove('on'); SND.click(); };
$('bAI').onclick = () => { SND.init(); SND.click(); G.mode = 'ai'; startPlacement(); };
$('bOnline').onclick = () => { SND.init(); SND.click(); openLobby(); };
$('lbCancel').onclick = leaveLobby;
$('lbRetry').onclick = () => openLobby();
$('lbFilter').oninput = drawPeople;
$('lbJoinBtn').onclick = () => joinRoom($('lbJoin').value);
$('lbJoin').onkeydown = e => { if (e.key === 'Enter') joinRoom($('lbJoin').value); };
$('lbCopy').onclick = () => {
  const v = $('lbLink').value; if (!v) return;
  const ok = () => toast(t('linkCopied'));
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(ok, () => { $('lbLink').select(); });
  else { $('lbLink').select(); try { document.execCommand('copy'); ok(); } catch (e) { } }
};
$('lbLink').onclick = () => $('lbLink').select();
$('bRotate').onclick = () => rotateShip(G.drag ? G.drag.s : G.sel);
$('bRandom').onclick = randomizeMine;
$('bReset').onclick = () => { ships.forEach(s => { s.y = Math.max(s.y, .2); sendHome(s); }); G.sel = null; SND.click(); refreshHud(); };
$('bReady').onclick = readyUp;
$('bFire').onclick = () => { if (G.aim) fireAt(G.aim[0], G.aim[1]); };
$('vMine').onclick = () => { SND.click(); setView('mine'); };
$('vEnemy').onclick = () => { SND.click(); setView('enemy'); };
$('bSnd').onclick = () => { SND.init(); SND.setMute(!SND.muted); refreshHud(); };
$('bMenu').onclick = () => { SND.click(); showMenu(); };
$('bEndMenu').onclick = () => { SND.click(); showMenu(); };
$('bBoard').onclick = () => { $('end').classList.add('hide'); const b = document.createElement('button'); b.className = 'btn sm'; b.id = 'bBack'; b.textContent = '↺'; b.style.cssText = 'position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0));z-index:7'; b.onclick = () => { b.remove(); $('end').classList.remove('hide'); }; $('app').appendChild(b); };
$('bAgain').onclick = () => {
  SND.click();
  if (G.mode === 'ai') { startPlacement(); return; }
  if (!G.opp || G.opp.dead) return;
  G.meAgain = true; G.opp.send({ t: 'again' }); $('bAgain').disabled = true; $('bAgain').textContent = t('waitOpp');
  if (G.oppAgain) startPlacement();
};

// a fresh round of an online match resets the opponent's per-round state
const _startPlacement = startPlacement;
startPlacement = function () {
  const b = $('bBack'); if (b) b.remove();
  _startPlacement();
  if (G.opp && G.opp.resetRound && G.mode === 'online') G.opp.resetRound();
};

window.addEventListener('pagehide', () => { try { if (G.opp && G.opp.close) G.opp.close(); closeRoom(); } catch (e) { } });
window.addEventListener('resize', () => { lastW = 0; });

applyLang(); SND.muted = SND.muted; showMenu(); refreshHud();
window.__bs = { G, BD, cam, camT, addPeg, boomAt, splashAt, ships: () => ships, toScreen, fireAt, readyUp, startPlacement: () => startPlacement(), randomizeMine, rayHit, setView };
(function () {
  const room = new URLSearchParams(location.search).get('room');
  if (room) { G.mode = 'online'; openLobby(room.toUpperCase()); }
})();
