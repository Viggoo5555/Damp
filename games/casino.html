<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Casino</title>
<meta name="theme-color" content="#0a0512">
<meta name="description" content="A 3D casino floor you play in three dimensions: click a table and the camera zooms in, then pick up 3D cards, chips, dice and reels and gamble your coins against the dealer or a friend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<style>
  :root{
    --gold:#e2b75e; --ink:#f7edda; --muted:rgba(247,237,218,.6);
    --line:rgba(226,183,94,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#07040c;color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:12px 16px;z-index:20;pointer-events:none;
    background:linear-gradient(rgba(7,4,12,.8),rgba(7,4,12,0))}
  .brand{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.22em;
    font-size:15px;text-transform:uppercase;color:var(--gold);white-space:nowrap;
    display:flex;align-items:center;gap:9px;text-shadow:0 0 18px rgba(226,183,94,.35)}
  .brand::before{content:"";width:9px;height:9px;background:var(--gold);transform:rotate(45deg);
    box-shadow:0 0 12px var(--gold);border-radius:1px}
  #stacks{display:flex;align-items:center;gap:8px;margin-left:auto;pointer-events:auto}
  .stack{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:rgba(20,10,26,.82);font-size:14px;line-height:1;white-space:nowrap}
  .stack b{font-variant-numeric:tabular-nums;font-weight:700}
  .stack small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .stack.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(226,183,94,.35),0 6px 22px rgba(226,183,94,.16)}
  .topup{border:1px solid var(--line);background:rgba(226,183,94,.12);color:var(--gold);
    border-radius:999px;padding:7px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;pointer-events:auto}
  #modes{display:none;padding:3px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid var(--line);pointer-events:auto}
  #modes.on{display:flex}
  #modes button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;
    padding:7px 12px;border-radius:999px;cursor:pointer}
  #modes button.on{background:linear-gradient(#f0cd80,#d3a448);color:#241605}
  #leave{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);
    border-radius:12px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    pointer-events:auto;white-space:nowrap}
  #leave[hidden]{display:none}

  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:15;
    padding:10px 18px;border-radius:999px;border:1px solid var(--line);
    background:rgba(16,8,22,.86);color:var(--ink);font-size:13.5px;text-align:center;
    backdrop-filter:blur(6px);transition:opacity .25s,transform .25s;pointer-events:none;max-width:94vw}
  #hint b{color:var(--gold);font-weight:600}
  #toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-12px);z-index:40;
    padding:10px 18px;border-radius:12px;background:rgba(226,183,94,.95);color:#1b0f04;
    font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:520px){
    #hud{padding:9px 10px;gap:8px}
    .brand{font-size:11.5px;letter-spacing:.13em}
    .stack{padding:6px 9px;font-size:12.5px;gap:5px}
    .stack small{display:none}
    #leave{display:none}
    #hint{font-size:12.5px;padding:8px 14px;bottom:14px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<header id="hud">
  <div class="brand">Velvet Casino</div>
  <div id="stacks"></div>
  <div id="modes">
    <button data-mode="dealer" class="on">Vs dealer</button>
    <button data-mode="friend">Vs friend</button>
  </div>
  <button id="leave" hidden>Leave</button>
</header>

<div id="hint">Click a <b>table</b> to walk over and play</div>
<div id="toast"></div>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "../vendor/three/RoundedBoxGeometry.js";

/* =====================================================================
   basics
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (n) => Math.floor(Math.random() * n);
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const easeOut = (k) => 1 - Math.pow(1 - k, 3);

let toastTimer = 0;
function toast(text) {
  const box = $("#toast");
  box.textContent = text;
  box.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("on"), 2000);
}
function hint(html) { $("#hint").innerHTML = html; }

/* =====================================================================
   wallet
   ===================================================================== */
const SAVE_KEY = "vc-wallet";
const wallet = { coins: 500, friend: 500 };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  if (raw && Number.isFinite(raw.coins)) {
    wallet.coins = clamp(Math.floor(raw.coins), 0, 9999999);
    wallet.friend = clamp(Math.floor(raw.friend || 500), 0, 9999999);
  }
} catch (e) { /* first visit */ }

let mode = "dealer";
let turn = "you";

function saveWallet() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(wallet)); } catch (e) { /* private */ }
}
function liveKey() { return mode === "friend" && turn === "friend" ? "friend" : "coins"; }
function stack() { return wallet[liveKey()]; }
function credit(amount) {
  wallet[liveKey()] = clamp(wallet[liveKey()] + Math.round(amount), 0, 9999999);
  saveWallet();
  renderHud();
}
function spend(amount) {
  if (stack() < amount) { toast("Not enough coins for that bet"); return false; }
  wallet[liveKey()] -= Math.round(amount);
  saveWallet();
  renderHud();
  return true;
}
function nextTurn() {
  if (mode !== "friend") return;
  turn = turn === "you" ? "friend" : "you";
  renderHud();
  toast(turn === "friend" ? "Friend's turn — pass the device" : "Your turn");
}
function renderHud() {
  const live = mode === "friend" ? turn : "you";
  let html = '<span class="stack' + (live === "you" ? " on" : "") + '"><i>🪙</i><b>' + fmt(wallet.coins) + "</b><small>You</small></span>";
  if (mode === "friend") {
    html += '<span class="stack' + (live === "friend" ? " on" : "") + '"><i>🪙</i><b>' + fmt(wallet.friend) + "</b><small>Friend</small></span>";
  }
  if (stack() < 25) html += '<button class="topup" data-a="topup">+250</button>';
  $("#stacks").innerHTML = html;
}
$("#stacks").addEventListener("click", (e) => {
  if (!e.target.closest('[data-a="topup"]')) return;
  credit(250);
  toast("+250 coins");
});

/* =====================================================================
   renderer + scene
   ===================================================================== */
const canvas = $("#scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040c);
scene.fog = new THREE.Fog(0x0a0512, 30, 58);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.05, 140);
camera.position.set(0, 7.35, 13.3);
const lookTarget = new THREE.Vector3(0, 0.9, -0.8);
camera.lookAt(lookTarget);

/* ---------- textures ---------- */
function texFromCanvas(w, h, paint) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  paint(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const carpetTex = texFromCanvas(512, 512, (g, s) => {
  g.fillStyle = "#43101f"; g.fillRect(0, 0, s, s);
  const step = s / 8;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    g.save(); g.translate(x * step + step / 2, y * step + step / 2); g.rotate(Math.PI / 4);
    g.strokeStyle = "rgba(226,183,94,.22)"; g.lineWidth = 2;
    g.strokeRect(-step * 0.28, -step * 0.28, step * 0.56, step * 0.56);
    g.fillStyle = "rgba(226,183,94,.1)";
    g.fillRect(-step * 0.09, -step * 0.09, step * 0.18, step * 0.18);
    g.restore();
  }
  for (let i = 0; i < 4000; i++) {
    g.fillStyle = "rgba(0,0,0," + (Math.random() * 0.08) + ")";
    g.fillRect(Math.random() * s, Math.random() * s, 2, 2);
  }
});
carpetTex.wrapS = carpetTex.wrapT = THREE.RepeatWrapping;
carpetTex.repeat.set(7, 6);

const feltTex = texFromCanvas(256, 256, (g, s) => {
  g.fillStyle = "#0f4d35"; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = "rgba(255,255,255," + (Math.random() * 0.04) + ")";
    g.fillRect(Math.random() * s, Math.random() * s, 1.5, 1.5);
  }
});
feltTex.wrapS = feltTex.wrapT = THREE.RepeatWrapping;

const wallTex = texFromCanvas(512, 512, (g, s) => {
  for (let i = 0; i < 8; i++) {
    const w = s / 8;
    const grd = g.createLinearGradient(i * w, 0, (i + 1) * w, 0);
    grd.addColorStop(0, "#1d0812"); grd.addColorStop(0.5, "#3a1226"); grd.addColorStop(1, "#1d0812");
    g.fillStyle = grd; g.fillRect(i * w, 0, w, s);
  }
  g.fillStyle = "rgba(226,183,94,.28)"; g.fillRect(0, 0, s, 6);
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(4, 1);

/* ---------- materials ---------- */
const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a1f14, roughness: 0.55, metalness: 0.12 });
const darkWood = new THREE.MeshStandardMaterial({ color: 0x241209, roughness: 0.6, metalness: 0.15 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd9b268, roughness: 0.3, metalness: 0.9 });
const feltMat = new THREE.MeshStandardMaterial({ map: feltTex, roughness: 0.95 });
const velvetMat = new THREE.MeshStandardMaterial({ color: 0x6d1024, roughness: 0.85 });
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf7f2e6, roughness: 0.65 });
const plateMat = () => new THREE.MeshStandardMaterial({ color: 0x2a1230, roughness: 0.45, metalness: 0.25 });
const chipColors = [0xd9483f, 0x2f74c0, 0x2f9c5e, 0xe0c04a, 0x7c4bb8];

function mesh(geo, mat, x, y, z) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  return m;
}

/* =====================================================================
   room
   ===================================================================== */
const floor = mesh(new THREE.PlaneGeometry(42, 36), new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 0.96 }), 0, 0, -2);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const inlayMat = new THREE.MeshStandardMaterial({ color: 0xb9903f, roughness: 0.45, metalness: 0.7 });
for (const [w, h, x, z] of [[19, 0.1, 0, 10], [19, 0.1, 0, -3.4], [0.1, 13.4, -9.5, 3.3], [0.1, 13.4, 9.5, 3.3]]) {
  scene.add(mesh(new THREE.BoxGeometry(w, 0.03, h), inlayMat, x, 0.015, z));
}

scene.add(mesh(new THREE.PlaneGeometry(42, 12.4), wallMat, 0, 6.2, -20));
const leftWall = mesh(new THREE.PlaneGeometry(36, 12.4), wallMat, -21, 6.2, -2);
leftWall.rotation.y = Math.PI / 2; scene.add(leftWall);
const rightWall = mesh(new THREE.PlaneGeometry(36, 12.4), wallMat, 21, 6.2, -2);
rightWall.rotation.y = -Math.PI / 2; scene.add(rightWall);
const ceiling = mesh(new THREE.PlaneGeometry(42, 36), new THREE.MeshStandardMaterial({ color: 0x140a18, roughness: 1 }), 0, 12.4, -2);
ceiling.rotation.x = Math.PI / 2; scene.add(ceiling);

for (const [x, z, ry] of [[0, -19.8, 0], [-20.8, -2, Math.PI / 2], [20.8, -2, Math.PI / 2]]) {
  const rail = mesh(new THREE.BoxGeometry(42, 0.28, 0.28), goldMat, x, 3.2, z);
  rail.rotation.y = ry; scene.add(rail);
  const rail2 = rail.clone(); rail2.position.y = 8.4; scene.add(rail2);
}
for (const x of [-14, -7, 7, 14]) {
  const curtain = mesh(new THREE.CylinderGeometry(0.9, 1.1, 7.4, 12, 1, true), velvetMat, x, 5.9, -19.2);
  curtain.scale.z = 0.45; scene.add(curtain);
}
for (const [x, z] of [[-16, -13], [16, -13], [-16, 7], [16, 7]]) {
  scene.add(mesh(new THREE.CylinderGeometry(0.52, 0.6, 9, 14), new THREE.MeshStandardMaterial({ color: 0x2a1122, roughness: 0.7 }), x, 4.5, z));
  scene.add(mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.34, 14), goldMat, x, 0.2, z));
  scene.add(mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.34, 14), goldMat, x, 8.7, z));
}

// bar
const bar = new THREE.Group();
bar.position.set(-13.5, 0, -16.4);
scene.add(bar);
bar.add(mesh(new THREE.BoxGeometry(9, 1.15, 1.6), darkWood, 0, 0.58, 0));
bar.add(mesh(new THREE.BoxGeometry(9.4, 0.14, 1.9), goldMat, 0, 1.2, 0));
bar.add(mesh(new THREE.BoxGeometry(9, 3.2, 0.3), new THREE.MeshStandardMaterial({ color: 0x2b0d1a, roughness: 0.8 }), 0, 2.9, -2.5));
for (let i = 0; i < 22; i++) {
  bar.add(mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.55 + Math.random() * 0.25, 8),
    new THREE.MeshStandardMaterial({ color: chipColors[i % chipColors.length], roughness: 0.25, metalness: 0.3 }),
    -4 + i * 0.38, 2.5, -2.4));
}
const barLight = new THREE.PointLight(0xffb066, 26, 16, 2);
barLight.position.set(-13.5, 3.2, -15.2);
scene.add(barLight);

// chandeliers
const chandeliers = [];
for (const [x, z] of [[-8, 0.6], [0, -3.2], [8, 0.6]]) {
  const ch = new THREE.Group();
  ch.position.set(x, 6.9, z);
  const ring = mesh(new THREE.TorusGeometry(0.8, 0.08, 8, 26), goldMat, 0, 0, 0);
  ring.rotation.x = Math.PI / 2; ch.add(ring);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ch.add(mesh(new THREE.SphereGeometry(0.12, 10, 10),
      new THREE.MeshStandardMaterial({ color: 0xfff0c8, emissive: 0xffca7a, emissiveIntensity: 2.6 }),
      Math.cos(a) * 0.8, -0.05, Math.sin(a) * 0.8));
  }
  ch.add(mesh(new THREE.SphereGeometry(0.22, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffe6b0, emissive: 0xffc26a, emissiveIntensity: 2.2 }), 0, -0.45, 0));
  const light = new THREE.PointLight(0xffc98a, 46, 26, 2);
  light.position.set(0, -0.5, 0);
  ch.add(light);
  scene.add(ch);
  chandeliers.push(light);
}

scene.add(new THREE.AmbientLight(0x60467a, 2.5));
scene.add(new THREE.HemisphereLight(0x7a5588, 0x1e0c16, 1.6));
const fill = new THREE.DirectionalLight(0xffd9b0, 0.4);
fill.position.set(5, 16, 20);
scene.add(fill);

// side tables, palms, sconces
for (const [x, z] of [[-17.5, -6], [17.5, -6], [-19, 4], [19, 4]]) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.add(mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.12, 20), woodMat, 0, 0.76, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.76, 12), darkWood, 0, 0.38, 0));
  g.add(mesh(new THREE.SphereGeometry(0.3, 14, 14), new THREE.MeshStandardMaterial({ color: 0xffdca8, emissive: 0xffb765, emissiveIntensity: 1.8 }), 0, 1.15, 0));
  scene.add(g);
}
for (const [x, z] of [[-19.4, 9], [19.4, 9], [-19.4, -16], [19.4, -16]]) {
  scene.add(mesh(new THREE.CylinderGeometry(0.42, 0.32, 0.6, 12), new THREE.MeshStandardMaterial({ color: 0x6b3a24, roughness: 0.8 }), x, 0.3, z));
  for (let i = 0; i < 6; i++) {
    const leaf = mesh(new THREE.ConeGeometry(0.18, 1.8, 6), new THREE.MeshStandardMaterial({ color: 0x1f6b45, roughness: 0.85 }), x + (Math.random() - 0.5) * 0.5, 1.5, z + (Math.random() - 0.5) * 0.5);
    leaf.rotation.z = (Math.random() - 0.5) * 1.2;
    leaf.rotation.x = (Math.random() - 0.5) * 1.2;
    scene.add(leaf);
  }
}
for (const x of [-14, -4, 4, 14]) {
  const sconce = new THREE.PointLight(0xff9a5a, 14, 13, 2);
  sconce.position.set(x, 4.4, -18.6);
  scene.add(sconce);
  scene.add(mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshStandardMaterial({ color: 0xffd7a0, emissive: 0xffa860, emissiveIntensity: 2.2 }), x, 4.4, -19.7));
}

/* =====================================================================
   shared 3D pieces
   ===================================================================== */
const tweens = [];
function animate(dur, step, done) {
  tweens.push({ t: 0, dur: dur, step: step, done: done });
}

function labelTexture(text, opts) {
  const o = opts || {};
  return texFromCanvas(512, 192, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.font = "700 " + (o.size || 74) + "px Inter, system-ui, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = o.color || "#ffe6ac";
    g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 12;
    const lines = String(text).split("\n");
    lines.forEach((line, i) => {
      g.fillText(line, w / 2, h / 2 + (i - (lines.length - 1) / 2) * (o.gap || 66));
    });
  });
}

// a glowing label plate you can press
function makePlate(text, w, d, opts) {
  const o = opts || {};
  const g = new THREE.Group();
  const base = new THREE.Mesh(new RoundedBoxGeometry(w, 0.08, d, 2, Math.min(0.05, d / 2.6)), plateMat());
  base.position.y = 0.04;
  g.add(base);
  const top = new THREE.Mesh(
    new THREE.PlaneGeometry(w * 0.94, d * 0.9),
    new THREE.MeshBasicMaterial({ map: labelTexture(text, o), transparent: true })
  );
  top.rotation.x = -Math.PI / 2;
  top.position.y = 0.085;
  g.add(top);
  g.userData.base = base;
  g.userData.hoverText = o.hint || text.replace(/\n/g, " ");
  g.userData.tone = o.tone || 0x6a4a10;
  return g;
}

function chipTexture(value, color) {
  return texFromCanvas(256, 256, (g, s) => {
    g.fillStyle = "#" + color.toString(16).padStart(6, "0");
    g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 2, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 14;
    for (let i = 0; i < 8; i++) {
      const a0 = (i / 8) * Math.PI * 2;
      g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 18, a0, a0 + 0.26); g.stroke();
    }
    g.beginPath(); g.arc(s / 2, s / 2, s * 0.32, 0, Math.PI * 2);
    g.fillStyle = "rgba(255,255,255,.92)"; g.fill();
    g.fillStyle = "#2a1520"; g.font = "700 92px Inter, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(value), s / 2, s / 2 + 4);
  });
}

const chipCache = new Map();
function makeChip(value, colorIndex) {
  const color = chipColors[colorIndex % chipColors.length];
  const key = value + ":" + color;
  let map = chipCache.get(key);
  if (!map) { map = chipTexture(value, color); chipCache.set(key, map); }
  const sideMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.15 });
  const topMat = new THREE.MeshStandardMaterial({ map: map, roughness: 0.45, metalness: 0.1 });
  const geo = new THREE.CylinderGeometry(0.2, 0.2, 0.055, 28);
  const chip = new THREE.Mesh(geo, [sideMat, topMat, topMat]);
  chip.userData.base = chip;
  chip.userData.tone = 0x333333;
  return chip;
}

/* ---------- playing cards ---------- */
const CARD_W = 0.46, CARD_D = 0.64, CARD_T = 0.012;
const cardFaceCache = new Map();
function cardFaceTexture(card) {
  const key = card.r + card.s;
  if (cardFaceCache.has(key)) return cardFaceCache.get(key);
  const red = card.red;
  const t = texFromCanvas(256, 358, (g, w, h) => {
    g.fillStyle = "#fffdf6"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(0,0,0,.16)"; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
    g.fillStyle = red ? "#c02844" : "#20161f";
    g.font = "700 54px Georgia, serif";
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillText(card.r, 16, 14);

];

const games = {};       // id -> { enter, leave, update, reset }

function signSprite(text) {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 128;
  const g = cv.getContext("2d");
  g.font = "600 58px 'Cormorant Garamond', Georgia, serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "rgba(255,196,96,.95)"; g.shadowBlur = 26;
  g.fillStyle = "#ffe8b4";
  g.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sprite.scale.set(1.9, 0.48, 1);
  return sprite;
}

function tableGroup(def) {
  const g = new THREE.Group();
  g.userData.tableId = def.id;
  tablesById[def.id] = g;
  scene.add(g);
  return g;
}
function finishTable(g, def, ringRadius, signAt) {
  if (def.id !== "slots") {
    for (const sx of [-1.15, 1.15]) {
      g.add(mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.12, 16), velvetMat, sx, 0.68, 2.3));
      g.add(mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.66, 10), darkWood, sx, 0.33, 2.3));
    }
  }
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(ringRadius, ringRadius + 0.26, 56),
    new THREE.MeshBasicMaterial({ color: 0xe2b75e, transparent: true, opacity: 0, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  ring.userData.hoverRing = true;
  g.add(ring);
  hoverRingOf[def.id] = ring;

  const sign = signSprite(def.name);
  sign.position.set(signAt[0], signAt[1], signAt[2]);
  g.userData.sign = sign;
  g.add(sign);

  const glow = new THREE.PointLight(0xffd7a0, 22, 9, 2);
  glow.position.set(0, 2.9, 0.4);
  g.add(glow);
}

function layoutRoom() {
  const tall = window.innerWidth / window.innerHeight < 0.95;
  const spots = tall ? LAYOUT_TALL : LAYOUT_WIDE;
  TABLES.forEach((def, i) => {
    def.pos.set(spots[i].x, 0, spots[i].z);
    def.rot = spots[i].rot;
    const g = tablesById[def.id];
    if (!g) return;
    g.position.copy(def.pos);
    g.rotation.y = def.rot;
  });
}

/* helper: register a clickable inside a table group */
function clickable(obj, act, text) {
  obj.userData.act = act;
  if (text) obj.userData.hoverText = text;
  obj.traverse((o) => { if (!o.userData.act) o.userData.act = act; });
  clickables.push(obj);
  return obj;
}

  const SUITS = [["♠", false], ["♥", true], ["♦", true], ["♣", false]];

    g.add(c);
    return c;
  });
  const spinPlate = makePlate("SPIN", 0.58, 0.38, { hint: "Spin the wheel" });
  spinPlate.position.set(0.16, 1.07, 1.24);
  g.add(spinPlate);
  const clearPlate = makePlate("CLEAR", 0.56, 0.3, { hint: "Take the chips back" });
  clearPlate.position.set(0.76, 1.07, 1.24);
  g.add(clearPlate);

  const props = [board, betChips, spinPlate, clearPlate].concat(chipButtons);
  const show = (on) => props.forEach((p) => { p.visible = on; });
  show(false);  // the table only shows its game once you sit down

  const S = { bets: {}, chip: 25, spinning: false, result: null, payout: 0, rot: 0.3, ballAngle: 0 };

  function boardPos(cell) {
    const cx = ((cell.x0 + cell.x1) / 2 - 0.5) * BOARD_W;
    const cz = ((cell.y0 + cell.y1) / 2 - 0.5) * BOARD_D;
    return new THREE.Vector3(cx, 0.01, cz);
  }
  function paintChips() {
    for (const c of betChips.children.slice()) betChips.remove(c);
    for (const cell of cells) {
      const amount = S.bets[cell.key];
      if (!amount) continue;
      const stack = new THREE.Group();
      const n = Math.min(4, Math.ceil(amount / 100));
      for (let i = 0; i < n; i++) {
        const chip = makeChip(amount, 1);
        chip.scale.setScalar(0.55);
        chip.position.y = 0.02 + i * 0.033;
        stack.add(chip);
      }
      const p = boardPos(cell);
      stack.position.copy(p);
      betChips.add(stack);
    }
  }
  function totalBet() { return Object.keys(S.bets).reduce((n, k) => n + S.bets[k], 0); }
  function state() {
    if (current && current.id !== "roulette") return;
    if (S.spinning) hint("The wheel is spinning…");
    else if (totalBet()) hint("Bet <b>" + totalBet() + "</b> — press <b>SPIN</b>" + (S.result !== null ? " · last " + S.result : ""));
    else if (S.result === null) hint("Tap the <b>board</b> to put chips down, then press <b>SPIN</b>");
    else hint("Last spin <b>" + S.result + "</b> " + (S.result === 0 ? "(green)" : isRed(S.result) ? "(red)" : "(black)") +
      (S.payout ? " · " + (S.payout >= totalBet() ? "+" : "") + fmt(S.payout) : ""));
  }

  function payoutFor(n) {
    let win = 0;
    for (const key of Object.keys(S.bets)) {
      const amount = S.bets[key];
      if (key.charAt(0) === "n") { if (Number(key.slice(1)) === n) win += amount * 36; }
      else if (key === "red") { if (isRed(n)) win += amount * 2; }
      else if (key === "black") { if (isBlack(n)) win += amount * 2; }
      else if (key === "odd") { if (n % 2 === 1) win += amount * 2; }
      else if (key === "even") { if (n !== 0 && n % 2 === 0) win += amount * 2; }
      else if (key === "low") { if (n >= 1 && n <= 18) win += amount * 2; }
      else if (key === "high") { if (n >= 19) win += amount * 2; }
    }
    return win;
  }

  const raycaster = new THREE.Raycaster();
  function boardCellAt(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObject(board, false);
    if (!hits.length) return null;
    const local = board.worldToLocal(hits[0].point.clone());
    const gx = local.x / BOARD_W + 0.5;
    const gy = local.y / BOARD_D + 0.5; // note: after rotation the plane's local y maps to -z
    const u = gx, v = 1 - gy;
    if (u < 0 || u > 1 || v < 0 || v > 1) return null;
    for (const cell of cells) {
      if (u >= cell.x0 && u <= cell.x1 && v >= cell.y0 && v <= cell.y1) return cell;
    }
    return null;
  }

  function spin() {
    if (S.spinning) return;
    const total = totalBet();
    if (!total) { toast("Put some chips down first"); return; }
    if (!spend(total)) return;
    S.spinning = true;
    S.result = null;
    S.payout = 0;
    state();
    const winner = rand(37);
    const idx = WHEEL_ORDER.indexOf(winner);
    const seg = (Math.PI * 2) / 37;
    let target = -idx * seg + rand(3);
    while (target < S.rot + Math.PI * 2 * 3) target += Math.PI * 2;
    const startRot = S.rot;
    const ballStart = S.ballAngle;
    animate(3.4, (k) => {
      const e = easeOut(k);
      S.rot = startRot + (target - startRot) * e;
      rotor.rotation.y = S.rot;
      S.ballAngle = ballStart - (1 - e) * Math.PI * 10 - e * Math.PI * 2;
      const r = 0.62 - 0.14 * e;
      ball.position.set(Math.cos(S.ballAngle) * r, 0.14, Math.sin(S.ballAngle) * r);
    }, () => {
      S.spinning = false;
      S.result = winner;
      const payout = payoutFor(winner);
      S.payout = payout;
      credit(payout);
      S.bets = {};
      paintChips();
      state();
      if (mode === "friend") setTimeout(nextTurn, 900);
    });
  }

  function syncChips() {
    chipButtons.forEach((c, i) => {
      const on = [25, 100, 500][i] === S.chip;
      c.scale.setScalar(on ? 1.22 : 1);
      c.position.y = on ? 1.115 : 1.1;
    });
  }
  chipButtons.forEach((c, i) => clickable(c, () => {
    S.chip = [25, 100, 500][i];
    syncChips();
    toast("Chip: " + S.chip);
  }, "Select the " + [25, 100, 500][i] + " chip"));
  clickable(spinPlate, spin, "Spin");
  clickable(clearPlate, () => { if (S.spinning) return; S.bets = {}; paintChips(); state(); }, "Clear the board");

  games.roulette = {
    enter() {
      show(true);
      S.bets = {}; S.chip = 25; S.result = null; S.payout = 0; S.spinning = false;
      S.rot = 0.3;
      rotor.rotation.y = S.rot;
      ball.position.set(0.62, 0.14, 0);
      syncChips();
      paintChips();
      state();
    },
    leave() { show(false); },
    idleHint: state,
    update() {},
    betOn(cell) {
      if (S.spinning) return;
      const amount = S.chip;
      if (stack() < amount) { toast("Not enough coins"); return; }
      S.bets[cell.key] = (S.bets[cell.key] || 0) + amount;
      paintChips();
      state();
    },
    boardEvent: boardCellAt
  };
})();

const desiredPos = new THREE.Vector3().copy(camera.position);

      pos: def.pos.clone().add(new THREE.Vector3(spin.x * dist, tall ? 2.5 : 2.45, spin.z * dist)),
      target: def.pos.clone().add(new THREE.Vector3(0, tall ? 1.7 : 1.45, 0))

      target: def.pos.clone().add(new THREE.Vector3(0, 1.05, tall ? 0.1 : 0.15))
    };
  }

  return {
    pos: def.pos.clone().add(new THREE.Vector3(spin.x * dist, tall ? 4.5 : 3.1, spin.z * dist)),
    target: def.pos.clone().add(new THREE.Vector3(0, 1.05, tall ? 0.15 : -0.05))
  };
}

function updateCamera(dt, t) {
  if (current) {
    const view = seatView(current);
    desiredPos.copy(view.pos);
    desiredTarget.copy(view.target);
  } else {
    desiredPos.copy(overviewPos(t));
    desiredTarget.set(0, 0.9, isTall() ? -1.0 : 0.6);
  }
  const k = 1 - Math.exp(-3.4 * dt);
  camera.position.lerp(desiredPos, k);
  lookTarget.lerp(desiredTarget, k);
  camera.lookAt(lookTarget);
}

function shown(obj) {
  let n = obj;
  while (n) { if (!n.visible) return false; n = n.parent; }
  return true;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function ndcFromEvent(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  return pointer;
}

let hoveredItem = null;
function setHovered(item) {
  if (hoveredItem === item) return;
  if (hoveredItem) {
    const base = hoveredItem.userData.base;
    if (base && base.material && base.material.emissive) base.material.emissive.setHex(0x000000);
  }
  hoveredItem = item;
  canvas.style.cursor = item ? "pointer" : "default";
  if (item && item.userData.base && item.userData.base.material && item.userData.base.material.emissive) {
    item.userData.base.material.emissive.setHex(item.userData.tone || 0x6a4a10);
    item.userData.base.material.emissiveIntensity = 0.9;
    if (current) hint("<b>" + (item.userData.hoverText || "Click") + "</b>");
  } else if (current) {
    const g = games[current.id];
    if (g && g.idleHint) g.idleHint();
  }
}

function findAction(obj) {
  let n = obj;
  while (n) {
    if (n.userData && n.userData.act) return n.userData.act;
    n = n.parent;
  }
  return null;
}

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return;
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);
  if (current) {
    const hits = raycaster.intersectObjects(clickables, true);
    for (const h of hits) {
      if (!shown(h.object)) continue;
      const act = findAction(h.object);
      if (!act) continue;
      let node = h.object;
      while (node && !node.userData.act) node = node.parent;
      setHovered(node);
      return;
    }
    setHovered(null);
    return;
  }
  // overview: hover a table
  const hits = raycaster.intersectObjects(Object.values(tablesById), true);
  let id = null;
  for (const h of hits) {
    let node = h.object;
    while (node) { if (node.userData.tableId) { id = node.userData.tableId; break; } node = node.parent; }
    if (id) break;
  }
  setTableHover(id);
});

function setTableHover(id) {
  if (hoveredTable === id) return;
  hoveredTable = id;
  canvas.style.cursor = id ? "pointer" : "default";
  for (const key of Object.keys(hoverRingOf)) {
    hoverRingOf[key].material.opacity = key === id ? 0.55 : 0;
  }
  if (!current) {
    const def = TABLES.find((t) => t.id === id);
    hint(def ? "Click to play <b>" + def.name + "</b>" : "Click a <b>table</b> to walk over and play");
  }
}
let hoveredTable = null;

canvas.addEventListener("pointerleave", () => { setHovered(null); setTableHover(null); });

let downAt = null;
canvas.addEventListener("pointerdown", (e) => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 14) return;
  ndcFromEvent(e);
  raycaster.setFromCamera(pointer, camera);

  if (current) {
    const hits = raycaster.intersectObjects(clickables, true);
    for (const h of hits) {
      if (!shown(h.object)) continue;
      const act = findAction(h.object);
      if (act) { act(); return; }
    }
    const g = games[current.id];
    if (g && g.boardEvent) {
      const cell = g.boardEvent(e);
      if (cell) { g.betOn(cell); return; }
    }
    return;
  }

  const hits = raycaster.intersectObjects(Object.values(tablesById), true);
  for (const h of hits) {
    let node = h.object;
    while (node) {
      if (node.userData.tableId) { sit(node.userData.tableId); return; }
      node = node.parent;
    }
  }
});

/* ---------- sitting / leaving ---------- */
function sit(id) {
  const def = TABLES.find((t) => t.id === id);
  if (!def || current) return;
  current = def;
  turn = "you";
  setTableHover(null);
  tablesById[id].userData.sign.visible = false;
  $("#leave").hidden = false;
  $("#modes").classList.add("on");
  renderHud();
  games[id].enter();
}
function leave() {
  if (!current) return;
  const id = current.id;
  games[id].leave();
  tablesById[id].userData.sign.visible = true;
  current = null;
  $("#leave").hidden = true;
  $("#modes").classList.remove("on");
  setHovered(null);
  renderHud();
  hint("Click a <b>table</b> to walk over and play");
}
$("#leave").addEventListener("click", leave);

function setMode(next) {
  if (next === mode) return;
  mode = next;
  turn = "you";
  $("#modes").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  renderHud();
  if (current) games[current.id].enter();
  toast(mode === "friend" ? "Pass-and-play: you and a friend take turns" : "Playing against the dealer");
}
$("#modes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (b) setMode(b.dataset.mode);
});

/* ---------- dressing: lamps, signs and hover rings ---------- */
const DRESS = {
  slots: { ring: 1.5, sign: [0, 3.0, 0.1] },
  blackjack: { ring: 2.95, sign: [0, 1.92, -0.36] },
  roulette: { ring: 2.25, sign: [0, 1.9, -0.24] },
  dice: { ring: 2.45, sign: [0, 1.86, -0.1] }
};
TABLES.forEach((def) => {
  const g = tablesById[def.id];
  if (!g || g.userData.sign) return;
  const d = DRESS[def.id];
  finishTable(g, def, d.ring, d.sign);
});

/* ---------- frame ---------- */
function fitCamera() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.fov = isTall() ? 54 : 46;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
}
window.addEventListener("resize", () => {
  fitCamera();
  layoutRoom();
});

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  updateCamera(dt, t);

  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.step(k);
    if (k >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
  }

  if (current && games[current.id] && games[current.id].update) games[current.id].update(dt, t);

  for (let i = 0; i < chandeliers.length; i++) {
    chandeliers[i].intensity = 44 + Math.sin(t * 1.7 + i) * 2.2 + Math.sin(t * 5.3 + i * 2) * 0.7;
  }
  for (const key of Object.keys(hoverRingOf)) {
    if (key === hoveredTable) hoverRingOf[key].material.opacity = 0.4 + Math.sin(t * 4) * 0.14;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

layoutRoom();
fitCamera();
renderHud();
frame();

// debug hook for the catalogue and the console
window.casino = {
  sit: sit, leave: leave, tables: TABLES.map((t) => t.id), wallet: wallet,
  mode: () => mode, game: () => (current ? current.id : null),
  // snap the camera instead of gliding: used for stills and the catalogue thumbnail
  jump: () => {
    const view = current ? seatView(current) : { pos: overviewPos(0), target: new THREE.Vector3(0, 0.9, isTall() ? -1.0 : 0.6) };
    camera.position.copy(view.pos);
    lookTarget.copy(view.target);
    camera.lookAt(lookTarget);
    renderer.render(scene, camera);
  }
};
</script>
</body>
</html>
