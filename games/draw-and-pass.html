<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2be0">
<title>Draw &amp; Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1340;--p1:#7c4dff;--p2:#ff4d8d;--p3:#00c2ff;--p4:#ffc83d;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Fredoka','Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,#4c1fd1 0%,#8e3cf0 40%,#ff4d8d 100%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(0,194,255,.4),transparent 38%),radial-gradient(circle at 90% 85%,rgba(255,200,61,.35),transparent 40%)}
button,input,select{font-family:inherit;color:inherit}
#app{position:relative;max-width:1200px;margin:0 auto;padding:12px 12px 56px}
.card{background:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 34px rgba(25,0,70,.28);margin-bottom:14px}
.center{text-align:center;justify-content:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.dim{opacity:.6}
h2{margin:0 0 8px;font-size:1.3rem}

/* logo */
.logo{font-size:clamp(2.6rem,9vw,4.6rem);font-weight:700;line-height:1;margin:0;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.25);letter-spacing:-1px}
.logo span{display:inline-block}
.logo .a{color:#ffc83d;transform:rotate(-5deg)}.logo .b{color:#00e0ff;transform:rotate(4deg);margin:0 .08em}.logo .c{color:#ff9bd0;transform:rotate(-3deg)}
.tag{color:#fff;opacity:.92;font-size:1.15rem;margin:8px 0 18px}

/* buttons / inputs */
.btn{border:0;border-radius:16px;padding:12px 20px;font-size:1.05rem;font-weight:600;cursor:pointer;color:#fff;background:var(--p1);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.pink{background:var(--p2)}.btn.blue{background:var(--p3);color:#06324a}.btn.yellow{background:var(--p4);color:#4a3200}.btn.green{background:var(--ok)}.btn.dark{background:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.22);box-shadow:none}
.btn.big{font-size:1.25rem;padding:14px 26px}
.btn:disabled{filter:grayscale(.8) opacity(.55);cursor:not-allowed}
.icon-btn{border:0;background:#f1ecff;border-radius:12px;width:40px;height:40px;font-size:1.15rem;cursor:pointer}
.inp,.sel{width:100%;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:3px solid #e6defa;outline:none;background:#fff}
.inp:focus,.sel:focus{border-color:var(--p1)}
.code-in{text-align:center;letter-spacing:.2em;font-weight:700;text-transform:uppercase}

/* home */
.home{max-width:580px;margin:5vh auto 0;text-align:center}
.home .card{text-align:left}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.12);cursor:pointer}
.sw.on{box-shadow:0 0 0 4px var(--ink)}
.how{margin:10px 0 0;padding-left:1.2em;line-height:1.55}
.or{text-align:center;opacity:.5;font-weight:600;margin:12px 0}

/* lobby */
.lobby-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:860px){.lobby-grid{grid-template-columns:1.2fr 1fr}}
.code{font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:.22em;font-weight:700;color:var(--p1);margin:4px 0 8px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;background:#f6f2ff;border-radius:16px;padding:8px 12px;min-width:0}
.pl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.off{opacity:.45}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-weight:500}
.setting .sel{width:auto;padding:8px 10px;font-size:1rem}
.setting input[type=checkbox]{width:22px;height:22px}

/* topbar / timer */
.topbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);border-radius:20px;padding:10px 12px;margin-bottom:8px;box-shadow:0 8px 22px rgba(25,0,70,.25)}
.topbar .t{flex:1;min-width:0}
.hdr-title{font-size:1.25rem;font-weight:700;line-height:1.15}
.hdr-sub{font-size:.95rem;opacity:.65}
.timer{font-size:1.6rem;font-weight:700;min-width:64px;text-align:center;background:var(--ink);color:#fff;border-radius:14px;padding:6px 10px}
.timer.low{background:var(--bad);animation:pulse .45s infinite alternate}
.bar{height:9px;background:rgba(255,255,255,.35);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffc83d,#ff4d8d);transition:width .25s linear}
@keyframes pulse{to{transform:scale(1.08)}}

/* prompt / text blocks */
.quote{font-size:clamp(1.4rem,4.5vw,2.2rem);font-weight:600;text-align:center;padding:12px 6px;line-height:1.25;word-break:break-word}
.ptext{background:#fff;border-radius:20px;padding:10px 16px;margin-bottom:10px;text-align:center;box-shadow:0 8px 22px rgba(25,0,70,.2)}
.ptext small{display:block;opacity:.55;font-weight:500}
.ptext b{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:700;word-break:break-word}

/* studio */
.studio{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-areas:"canvas" "tools" "palette"}
.cvwrap{grid-area:canvas;display:flex;justify-content:center}
.cv,.cvview{display:block;width:min(100%,max(320px,calc((100vh - 270px)*1.3333)));height:auto;aspect-ratio:4/3;background:#fff;border-radius:18px;border:4px solid #fff;box-shadow:0 10px 28px rgba(25,0,70,.35);touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.cvview{cursor:default;touch-action:auto}
.tools{grid-area:tools;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:rgba(255,255,255,.95);border-radius:18px;padding:8px}
.tool{border:0;background:#f1ecff;border-radius:14px;padding:6px 10px;min-width:56px;cursor:pointer;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tool small{font-size:.68rem;font-weight:600;opacity:.7}
.tool.on{background:var(--p1);color:#fff}
.tool:disabled{opacity:.4}
.sizes{display:flex;gap:6px;align-items:center}
.szb{border:0;background:#f1ecff;border-radius:14px;width:46px;height:46px;display:grid;place-items:center;cursor:pointer}
.szb i{display:block;border-radius:50%;background:var(--ink)}
.szb.on{background:var(--p1)}.szb.on i{background:#fff}
.palette{grid-area:palette;display:grid;grid-template-columns:repeat(14,1fr);gap:5px;background:rgba(255,255,255,.95);border-radius:18px;padding:8px}
.swc{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.18);cursor:pointer;padding:0;min-width:0}
.swc.on{box-shadow:0 0 0 3px var(--ink)}
.colorpick{grid-column:span 2;width:100%;height:100%;min-height:30px;border:0;border-radius:10px;padding:0;background:none;cursor:pointer}
.curcol{width:46px;height:46px;border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
@media(min-width:900px){
 .studio{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"palette canvas tools";align-items:start}
 .palette{grid-template-columns:repeat(2,34px);align-content:start}
 .colorpick{grid-column:span 2}
 .tools{flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:92px}
 .tools .sizes{flex-direction:column}
 .szb{width:100%}
}
.actions{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* guess */
.guess-box{max-width:720px;margin:0 auto}
.note{text-align:center;opacity:.8;font-weight:500;margin:8px 0;color:#fff}

/* wait */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;background:#f6f2ff;border-radius:999px;padding:5px 12px 5px 5px;font-weight:600}
.chip.done{background:#dcfce7}.chip.off{opacity:.45}
.spinner{font-size:3rem;animation:wob 1.4s infinite ease-in-out;display:inline-block}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

/* reveal */
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 10px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#ffc83d;transform:scale(1.35)}.dots i.past{background:#fff}
.rlist{max-width:640px;margin:0 auto}
.rc{background:#fff;border-radius:24px;padding:14px;margin:0 auto 14px;box-shadow:0 10px 26px rgba(25,0,70,.28)}
.rc.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.rc-h{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:6px}
.rc canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;border-radius:14px;border:3px solid #eee;background:#fff}
.rc .quote{padding:8px 4px}
.pills{display:flex;gap:6px;flex-wrap:wrap;min-height:6px;margin-top:8px}
.pill{background:#f1ecff;border-radius:999px;padding:2px 10px;font-weight:600}
.dock{position:sticky;bottom:8px;z-index:5;display:grid;gap:8px;max-width:640px;margin:0 auto}
.reactbar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,.96);border-radius:22px;padding:6px;box-shadow:0 8px 22px rgba(25,0,70,.3)}
.emo{border:0;background:transparent;font-size:1.7rem;cursor:pointer;border-radius:12px;padding:4px 8px;transition:transform .1s}
.emo:active{transform:scale(1.4)}
.ctl{background:rgba(255,255,255,.96);border-radius:22px;padding:8px;box-shadow:0 8px 22px rgba(25,0,70,.3)}
.floaty{position:fixed;bottom:90px;font-size:2.4rem;z-index:70;pointer-events:none;animation:floatup 2.2s ease-out forwards}
@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-55vh) scale(1.5) rotate(18deg);opacity:0}}

/* vote / results */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.vcard{background:#fff;border-radius:22px;padding:12px;box-shadow:0 10px 26px rgba(25,0,70,.28);display:flex;flex-direction:column;gap:8px}
.vcard.mine{outline:4px dashed var(--p4)}
.vcard.picked{outline:4px solid var(--ok)}
.vcard.win{outline:5px solid var(--p4);background:#fffbe8}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.thumb{background:#f6f2ff;border-radius:12px;overflow:hidden;min-height:90px;display:grid;place-items:center;text-align:center;font-weight:600;padding:4px;font-size:.95rem;word-break:break-word}
.thumb canvas{display:block;width:100%;height:auto}
.thumb small{display:block;font-weight:500;opacity:.55;font-size:.72rem}
.votebar{height:12px;border-radius:8px;background:#eee;overflow:hidden}
.votebar i{display:block;height:100%;background:linear-gradient(90deg,#ffc83d,#ff4d8d)}
.banner{background:linear-gradient(135deg,#ffc83d,#ff9bd0);border-radius:26px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 12px 30px rgba(25,0,70,.3)}
.banner b{font-size:clamp(1.4rem,5vw,2.2rem)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,0,50,.78);overflow:auto;padding:14px}
.modal .in{max-width:660px;margin:0 auto}
.conf{position:fixed;top:-14px;width:10px;height:16px;z-index:80;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;z-index:100;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .4s}
.toast.out{opacity:0}
.err{color:#b42318;font-weight:600}
code{background:#f1ecff;padding:2px 6px;border-radius:6px;font-size:.9em}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Draw &amp; Pass needs JavaScript.</noscript>

<script type="module">

/* ====================================================================
   1) THE ROOM SERVER
   Draw & Pass runs on this site's own Cloudflare Worker (see worker.js,
   class Draw). Nothing is stored in Firestore, so the game needs no
   Firebase setup, no sign-in and no Firestore rules.
   ==================================================================== */

// <PURE>
/* ====================================================================
   2) PURE HELPERS — prompts, stroke format, painters, fill, chain maths
   ==================================================================== */
const CW = 960, CH = 720;
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, a, b, d = 0) => { v = +v; return Number.isFinite(v) ? clamp(v, a, b) : d; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const article = w => /^[aeiou]/i.test(w) ? "an" : "a";

const PROMPTS = [
"A cat driving a school bus","A penguin sunbathing on a beach","Grandma skateboarding down a hill","A giant pizza chasing a tiny man","A dragon roasting marshmallows","Two snails racing in the Olympics","An octopus playing five instruments","A shark wearing a business suit","A robot learning to ride a bike","A sloth who is late for work",
"A wizard stuck in an elevator","Santa Claus on vacation","A mermaid at the dentist","A cow on a rollercoaster","A ghost doing laundry","A pirate using a smartphone","A hippo in a bubble bath","A frog conducting an orchestra","A snowman at the beach","An astronaut walking a dog on the moon",
"A banana slipping on a person","A fish riding a bicycle","A bear learning to knit","A tiny dinosaur in a teacup","A giraffe trying on hats","A monkey running a restaurant","A knight afraid of a small mouse","A squirrel burying a gold bar","A crab doing taxes","An owl teaching a class",
"A vampire at a sunny picnic","A lion getting a haircut","A turtle winning a race","A chicken crossing a busy road","A unicorn stuck in traffic","Two penguins sharing an umbrella","A kangaroo packing a suitcase","A pig flying an airplane","A cactus getting a hug","A donut with legs running away",
"A bee wearing a tiny crown","A moose in a bakery","A flamingo doing ballet","A walrus playing the piano","A goose causing chaos at a wedding","A mailman chased by a friendly dragon","A chef cooking with a flamethrower","A clown stuck in a tiny car","A wizard ordering pizza","A superhero doing grocery shopping",
"A detective investigating a missing cookie","A farmer riding a giant chicken","A pirate learning to swim","A dentist who is afraid of teeth","A baby boss in a meeting","A hamburger on a skateboard","Spaghetti tangled around a bicycle","A watermelon wearing sunglasses","Ice cream melting on a hot day","A taco throwing a party",
"A sandwich with a surprise inside","A cupcake with a tiny castle on top","An angry pancake","Sushi sailing down a river","A pizza slice winning a medal","A soccer match between cats and dogs","A goat playing basketball","Penguins curling on ice","An elephant doing gymnastics","A snail running a marathon",
"Sumo wrestling in a bouncy castle","A fish playing golf","A skier racing down a giant ice cream","A boxing kangaroo","A bear surfing a big wave","A castle floating on a cloud","A friendly monster under the bed","A fairy fixing a car engine","A troll selling umbrellas under a bridge","A dragon afraid of fire",
"A haunted house with a disco inside","A giant beanstalk in a backyard","A wizard duel with rubber chickens","A talking tree giving advice","A magic carpet stuck in traffic","A robot making breakfast","Aliens visiting a farm","A spaceship parked at a gas station","An astronaut planting a flag on a cheese moon","A time machine made from a bathtub",
"Robots on a dance floor","A UFO abducting a cow","A cyborg gardener","A space station full of cats","A rocket launched from a backyard shed","A messy bedroom with a surprise guest","Brushing teeth with a giant toothbrush","A busy morning at the bus stop","A lost sock searching for its pair","Someone sneezing in a library",
"A birthday cake on fire","Waiting in a very long line","An umbrella turned inside out","A traffic jam of bicycles","A broken umbrella in a storm","A treehouse city in the clouds","A beach party in winter","A lighthouse on a tiny island","A campsite visited by a bear","A haunted library",
"A market full of strange fruits","An underwater bus station","A farm run by robots","A snowy mountain village","A pirate cove with a secret door","Raining cats and dogs","A piece of cake","Butterflies in my stomach","The elephant in the room","Biting the bullet",
"Cold feet at a wedding","Breaking the ice","Head in the clouds","Spilling the beans","Barking up the wrong tree","A dog wearing a wig at a disco","A cat sleeping in a bread basket","A bunny magician pulling out a human","A very long dachshund wearing socks","A duck leading a parade",
"A hedgehog giving a high five","A koala hugging a router","A llama in pajamas","A parrot telling secrets","A turkey planning an escape","A toddler directing traffic","Grandpa playing video games","A teacher riding a scooter","A librarian with ninja skills","A mechanic fixing a spaceship",
"A pigeon flying a plane","A tiny king on a giant throne","A bakery run by raccoons","A musician with eight arms","A painter whose painting comes alive","A mail truck made of snails","A birthday party for a robot","A picnic ruined by ants","A talking toaster","A rainbow bridge",
"A shark in a swimming pool","A volcano erupting confetti","A very tall snowman","A pumpkin carving itself","A scarecrow taking a day off","A bear stuck in a honey jar","A mountain made of cheese","A bicycle with square wheels","A castle made of sand","A boat full of ducks",
"A cloud that rains pizza","A fish wearing roller skates","An octopus doing laundry","A roller coaster through a kitchen","A giant cat knocking over a city","The world's worst haircut","A raccoon DJ","A cowboy riding a llama","A ninja delivering pizza","A sleepy dragon guarding a pillow",
"A teddy bear on a motorbike","A clownfish at a circus","A banana boat full of monkeys","A zombie at a yoga class","A cat burglar who is actually a cat","A dog walking a human","A bird building a nest out of spaghetti","A fish bowl with a tiny castle","A snail with a rocket on its shell","A snowman melting at a barbecue",
"A moose wearing a scarf","A crocodile at the hairdresser","A sheep counting humans","A tiger doing ballet","A rabbit racing a rocket","A sad balloon","A robot crying at a wedding","A cheerful trash can","A grumpy cloud","A fancy potato in a top hat",
"A hamster running a giant wheel to power a city","A goldfish escaping its bowl","A bat hanging out at a coffee shop","A polar bear in a desert","A cat DJ at a school dance",
"A grandma on a jet ski","A cowboy lost in a supermarket","A dinosaur riding the bus","A mouse trap with a tiny piece of cake","A pencil that draws itself",
"A bear fishing with a fishing rod made of spaghetti","A magician whose rabbit does the tricks","A baby dragon learning to breathe fire","A pirate captain who is terrified of the sea","Sheep jumping over a very tall fence"
];
const ADJ = ["sleepy","angry","tiny","giant","fancy","dizzy","grumpy","sparkly","haunted","shy","hungry","invisible","flying","dancing","soggy","royal","tired","brave","goofy","spooky"];
const ANI = ["cat","dog","penguin","octopus","giraffe","hamster","dragon","crocodile","llama","owl","frog","shark","snail","bear","duck","flamingo","goat","raccoon","narwhal","T-rex"];
const JOB = ["plumber","astronaut","chef","dentist","pirate","wizard","detective","firefighter","clown","farmer","barber","knight","ninja","mermaid","robot"];
const DOING = ["riding a unicycle","juggling bananas","eating spaghetti","playing the drums","doing yoga","painting a masterpiece","flying a kite","baking a cake","skateboarding","singing in the shower","building a sandcastle","fishing for socks","taking a selfie","mowing the lawn","walking a tiny dog","reading a map upside down","blowing giant bubbles","playing chess","delivering pizza","dancing the tango"];
const PLACE = ["on the moon","in a bathtub","at a wedding","in the supermarket","underwater","at the dentist","on a rollercoaster","in a haunted house","at the North Pole","in a traffic jam","in a library","on a pirate ship","at a birthday party","inside a giant sandwich"];

function genPrompt() {
  const k = rnd(4);
  if (k === 0) { const a = pick(ADJ); return `${cap(article(a))} ${a} ${pick(ANI)} ${pick(DOING)}`; }
  if (k === 1) { const n = pick(ANI); return `${cap(article(n))} ${n} ${pick(DOING)} ${pick(PLACE)}`; }
  if (k === 2) { const j = pick(JOB); return `${cap(article(j))} ${j} ${pick(DOING)} ${pick(PLACE)}`; }
  const a = pick(ADJ), j = pick(JOB); return `${cap(article(a))} ${a} ${j} ${pick(DOING)}`;
}
const randomPrompt = () => Math.random() < 0.6 ? pick(PROMPTS) : genPrompt();

/* ---- drawing ops: {t:'s',c,w,p:[x,y,...]} stroke · {t:'f',c,x,y} fill · {t:'x'} clear ---- */
function blank(ctx) { ctx.globalAlpha = 1; ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, CW, CH); }
function strokeDot(ctx, st) { ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(st.p[0], st.p[1], st.w / 2, 0, Math.PI * 2); ctx.fill(); }
// piece k of a stroke with m>=2 points: 0 = start→mid, 1..m-2 = smooth curves, m-1 = mid→end
function strokePiece(ctx, st, k) {
  const p = st.p, m = p.length / 2;
  const X = i => p[2 * i], Y = i => p[2 * i + 1];
  const mx = i => (X(i) + X(i + 1)) / 2, my = i => (Y(i) + Y(i + 1)) / 2;
  ctx.strokeStyle = st.c; ctx.lineWidth = st.w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  if (k === 0) { ctx.moveTo(X(0), Y(0)); ctx.lineTo(mx(0), my(0)); }
  else if (k === m - 1) { ctx.moveTo(mx(m - 2), my(m - 2)); ctx.lineTo(X(m - 1), Y(m - 1)); }
  else { ctx.moveTo(mx(k - 1), my(k - 1)); ctx.quadraticCurveTo(X(k), Y(k), mx(k), my(k)); }
  ctx.stroke();
}
function floodFill(ctx, sx, sy, hex) {
  const W = CW, H = CH;

  S.live = live; live();
}
function confetti() {
  const cols = ["#ffc83d", "#ff4d8d", "#00c2ff", "#7c4dff", "#22c55e"];
  for (let i = 0; i < 70; i++) {
    const p = el("i", { class: "conf", style: { left: Math.random() * 100 + "vw", background: pick(cols), animationDelay: Math.random() * 1.2 + "s", animationDuration: 2.5 + Math.random() * 2 + "s" } });
    document.body.append(p); setTimeout(() => p.remove(), 6500);
  }
}

/* ====================================================================
   7) BOOT
   ==================================================================== */
function boot() {
  try {
    S.uid = localStorage.getItem("dp_uid") || "";
    if (!S.uid) {
      S.uid = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      localStorage.setItem("dp_uid", S.uid);
    }
    S.name = localStorage.getItem("dp_name") || "";
    const c = parseInt(localStorage.getItem("dp_color"), 10);
    S.color = Number.isFinite(c) ? clamp(c, 0, 15) : rnd(16);
  } catch (e) {
    if (!S.uid) S.uid = "u" + Math.random().toString(36).slice(2, 10);
  }
  const urlCode = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  let saved = "";
  try { saved = localStorage.getItem("dp_room") || ""; } catch (e) {}
  const tryCode = urlCode || saved;
  if (tryCode && S.name) {
    enterRoom(tryCode, false).catch(() => {
      try { localStorage.removeItem("dp_room"); } catch (e) {}
      S.prefill = urlCode;
      mount("home", buildHome);
    });
    return;
  }
  if (tryCode) S.prefill = tryCode;
  mount("home", buildHome);
}
boot();
setInterval(() => { if (sock && sock.readyState === 1) send({ t: "ping" }); }, 25000);
</script>
