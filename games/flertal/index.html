<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flertal — det mest almindelige svar vinder</title>
<meta name="description" content="Alle svarer på det samme spørgsmål. Point for hvert svar, der ligner de andres. Spil på én telefon eller hver sin.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   Flertal — the look: the game's own arcade pixel style (chunky borders,
   hard shadows, Silkscreen + VT323), arranged for a desktop screen.
   The galaxy scene stays exactly as it was.
   ====================================================================== */

:root {
  --panel: #100c34;
  --pane: #2a1f6b;
  --pane-2: #0d2e66;
  --deep: #06173a;
  --bd: #8b7bff;
  --bd-2: #2c68b0;
  --gold: #ffd23f;
  --pink: #ff3c78;
  --pink-dark: #8a1a45;
  --cyan: #1fd0ff;
  --ink: #ffffff;
  --paper: #cfe3ff;
  --mute: #9fc7ea;
  --faint: #7f9dc4;
  --display: "Silkscreen", "Courier New", monospace;
  --text: "VT323", "Courier New", monospace;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: #0a1f4a;
  color: var(--paper);
  font-family: var(--text);
  font-size: 21px;
  line-height: 1.4;
  overflow-x: hidden;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
}

/* ----------------------------------------------------------- the galaxy */
#scene {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  image-rendering: pixelated;
  pointer-events: none;
}

.sky {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 72% 18%, #4a2a8f 0, #1c1048 40%, #06031a 100%);
}

.sea, .boat, .shrimp, .cl, .alien { display: none; }

.stars { position: absolute; inset: 0; }
.stars i { position: absolute; background: #fff; animation: tw 2.5s ease-in-out infinite; }

.shoot {
  position: absolute;
  top: 12%;
  left: -10%;
  width: 70px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #fff);
  animation: sh 8s linear infinite;
}

.pln { position: absolute; animation: bob 6s ease-in-out infinite; }
.p1 { color: #ff9d5c; width: 120px; top: 9%; right: 8%; }
.p2 { color: #5ec8ff; width: 50px; top: 30%; left: 11%; animation-duration: 8s; }
.ufo { position: absolute; left: 6%; top: 52%; width: 150px; opacity: 0.9; animation: ufo 24s ease-in-out infinite alternate; }

#cv, .lay { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

#bub { position: fixed; inset: auto 0 0 0; height: 45vh; overflow: hidden; z-index: 0; pointer-events: none; }
#bub i { position: absolute; bottom: -40px; border-radius: 50%; border: 1.5px solid #9fd4ff; opacity: 0.2; animation: up linear infinite; }

.cf { position: fixed; top: -14px; width: 8px; height: 12px; z-index: 9; pointer-events: none; animation: fall linear forwards; }

/* --------------------------------------------------------------- shell */
#app { position: relative; z-index: 1; }

/* calm the galaxy behind the words, but never hide it */
#app::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(100deg, rgba(4, 10, 30, 0.86) 0, rgba(4, 10, 30, 0.62) 18%, rgba(4, 10, 30, 0.24) 38%, rgba(4, 10, 30, 0) 56%);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1220px;
  margin: 20px auto 0;
  padding: 11px 16px;
  border: 3px solid var(--bd);
  background: var(--panel);
  box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.35);
}

.brand { display: flex; align-items: baseline; gap: 12px; }

.wordmark {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow: -2px -1px 0 var(--pink), 2px 1px 0 var(--cyan);
}

.brandtag { font-size: 18px; color: var(--mute); }

.topright { display: flex; align-items: center; gap: 8px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px 3px;
  border: 2px solid var(--bd);
  background: var(--pane);
  color: #a9f0ff;
  font-family: var(--display);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.pill--gold { border-color: var(--gold); background: #3a2a08; color: var(--gold); }
.pill--quiet { border-color: var(--bd-2); background: rgba(6, 23, 58, 0.85); color: var(--mute); }

.stage {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 348px;
  gap: 22px;
  align-items: start;
  max-width: 1220px;
  margin: 18px auto 40px;
  padding: 0 18px;
}

.qpanel { padding: 20px 24px 22px; }
.qpanel .prompt { margin: 0 0 16px; }
.qpanel .row { margin-top: 14px; }

.stage--narrow {
  grid-template-columns: minmax(0, 720px);
  justify-content: center;
  align-content: center;
  min-height: calc(100vh - 128px);
  margin-bottom: 20px;
}
.stage--setup { grid-template-columns: minmax(0, 1fr) 386px; }

.col { min-width: 0; }
.col--side { display: flex; flex-direction: column; gap: 16px; }

/* -------------------------------------------------------------- panels */
.panel,
.card {
  position: relative;
  padding: 18px 20px 20px;
  border: 3px solid var(--bd);
  background: var(--panel);
  box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.35);
}

.panel--quiet { background: #0a1330; border-color: var(--bd-2); }

.card h2 {
  margin: 0 0 12px;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #fff;
}

.panel + .panel { margin-top: 16px; }

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.panel-head h2 {
  margin: 0;
  font-family: var(--display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #fff;
}

.panel-note { font-size: 18px; color: var(--mute); }

/* ------------------------------------------------------------ headline */
.hero {
  padding: 14px 26px 16px 16px;
  border-left: 3px solid var(--pink);
  background: linear-gradient(90deg, rgba(5, 9, 26, 0.92) 0, rgba(5, 9, 26, 0.78) 58%, rgba(5, 9, 26, 0) 100%);
  margin-bottom: 16px;
}

.hero-title {
  margin: 0 0 10px;
  font-family: var(--display);
  font-size: clamp(19px, 2.4vw, 29px);
  font-weight: 700;
  line-height: 1.35;
  color: #fff;
  text-shadow: 1px 2px 0 #050b1e, -1px 1px 0 #050b1e;
}

.lead {
  margin: 0;
  max-width: 62ch;
  color: var(--paper);
  font-size: 21px;
  line-height: 1.35;
}

.roundline {
  margin: 0 0 8px;
  font-size: 19px;
  letter-spacing: 0.02em;
  color: var(--mute);
}
.roundline .sep { margin: 0 7px; color: var(--faint); }

.prompt {
  margin: 0 0 16px;
  font-family: var(--text);
  font-size: clamp(34px, 3.6vw, 48px);
  line-height: 1.05;
  color: #fff;
  text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
  text-wrap: balance;
}

.accent { color: var(--gold); }

/* ------------------------------------------------------------- buttons */
button {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
  padding: 12px 15px 11px;
  border: 3px solid #fff;
  background: var(--pink);
  box-shadow: 0 4px 0 var(--pink-dark);
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.12s ease;
}

button:hover { filter: brightness(1.12); }
button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-dark); }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
button[disabled] { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

.primary { min-width: 148px; }

.primary--gold {
  background: var(--gold);
  border-color: #fff;
  color: #2a1f6b;
  box-shadow: 0 4px 0 #8a6a10;
}
.primary--gold:active { box-shadow: 0 1px 0 #8a6a10; }

.ghost {
  background: var(--pane-2);
  border-color: var(--bd);
  color: #9fe6ff;
  box-shadow: 0 4px 0 #061a3e;
}
.ghost:active { box-shadow: 0 1px 0 #061a3e; }

.link {
  align-self: flex-start;
  padding: 4px 0;
  border: 0;
  background: none;
  box-shadow: none;
  font-family: var(--text);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--gold);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.link:hover { filter: none; color: #ffe38a; }

.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.row--wrap { flex-wrap: wrap; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
.actions .hint { margin: 0; flex: 1 1 220px; }

/* -------------------------------------------------------------- inputs */
input {
  width: 100%;
  font-family: var(--text);
  font-size: 21px;
  color: #fff;
  padding: 8px 11px;
  border: 3px solid var(--bd);
  background: var(--deep);
}
input::placeholder { color: #6f8dbb; }
input:focus { outline: 0; border-color: #fff; box-shadow: 0 0 0 3px var(--pink); }

.answer-input { font-size: 26px; padding: 9px 12px; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0 4px; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 17px; color: var(--mute); }
.field input { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; padding: 9px 10px; }

.hint, .note { margin: 8px 0 0; font-size: 19px; line-height: 1.3; color: var(--mute); }
.panel--quiet p { margin: 0 0 8px; font-size: 20px; color: var(--paper); }
.panel--quiet p:last-child { margin-bottom: 0; }

/* ---------------------------------------------------------- mode picker */
.modes { display: flex; flex-direction: column; gap: 10px; }

.mode {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 11px 12px;
  text-align: left;
  font-family: var(--text);
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--paper);
  border: 3px solid var(--bd-2);
  background: var(--pane-2);
  box-shadow: 0 4px 0 #061a3e;
}

.mode--on {
  border-color: var(--pink);
  background: #6b1a47;
  box-shadow: 0 4px 0 var(--pink-dark);
}

.mode-icon { color: #9fe6ff; display: grid; place-items: center; }
.mode-icon svg { width: 20px; height: 20px; }
.mode--on .mode-icon { color: var(--gold); }

.mode-text b {
  display: block;
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
}
.mode-text small { display: block; margin-top: 3px; font-size: 18px; line-height: 1.25; color: var(--mute); }

.mode-check { color: var(--gold); display: grid; place-items: center; }
.mode-check svg { width: 16px; height: 16px; }
.mode-go { color: #9fe6ff; font-size: 22px; line-height: 1; text-align: center; }

/* --------------------------------------------------------------- seats */
.seats { display: flex; flex-direction: column; gap: 8px; }

.seat {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 11px;
  border: 2px solid var(--bd-2);
  background: #102a5e;
}

.seat--now { border-color: var(--gold); background: #3a2a08; }
.seat--done { opacity: 0.7; }
.seat--edit { background: var(--deep); border-color: var(--bd); }

.seat-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--pane)); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.14); }
.seat-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 21px; color: #eaf4ff; }
.seat-mark { margin-left: auto; min-width: 22px; text-align: right; font-family: var(--display); font-size: 9px; letter-spacing: 0.06em; color: var(--faint); }
.seat-mark.ok { color: #5dff8a; }
.seat-mark.ok svg { width: 15px; height: 15px; vertical-align: -3px; }
.seat-mark.now { color: var(--gold); }

.seat-input {
  flex: 1 1 auto;
  min-width: 0;
  width: auto;
  padding: 2px 0;
  border: 0;
  background: transparent;
  font-size: 21px;
}
.seat-input:focus { box-shadow: none; border-color: transparent; border-bottom: 2px solid var(--gold); }

.seat-remove {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid transparent;
  background: none;
  box-shadow: none;
  color: var(--faint);
  font-family: var(--display);
  font-size: 11px;
}
.seat-remove:hover { color: #ffb3c6; border-color: var(--pink); }
.seat-remove:active { transform: none; box-shadow: none; }

/* --------------------------------------------------------------- timer */
.timer {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 2px 0 16px;
  padding: 6px 4px 14px;
  border-bottom: 3px solid var(--bd-2);
}

.timer i {
  position: absolute;
  left: 0;
  bottom: -3px;
  display: block;
  width: 100%;
  height: 9px;
  background: repeating-linear-gradient(90deg, var(--cyan) 0 10px, #0f9ccc 10px 12px);
}

.timer b { font-family: var(--display); font-size: 20px; line-height: 1; color: var(--gold); }
.timer span { font-size: 18px; color: var(--mute); }
.timer.low i { background: repeating-linear-gradient(90deg, var(--pink) 0 10px, #c21f55 10px 12px); }
.timer.low b { color: var(--pink); }

.turn { font-size: 20px; color: var(--mute); margin-bottom: 2px; }
.turn-name { font-family: var(--display); font-size: 11px; letter-spacing: 0.06em; color: var(--gold); text-transform: uppercase; }

/* ------------------------------------------------------- answer groups */
.q { margin-bottom: 8px; font-size: 19px; color: var(--mute); }

.answer-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 11px 12px;
  border: 2px solid var(--bd-2);
  background: #102a5e;
  margin-bottom: 8px;
}

.answer-row--lead { border-color: var(--pink); background: #4a1230; }

.answer-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.answer-text { font-size: 27px; line-height: 1.1; color: #fff; }
.answer-who { margin: 0 0 7px; font-size: 18px; color: var(--mute); }
.answer-alt { color: var(--faint); }
.answer-pts { font-family: var(--display); font-size: 15px; color: var(--gold); align-self: center; }

.tier {
  padding: 2px 7px 1px;
  border: 2px solid var(--bd);
  background: var(--pane);
  font-family: var(--display);
  font-size: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #a9f0ff;
}

.bar { height: 9px; background: #081631; border: 1px solid rgba(139, 123, 255, 0.28); overflow: hidden; }
.bar i {
  display: block;
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--cyan) 0 8px, #0f9ccc 8px 10px);
  animation: grow 0.7s ease both;
}

/* --------------------------------------------------------------- board */
.board { display: flex; flex-direction: column; gap: 8px; }

.board-row {
  padding: 8px 10px;
  border: 2px solid var(--bd-2);
  background: #102a5e;
}
.board-row--lead { border-color: var(--gold); background: #3a2a08; }

.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
.board-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 21px; color: #eaf4ff; }
.board-pts { font-family: var(--display); font-size: 12px; color: var(--gold); }
.board-row--lead .board-name { color: #fff; }

/* -------------------------------------------------------------- gamble */
.stakes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 10px 0 4px; }

.stake {
  padding: 8px 10px;
  border: 2px solid var(--bd-2);
  background: var(--deep);
}
.stake small { display: block; font-size: 16px; line-height: 1.2; color: var(--mute); }
.stake b { display: block; margin-top: 2px; font-family: var(--display); font-size: 14px; color: var(--gold); }

/* ------------------------------------------------------------ handoff */
.handoff {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 38px 24px;
  border: 3px solid var(--bd);
  background: var(--panel);
  box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.35);
  text-align: center;
}

.handoff h1 {
  margin: 4px 0 6px;
  font-family: var(--display);
  font-size: clamp(16px, 2vw, 22px);
  line-height: 1.3;
  color: #fff;
  text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
}
.handoff .lead { max-width: 40ch; margin: 0 auto 20px; }
.handoff-icon {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-bottom: 6px;
  border: 3px solid var(--gold);
  background: #3a2a08;
  color: var(--gold);
}
.handoff-icon svg { width: 22px; height: 22px; }
.handoff-icon.ok { border-color: #5dff8a; background: #0b2f1c; color: #5dff8a; }

/* ------------------------------------------------------------- winner */
.winner { padding: 34px 22px; text-align: center; }
.winner-icon {
  display: inline-grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin-bottom: 4px;
  border: 3px solid var(--gold);
  background: #3a2a08;
  color: var(--gold);
}
.winner-icon svg { width: 34px; height: 34px; }
.winner-name {
  margin: 8px 0 10px;
  font-family: var(--display);
  font-size: clamp(20px, 2.8vw, 30px);
  line-height: 1.25;
  color: #fff;
  text-shadow: -2px -1px 0 var(--pink), 2px 1px 0 var(--cyan);
}
.winner .row { justify-content: center; }
.winner .roundline { margin-bottom: 0; }

/* the crate spin replaces the whole screen with one card */
#app:has(> .card) {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

#app > .card { width: min(1180px, 100%); padding: 22px 24px 26px; }
#app > .card h2 { text-align: center; }

/* ------------------------------------------------------------ the crate */
.cs {
  position: relative;
  height: 150px;
  margin: 14px 0 4px;
  overflow: hidden;
  border: 3px solid var(--bd);
  background: var(--deep);
}

.cs::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(6, 23, 58, 0.97), transparent 14%, transparent 86%, rgba(6, 23, 58, 0.97));
}

.mk {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  z-index: 2;
  width: 4px;
  margin-left: -2px;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
}

.st { display: flex; padding: 14px 0; will-change: transform; }

.tl {
  display: flex;
  flex: 0 0 126px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 118px;
  margin-right: 6px;
  border: 2px solid var(--bd-2);
  border-bottom: 6px solid var(--rc, var(--bd));
  background: #1d1650;
}
.tl b { max-width: 106px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--text); font-size: 21px; font-weight: 400; color: #fff; }
.tl small { font-family: var(--display); font-size: 9px; color: var(--rc, var(--gold)); }
.tl.w { border-color: var(--rc, var(--gold)); background: #2e2270; }
.st.done .tl:not(.w) { opacity: 0.32; transition: opacity 0.4s; }

/* ---------------------------------------------------------------- code */
.roomcode {
  margin: 2px 0 12px;
  font-family: var(--display);
  font-size: clamp(26px, 2.6vw, 34px);
  letter-spacing: 0.16em;
  text-align: center;
  color: var(--gold);
  text-shadow: -2px -1px 0 var(--pink), 2px 1px 0 var(--cyan);
}

.code-input { font-family: var(--display); font-size: 15px; letter-spacing: 0.3em; text-align: center; text-transform: uppercase; }

.button-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 12px 15px 11px;
  border: 3px solid var(--bd);
  background: var(--pane-2);
  box-shadow: 0 4px 0 #061a3e;
  color: #9fe6ff;
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
}
.button-link:hover { filter: brightness(1.12); }
.button-link:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

/* ---------------------------------------------------------------- steps */
.steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}

.steps li {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border: 3px solid var(--bd-2);
  background: #0d2e66;
  box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
}

.step-n {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border: 2px solid var(--gold);
  background: #3a2a08;
  font-family: var(--display);
  font-size: 9px;
  color: var(--gold);
}

.step-text b { display: block; font-family: var(--display); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; }
.step-text small { display: block; margin-top: 4px; font-size: 18px; line-height: 1.25; color: #c3d9f7; }

@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }

/* -------------------------------------------------------------- motion */
@keyframes tw { 50% { opacity: 0.15; } }
@keyframes tw1 { 50% { opacity: 0.25; } }
@keyframes tw2 { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@keyframes spinG { to { transform: rotate(360deg); } }
@keyframes sh { 0% { transform: translate(0, 0) rotate(20deg); opacity: 0; } 4% { opacity: 1; } 28%, 100% { transform: translate(125vw, 48vh) rotate(20deg); opacity: 0; } }
@keyframes hz { to { transform: translate(-50px, 25px) scale(1.08); } }
@keyframes bob { 50% { transform: translateY(5px) rotate(-1.5deg); } }
@keyframes fl { 50% { transform: translate(-10px, -12px) rotate(-8deg); } }
@keyframes ufo { 0% { transform: translate(0, 0) rotate(-3deg); } 50% { transform: translate(24vw, -6vh) rotate(3deg); } 100% { transform: translate(46vw, 3vh) rotate(-2deg); } }
@keyframes up { to { transform: translateY(-45vh); } }
@keyframes grow { from { width: 0; } }
@keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.shake { animation: shake 0.32s; border-color: var(--pink) !important; }

/* ------------------------------------------------------------ responsive */
@media (max-width: 1020px) {
  .stage, .stage--setup { grid-template-columns: minmax(0, 1fr); }
  .col--side { order: 2; }
}

@media (max-width: 720px) {
  body { font-size: 20px; }
  .topbar { margin: 12px 12px 0; padding: 9px 12px; }

  .hero-title { font-size: 18px; }
  .prompt { font-size: clamp(28px, 8vw, 36px); }
  .stakes { grid-template-columns: 1fr; }
  .handoff { padding: 28px 16px; }
  .answer-text { font-size: 23px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .cf, #bub, .shoot { display: none !important; }
}

/* ======================================================================
   Flertal — game logic and screens (one phone mode + the shared shell).
   The galaxy behind everything is drawn by the scene code above; this
   file only builds what sits on top of it.
   ====================================================================== */

const PCOL = ["#ff8a8a", "#57d7e6", "#ffd23f", "#b39bff", "#6ef0b0", "#ffa06b", "#6fc7ff", "#f39fd0"];
const pcol = n => PCOL[(Math.max(0, S.players.indexOf(n)) % 8)];

const IC = {
  phone: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="1.5" width="9" height="17" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="4.5" width="4" height="8" fill="currentColor"/><circle cx="10" cy="15.4" r="1.1" fill="currentColor"/></svg>',
  net: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.6" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="10" cy="10" rx="3.3" ry="7.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.4 10h15.2" stroke="currentColor" stroke-width="1.4"/></svg>',
  dice: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.4" y="2.4" width="15.2" height="15.2" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/><circle cx="13" cy="13" r="1.5" fill="currentColor"/><circle cx="13" cy="7" r="1.5" fill="currentColor"/><circle cx="7" cy="13" r="1.5" fill="currentColor"/></svg>',
  trophy: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.2 2.2h9.6v5.4a4.8 4.8 0 0 1-9.6 0z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.2 4H2.4v1.8a3 3 0 0 0 3 3M14.8 4h2.8v1.8a3 3 0 0 1-3 3M8.6 12.4h2.8v4M6.2 17.8h7.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  check: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.4 10.6l4.2 4.2 9-9" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>'
};

/* ---------------------------------------------------------------- chrome */
function topbar(right) {
  return '<header class="topbar">' +
    '<div class="brand"><span class="wordmark">FLERTAL</span><span class="brandtag">følg flokken</span></div>' +
    '<div class="topright">' + (right || "") + "</div>" +
    "</header>";
}

function pill(text, tone) {
  return '<span class="pill' + (tone ? " pill--" + tone : "") + '">' + text + "</span>";
}

function roundLine() {
  const speed = S.sp ? '<span class="sep">·</span> Speedrunde, spørgsmål ' + (S.sp.q + 1) + " af 3" : "";
  return '<p class="roundline">Runde ' + S.r + " af " + S.rounds + speed + "</p>";
}

/* ---------------------------------------------------------------- pieces */
function seatRow(name, index, state, hue) {
  const mark = state === "done" ? '<span class="seat-mark ok">' + IC.check + "</span>"
    : state === "now" ? '<span class="seat-mark now">nu</span>'
      : '<span class="seat-mark">' + (index + 1) + "</span>";
  return '<div class="seat' + (state === "now" ? " seat--now" : "") + (state === "done" ? " seat--done" : "") + '">' +
    '<span class="seat-dot" style="--dot:' + (hue || pcol(name)) + '"></span>' +
    '<span class="seat-name">' + esc(name) + "</span>" + mark + "</div>";
}

function board() {
  const rows = Object.entries(S.scores).sort((a, b) => b[1] - a[1]);
  const best = rows.length ? Math.max(1, rows[0][1]) : 1;
  return '<div class="board">' + rows.map(function (row, i) {
    const name = row[0], pts = row[1];
    return '<div class="board-row' + (i === 0 && pts > 0 ? " board-row--lead" : "") + '">' +
      '<div class="board-body">' +
        '<div class="board-head"><span class="board-name">' + esc(name) + "</span>" +
        '<span class="board-pts">' + pts + "</span></div>" +
        '<div class="bar"><i style="width:' + (pts / best * 100) + '%"></i></div>' +
      "</div></div>";
  }).join("") + "</div>";
}

/* ---------------------------------------------------------------- setup */
function setup() {
  S.phase = "setup";
  S.players = ["", ""];
  const right = pill("2–8 spillere", "quiet");
  $.innerHTML = topbar(right) +
    '<section class="stage stage--setup">' +
      "<div class=\"col\">" +
        '<div class="hero">' +
          '<h1 class="hero-title">Hvem tænker som flokken?</h1>' +
          '<p class="lead">Alle svarer på det samme spørgsmål. Du får et point for hver anden spiller, der skrev det samme som dig — så det gælder om at tænke som de andre, ikke som dig selv.</p>' +
        "</div>" +
        '<div class="panel">' +
          '<div class="panel-head"><h2>Spillere</h2><span class="panel-note" id="pcount">2 af 8</span></div>' +
          '<div id="roster" class="seats"></div>' +
          '<div class="row"><button class="ghost" onclick="addP()">Tilføj spiller</button></div>' +
        "</div>" +
        stepsBlock() +
      "</div>" +
      '<aside class="col col--side">' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>Sådan spilles der</h2></div>' +
          '<div class="modes">' +
            '<div class="mode mode--on"><span class="mode-icon">' + IC.phone + "</span>" +
              '<span class="mode-text"><b>Én telefon</b><small>I deles om skærmen og giver den videre</small></span>' +
              '<span class="mode-check">' + IC.check + "</span></div>" +
            '<button class="mode" onclick="flt.setup()"><span class="mode-icon">' + IC.net + "</span>" +
              '<span class="mode-text"><b>Hver sin telefon</b><small>Alle deltager fra egen enhed med en kode</small></span>' +
              '<span class="mode-go">' + "›" + "</span></button>" +
          "</div>" +
          '<div class="fields">' +
            '<label class="field"><span>Runder</span><input id="rn" type="number" min="1" max="15" value="5" inputmode="numeric"></label>' +
            '<label class="field"><span>Speedrunder</span><input id="sr" type="number" min="0" max="10" value="1" inputmode="numeric"></label>' +
          "</div>" +
          '<p class="hint">En speedrunde samler tre hurtige spørgsmål med halv tid.</p>' +
          '<div class="row"><button class="primary" onclick="start()">Start spillet</button></div>' +
          '<button class="link" onclick="how()">Sådan tælles point</button>' +
        "</div>" +
        '<div class="panel panel--quiet" id="hw" hidden>' +
          "<p>Hvert svar giver et point for hver anden spiller, der skrev det samme. Gruppen med flest stemmer får point til alle sine medlemmer.</p>" +
          "<p>Stavefejl tæller med: «pizzza» og «pizza» går i samme gruppe, og svaret vises med den stavemåde, flest brugte.</p>" +
          "<p>Vinderne af en runde må gamble: rundens point eller hele deres saldo går i en fælles pulje, og én trækkes som vinder.</p>" +
        "</div>" +
      "</aside>" +
    "</section>";
  drawP();
}

function stepsBlock() {
  const steps = [
    ["Alle svarer", "Samme spørgsmål, hver for sig, inden tiden løber ud."],
    ["Point for fællesskab", "Et point for hver anden spiller, der skrev det samme — også når I staver lidt forskelligt."],
    ["Vinderne gambler", "Rundens point eller hele saldoen i én pulje. Én trækkes som vinder."]
  ];
  return '<ol class="steps">' + steps.map(function (step, i) {
    return '<li><span class="step-n">' + (i + 1) + "</span>" +
      '<span class="step-text"><b>' + step[0] + "</b><small>" + step[1] + "</small></span></li>";
  }).join("") + "</ol>";
}

function drawP() {
  const list = document.getElementById("roster");
  if (!list) return;
  list.innerHTML = S.players.map(function (name, i) {
    return '<div class="seat seat--edit">' +
      '<span class="seat-dot" style="--dot:' + PCOL[i % 8] + '"></span>' +
      '<input class="seat-input" placeholder="Spiller ' + (i + 1) + '" value="' + esc(name) + '" maxlength="14" ' +
      'oninput="S.players[' + i + ']=this.value" aria-label="Navn på spiller ' + (i + 1) + '">' +
      (S.players.length > 2 ? '<button class="seat-remove" onclick="delP(' + i + ')" aria-label="Fjern spiller ' + (i + 1) + '">×</button>' : "") +
      "</div>";
  }).join("");
  const count = document.getElementById("pcount");
  if (count) count.textContent = S.players.length + " af 8";
}

function addP() {
  if (S.players.length >= 8) return;
  S.players.push("");
  drawP();
  const inputs = document.querySelectorAll(".seat-input");
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function delP(i) {
  if (S.players.length <= 2) return;
  S.players.splice(i, 1);
  drawP();
}

function start() {
  const names = S.players.map(function (name, i) { return String(name).trim() || "Spiller " + (i + 1); });
  S.players = names;
  const rounds = Math.max(1, Math.min(15, +document.getElementById("rn").value || 5));
  const speed = Math.max(0, Math.min(10, +document.getElementById("sr").value || 0));
  const total = rounds + speed;
  const plan = Array(total).fill("n");
  for (let i = 0; i < speed; i++) plan[Math.min(total - 1, Math.floor(((i + 1) * total) / (speed + 1)))] = "s";
  S.plan = plan;
  S.rounds = total;
  S.r = 0;
  S.used = load();
  S.sz = {};
  S.scores = {};
  names.forEach(function (name) { S.scores[name] = 0; });
  newRound();
}

function how() {
  const box = document.getElementById("hw");
  if (box) box.hidden = !box.hidden;
}

/* ---------------------------------------------------------------- a round */
function newRound() {
  S.r++;
  S.idx = 0;
  S.ans = [];
  S.sp = S.plan[S.r - 1] === "s" ? { q: 0, res: [], pts: {} } : null;
  S.prompt = pick();
  ask();
}

function seatsDuringRound() {
  return S.players.map(function (name, i) {
    const state = i < S.idx ? "done" : i === S.idx ? "now" : "";
    return seatRow(name, i, state);
  }).join("");
}

function ask() {
  S.phase = "ask";
  const now = S.players[S.idx];
  const total = timerSeconds();
  $.innerHTML = topbar("") +
    '<section class="stage">' +
      '<div class="col">' +
        '<div class="panel qpanel">' +
          roundLine() +
          '<h1 class="prompt">' + esc(S.prompt) + "</h1>" +
          '<div class="timer" id="tm"><i id="tb"></i><b id="ts">' + Math.ceil(total) + "</b><span>sekunder tilbage</span></div>" +
          '<div class="turn"><span class="turn-name">' + esc(now) + "</span> svarer nu</div>" +
          '<input id="a" class="answer-input" autocomplete="off" placeholder="Dit svar" aria-label="Dit svar" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();submit()}">' +
          '<div class="row"><button class="primary" onclick="submit()">Lås svar</button>' +
          '<span class="hint">Svar som flokken — stavefejl tæller med.</span></div>' +
        "</div>" +
      "</div>" +
      '<aside class="col col--side">' +
        '<div class="panel panel--quiet"><div class="panel-head"><h2>Rækkefølge</h2>' +
        '<span class="panel-note">' + S.idx + " af " + S.players.length + "</span></div>" +
        '<div class="seats">' + seatsDuringRound() + "</div></div>" +
        '<div class="panel"><div class="panel-head"><h2>Stilling</h2></div>' + board() + "</div>" +
      "</aside>" +
    "</section>";
  const input = document.getElementById("a");
  if (input) { input.focus(); }
  startT();
}

function submit() {
  const field = document.getElementById("a");
  const value = tidy(field.value);
  if (!value || !norm(value)) {
    field.classList.remove("shake");
    void field.offsetWidth;
    field.classList.add("shake");
    field.focus();
    return;
  }
  stopT();
  S.ans.push({ n: S.players[S.idx], t: value, k: norm(value) });
  S.idx++;
  if (S.idx < S.players.length) {
    $.innerHTML = topbar("") +
      '<section class="stage stage--narrow">' +
        '<div class="col">' +
          '<div class="handoff">' +
            '<span class="handoff-icon ok">' + IC.check + "</span>" +
            "<h1>Svar gemt</h1>" +
            '<p class="lead">Giv telefonen videre til <b class="accent">' + esc(S.players[S.idx]) + "</b>. Ingen må se svaret.</p>" +
            '<button class="primary" onclick="ask()">' + esc(S.players[S.idx]) + " er klar</button>" +
          "</div>" +
        "</div>" +
      "</section>";
  } else {
    spNext();
  }
}

function questionCard(entry) {
  const top = entry.list.length ? entry.list[0].m.length : 0;
  return '<div class="panel">' +
    (entry.q ? '<div class="q">' + esc(entry.q) + "</div>" : "") +
    entry.list.map(function (group) {
      const lead = group.m.length === top && top > 1;
      return '<div class="answer-row' + (lead ? " answer-row--lead" : "") + '">' +
        '<div class="answer-body">' +
          '<div class="answer-head"><span class="answer-text">' + esc(group.t) + "</span>" +
          '<span class="tier">' + tier(group.m.length) + "</span></div>" +
          '<div class="answer-who">' + group.m.map(esc).join(", ") +
            (group.v && group.v.length ? ' <span class="answer-alt">· også «' + group.v.map(esc).join("», «") + '»</span>' : "") + "</div>" +
          '<div class="bar"><i style="width:' + Math.round(group.m.length / S.players.length * 100) + '%"></i></div>' +
        "</div>" +
        '<div class="answer-pts">+' + (group.m.length - 1) + "</div>" +
      "</div>";
    }).join("") +

}

function actionsRow(buttons) {

}

function nextButton() {
  return S.r < S.rounds
    ? '<button class="primary" onclick="newRound()">Næste runde</button>'
    : '<button class="primary" onclick="finish()">Se vinderen</button>';
}

function reveal() {
  S.phase = "reveal";
  const list = groupAnswers(S.ans.map(function (a) { return { key: a.k, text: a.t, who: a.n }; }))
    .map(function (g) { return { t: g.t, m: g.list.map(function (e) { return e.who; }), v: g.v }; });
  const top = list[0].m.length;
  S.rp = {};
  list.forEach(function (group) {
    const plus = group.m.length - 1;
    group.m.forEach(function (name) { S.scores[name] += plus; S.rp[name] = plus; });
  });
  S.win = top > 1
    ? list.filter(function (g) { return g.m.length === top; }).flatMap(function (g) { return g.m; }).filter(function (n) { return S.scores[n] > 0; })
    : [];
  $.innerHTML = topbar("") +
    '<section class="stage">' +
      '<div class="col">' +
        roundLine() +
        '<h1 class="prompt">' + esc(S.prompt) + "</h1>" +
        questionCard({ q: "", list: list }) +
        actionsRow(
          (S.win.length ? '<button class="primary primary--gold" onclick="gStart()">Gamble point</button>' : "") + nextButton()
        ) +
      "</div>" +
      '<aside class="col col--side">' +
        '<div class="panel"><div class="panel-head"><h2>Stilling</h2></div>' + board() + "</div>" +
      "</aside>" +
    "</section>";
}

function spNext() {
  if (!S.sp) return reveal();
  const list = groupAnswers(S.ans.map(function (a) { return { key: a.k, text: a.t, who: a.n }; }))
    .map(function (g) { return { t: g.t, m: g.list.map(function (e) { return e.who; }), v: g.v }; });
  list.forEach(function (group) {
    const plus = group.m.length - 1;
    group.m.forEach(function (name) {
      S.scores[name] += plus;
      S.sp.pts[name] = (S.sp.pts[name] || 0) + plus;
    });
  });
  S.sp.res.push({ q: S.prompt, list: list });
  if (S.sp.q < 2) {
    S.sp.q++;
    S.idx = 0;

            '<span class="handoff-icon">' + IC.phone + "</span>" +
            "<h1>Næste spørgsmål</h1>" +
            '<p class="lead">Giv telefonen til <b class="accent">' + esc(S.players[0]) + "</b>. Tre spørgsmål, halv tid.</p>" +
            '<button class="primary" onclick="ask()">Jeg er klar</button>' +

function spReveal() {

    "</section>";

}

/* ---------------------------------------------------------------- gamble */
function gStart() { S.gi = 0; S.gam = []; S.stk = {}; gAsk(); }

function gAsk() {
  const name = S.win[S.gi];
  const total = S.scores[name];
  const round = S.rp[name];
  const share = total ? Math.round(round / total * 100) : 0;
  const right = pill("Kassen", "gold");
  $.innerHTML = topbar(right) +
    '<section class="stage stage--narrow">' +
      '<div class="col">' +
        '<div class="panel gamble">' +
          '<div class="panel-head"><h2>' + esc(name) + ", vil du satse?</h2>" +
          '<span class="panel-note">' + S.gi + " af " + S.win.length + "</span></div>" +
          '<div class="stakes">' +
            '<div class="stake"><small>I alt</small><b>' + total + "</b></div>" +
            '<div class="stake"><small>Fra runden</small><b>' + round + "</b></div>" +
            '<div class="stake"><small>Andel af saldoen</small><b>' + share + "%</b></div>" +
          "</div>" +
          '<p class="hint">Alt der satses, går i én pulje. Én gambler trækkes som vinder og tager hele puljen, og din chance følger din indsats. Gambler du alene, er det dobbelt eller intet.</p>' +
          '<div class="row row--wrap">' +
            (round < total ? '<button onclick="gPick(1)">Sats ' + round + " (rundens)</button>" : "") +
            '<button onclick="gPick(2)">Sats alt: ' + total + "</button>" +
            '<button class="ghost" onclick="gPick(0)">Behold point</button>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</section>";
}

function gPick(choice) {
  const name = S.win[S.gi];
  if (choice) {
    S.gam.push(name);
    S.stk[name] = choice === 1 ? S.rp[name] : S.scores[name];
  }
  S.gi++;
  if (S.gi < S.win.length) {
    $.innerHTML = topbar(pill("Kassen", "gold")) +
      '<section class="stage stage--narrow"><div class="col">' +
        '<div class="handoff">' +
          '<span class="handoff-icon ok">' + IC.check + "</span>" +
          "<h1>Valg gemt</h1>" +
          '<p class="lead">Giv telefonen til <b class="accent">' + esc(S.win[S.gi]) + "</b>.</p>" +
          '<button class="primary" onclick="gAsk()">' + esc(S.win[S.gi]) + " er klar</button>" +
        "</div>" +
      "</div></section>";
  } else {
    gRoll();
  }
}

function gRoll() {
  const gamblers = S.gam;
  if (!gamblers.length) return gEnd("Ingen valgte at gamble denne gang.");
  const stakes = gamblers.map(function (n) { return S.stk[n]; });
  if (gamblers.length === 1) {
    const name = gamblers[0];
    const win = Math.random() < 0.5;
    spin([
      { t: name + " dobler", p: 0.5, c: "#8b7bff" },
      { t: "Ingenting", p: 0.5, c: "#5b5a80" }
    ], win ? 0 : 1, function () {
      S.scores[name] += win ? stakes[0] : -stakes[0];
      gEnd(win ? name + " fordoblede sin indsats til " + stakes[0] * 2 + " point." : name + " tabte sin indsats.");
    });
    return;
  }
  const total = stakes.reduce(function (a, b) { return a + b; }, 0);
  let ticket = Math.random() * total;
  let index = 0;
  while (index < gamblers.length - 1 && ticket > stakes[index]) { ticket -= stakes[index]; index++; }
  spin(gamblers.map(function (name, i) { return { t: name, p: stakes[i] / total }; }), index, function () {
    gamblers.forEach(function (name) { S.scores[name] -= S.stk[name]; });
    S.scores[gamblers[index]] += total;
    gEnd(gamblers[index] + " vandt puljen på " + total + " point.");
  });
}

function gEnd(message) {
  $.innerHTML = topbar(pill("Kassen", "gold")) +
    '<section class="stage">' +
      '<div class="col">' +
        '<div class="panel"><div class="panel-head"><h2>Kassen er åbnet</h2></div>' +
        '<p class="lead">' + esc(message) + "</p></div>" +
        actionsRow(nextButton()) +
      "</div>" +
      '<aside class="col col--side"><div class="panel"><div class="panel-head"><h2>Stilling</h2></div>' + board() + "</div></aside>" +
    "</section>";
  if (/vandt|fordoblede/i.test(message)) confetti();
}

/* ---------------------------------------------------------------- finish */
function finish() {
  const rows = Object.entries(S.scores).sort(function (a, b) { return b[1] - a[1]; });
  const best = rows.length ? rows[0][1] : 0;
  const winners = rows.filter(function (row) { return row[1] === best; }).map(function (row) { return row[0]; });
  $.innerHTML = topbar(pill("Slut", "quiet")) +

      '<div class="col">' +
        '<div class="panel winner">' +

          '<h1 class="winner-name">' + winners.map(esc).join(" & ") + "</h1>" +
          '<p class="lead">' + (winners.length > 1
            ? "deler sejren. I tænker lige ens."
            : "tænkte mest som flokken og vandt med " + best + " point.") + "</p>" +
          '<div class="row"><button class="primary" onclick="setup()">Spil igen</button></div>' +
        "</div>" +
      "</div>" +
      '<aside class="col col--side"><div class="panel"><div class="panel-head"><h2>Slutstilling</h2></div>' + board() + "</div></aside>" +
    "</section>";
  confetti();
}

/* ---------------------------------------------------------------- helpers */
function timerSeconds() { return S.sp ? 12.5 : 25; }

let T = null;

function stopT() {
  if (T) { clearInterval(T); T = null; }
}

function startT() {
  stopT();
  const bar = document.getElementById("tb");
  const label = document.getElementById("ts");
  const box = document.getElementById("tm");
  if (!bar) return;
  const total = timerSeconds();
  const started = Date.now();

  bar.style.width = "100%";
  void bar.offsetWidth;
  bar.style.transition = "width " + total + "s linear";
  bar.style.width = "0%";
  T = setInterval(function () {
    const left = Math.max(0, total - (Date.now() - started) / 1000);
    if (label) label.textContent = String(Math.ceil(left));
    if (box && left <= 5) box.classList.add("low");
    if (left <= 0) {
      stopT();
      const field = document.getElementById("a");
      if (field && !field.value.trim()) field.value = "(ingen svar)";
      submit();
    }
  }, 200);
}

function tier(count) {
  const share = count / S.players.length;
  if (share >= 1) return "hele flokken";
  if (share >= 0.6) return "stor flok";
  if (share >= 0.4 && count > 1) return "flok";
  return count > 1 ? "par" : "enlig";
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFC").replace(/[^a-zæøå0-9]/g, "");
const tidy = s => String(s).replace(/\s+/g, " ").trim();

// A looser spelling used only when looking for typos: kaffe/kafe, c/k, ph/f,
// one or two of the same letter, and the Danish letters without their dots all
// count as the same answer.
const sound = s => norm(s)
  .replace(/aa/g, "å")
  .replace(/ph/g, "f")
  .replace(/c/g, "k")
  .replace(/z/g, "s")
  .replace(/w/g, "v")
  .replace(/x/g, "ks")
  .replace(/å/g, "a")
  .replace(/æ/g, "e")
  .replace(/ø/g, "o")
  .replace(/(.)\1+/g, "$1");

/* ---------------------------------------------------------- autocorrect */
// Svar der kun adskiller sig med en tastefejl eller to, tæller som det samme.
function editDist(a, b, max) {
  const la = a.length, lb = b.length, INF = max + 1;
  let row0 = new Array(lb + 1), row1 = new Array(lb + 1);
  for (let j = 0; j <= lb; j++) { row0[j] = INF; row1[j] = j; }
  for (let i = 1; i <= la; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= lb; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      let v = Math.min(row1[j] + 1, cur[j - 1] + 1, row1[j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, row0[j - 2] + 1);
      cur[j] = v;
      if (v < best) best = v;
    }
    if (best > max) return INF;
    row0 = row1;
    row1 = cur;
  }
  return row1[lb];
}

// Two answers are the same when they are spelled the same, or when they differ
// by about one letter in five. The first letter may differ too, so "koffe" and
// "coffe" still land together, while short words stay apart ("hund" vs "bund").
function isTypo(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  const sa = sound(a), sb = sound(b);
  if (sa === sb) return true;
  const longest = Math.max(sa.length, sb.length);
  if (longest < 5) return false;
  const allowance = longest >= 12 ? 3 : longest >= 8 ? 2 : 1;
  if (Math.abs(sa.length - sb.length) > allowance) return false;
  const distance = editDist(sa, sb, allowance);
  return distance <= allowance && distance / longest <= 0.3;
}

// [{ key, text, ... }] -> [{ t, list, size }], med den mest brugte stavemåde som overskrift
function groupAnswers(entries) {
  const groups = [];
  entries.forEach(function (entry) {
    let group = null;
    for (let i = 0; i < groups.length; i++) {
      if (groups[i].list.some(function (other) { return isTypo(other.key, entry.key); })) { group = groups[i]; break; }
    }
    if (!group) { group = { list: [] }; groups.push(group); }
    group.list.push(entry);
  });
  return groups.map(function (group) {
    const texts = {};
    group.list.forEach(function (e) { texts[e.text] = (texts[e.text] || 0) + 1; });
    const t = Object.keys(texts).sort(function (x, y) { return texts[y] - texts[x] || x.length - y.length; })[0];
    const v = Object.keys(texts).filter(function (k) { return k !== t; })
      .sort(function (x, y) { return texts[y] - texts[x]; });
    return { t: t, list: group.list, size: group.list.length, v: v };
  }).sort(function (a, b) { return b.size - a.size; });
}

function pick() {
  let pool = PROMPTS.filter(function (_, i) { return !S.used.includes(i); });
  if (!pool.length) { S.used = []; pool = PROMPTS; }
  const prompt = pool[Math.floor(Math.random() * pool.length)];
  S.used.push(PROMPTS.indexOf(prompt));
  save();
  return prompt;
}

        '<div class="panel"><div class="panel-head"><h2>Har du en kode?</h2></div>' +
        '<label class="field"><span>Fire tegn fra værten</span>' +
        '<input id="joincode" class="code-input" maxlength="4" autocomplete="off" placeholder="AB3K" value="' + esc(net.pendingCode || "") + '"></label>' +
        '<div class="row"><button class="ghost" onclick="flt.join()">Deltag</button></div></div>';
    }

    app.innerHTML = topbar(pill("Hver sin telefon", "gold")) +
      '<section class="stage stage--setup">' +
        '<div class="col">' +
          '<div class="hero"><h1 class="hero-title">Alle svarer fra deres egen enhed</h1>' +
          '<p class="lead">Værten opretter en kamp og får en kode på fire tegn. De andre skriver koden ind hos sig selv — så svarer alle samtidig, og resultatet lander på alle skærme på én gang.</p></div>' +
          '<div class="panel"><div class="panel-head"><h2>Spil på</h2></div>' + modeSwitch() + "</div>" +
          '<button class="link" onclick="how()">Sådan tælles point</button>' +
          '<div class="panel panel--quiet" id="hw" hidden>' +
            "<p>Hvert svar giver et point for hver anden spiller, der skrev det samme. Gruppen med flest stemmer får point til alle sine medlemmer.</p>" +
            "<p>Vinderne af en runde må gamble: rundens point eller hele deres saldo går i en fælles pulje, og én trækkes som vinder.</p>" +
          "</div>" +
        "</div>" +
        '<aside class="col col--side">' + side + "</aside>" +
      "</section>";
  }

  function drawLobby(room) {
    const mine = net.uid;
    const host = room.host === mine;
    const people = roster(room);
    app.innerHTML = topbar(pill("Kode " + room.code, "gold")) +
      '<section class="stage stage--setup">' +
        '<div class="col">' +
          '<div class="hero"><h1 class="hero-title">Alle er med, når værten starter</h1>' +
          '<p class="lead">Del koden med dem, der skal spille. De vælger “Hver sin telefon”, skriver koden og dukker op her med det samme.</p></div>' +
          '<div class="panel"><div class="panel-head"><h2>Spillere</h2>' +
          '<span class="panel-note">' + people.length + " af " + MAX + "</span></div>" +
          '<div class="seats">' + peopleRows(room, function (p) { return p.uid === mine ? "me" : ""; }) + "</div></div>" +
        "</div>" +
        '<aside class="col col--side">' +
          '<div class="panel"><div class="panel-head"><h2>Rumkode</h2></div>' +
            '<p class="roomcode">' + esc(room.code) + "</p>" +
            '<div class="row">' +
              '<button class="ghost" onclick="flt.copy()">Kopiér invitationslink</button>' +
              '<button class="ghost" onclick="flt.inviteFriend()">Inviter en ven</button>' +
            "</div>" +
            '<p class="hint" id="copynote">De andre åbner linket eller skriver koden.</p>' +
          "</div>" +
          (host
            ? '<div class="panel"><div class="panel-head"><h2>Runder</h2></div>' +
              '<div class="fields">' +
                '<label class="field"><span>Runder</span><input id="rn" type="number" min="1" max="15" value="' + (room.rounds || 5) + '" inputmode="numeric"></label>' +
                '<label class="field"><span>Speedrunder</span><input id="sr" type="number" min="0" max="10" value="' + (room.speed || 0) + '" inputmode="numeric"></label>' +
              "</div>" +
              '<p class="hint">En speedrunde samler tre hurtige spørgsmål med halv tid.</p>' +
              (people.length < 2
                ? '<p class="hint">I skal være mindst to spillere.</p><div class="row"><button class="primary" disabled>Start spillet</button></div>'
                : '<div class="row"><button class="primary" onclick="flt.start()">Start spillet</button></div>') +
              "</div>"
            : '<div class="panel panel--quiet"><p class="hint">Værten vælger antal runder og starter spillet.</p></div>') +
          '<button class="link" onclick="flt.leave()">Forlad kampen</button>' +
        "</aside>" +
      "</section>";
  }

  function drawAsk(room) {
    // A new question starts with an empty draft.
    const draftKey = room.round + "-" + room.qi;
    if (net.draftKey !== draftKey) { net.draftKey = draftKey; net.draft = ""; }
    const speed = (room.plan || [])[room.round - 1] === "s";
    const seconds = speed ? 12.5 : 25;
    const prompt = (room.prompts || [])[room.qi] || "";
    const mine = (room.answers || {})[net.uid];
    const total = roster(room).length;
    const answered = Object.keys(room.answers || {}).length;
    const head = '<p class="roundline">Runde ' + room.round + " af " + room.rounds +
      (speed ? '<span class="sep">·</span>Speedrunde, spørgsmål ' + (room.qi + 1) + " af 3" : "") + "</p>";

    const main = mine
      ? '<div class="handoff">' +
          '<span class="handoff-icon ok">' + IC.check + "</span>" +
          "<h1>Svar låst</h1>" +
          '<p class="lead">' + answered + " af " + total + " har svaret. Svarene vises, når alle er færdige.</p>" +
          (room.host === net.uid
            ? '<button class="ghost" onclick="flt.reveal()">Vis resultatet nu</button>'
            : '<p class="hint">Venter på de andre…</p>') +
        "</div>"
      : '<div class="panel">' +
          '<div class="timer" id="tm"><i id="tb"></i><b id="ts">' + Math.ceil(seconds) + "</b><span>sekunder</span></div>" +
          '<input id="a" class="answer-input" autocomplete="off" placeholder="Dit svar" aria-label="Dit svar" ' +
          'value="' + esc(net.draft || "") + '" oninput="flt.draft(this.value)" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();flt.answer()}">' +
          '<div class="row"><button class="primary" onclick="flt.answer()">Lås svar</button>' +
          '<span class="hint">Svar som flokken, ikke som dig.</span></div>' +
        "</div>";

    app.innerHTML = topbar(pill("Runde " + room.round + " af " + room.rounds, "quiet")) +
      '<section class="stage">' +
        '<div class="col">' + head + '<h1 class="prompt">' + esc(prompt) + "</h1>" + main + "</div>" +
        '<aside class="col col--side">' +
          '<div class="panel panel--quiet"><div class="panel-head"><h2>Hvem har svaret</h2>' +
          '<span class="panel-note">' + answered + " af " + total + "</span></div>" +
          '<div class="seats">' + peopleRows(room, function (p) { return (room.answers || {})[p.uid] ? "done" : ""; }) + "</div></div>" +
          '<div class="panel"><div class="panel-head"><h2>Stilling</h2></div>' + board() + "</div>" +
        "</aside>" +
      "</section>";

    if (!mine) {
      const input = document.getElementById("a");
      if (input) input.focus();
      startTimer(seconds, room.roundStart);
    } else {
      clearTimer();
    }
    if (room.host === net.uid && total >= 2 && answered >= total) {
      const key = room.round + "-" + room.qi;
      if (net.autoKey !== key) { net.autoKey = key; flt.reveal(); }
    }
  }

  function gambleCard(room) {
    const res = room.lastResult || {};
    const winners = res.winners || [];
    const gamble = room.gamble || { picks: {} };
    const picks = gamble.picks || {};
    const mine = winners.indexOf(net.uid) >= 0;
    const points = (res.points || {})[net.uid] || 0;
    const total = (room.scores || {})[net.uid] || 0;
    const names = winners.map(function (uid) { return nameOf(room, uid); }).join(", ");

    if (gamble.result) {
      return '<div class="panel"><div class="panel-head"><h2>Kassen er åbnet</h2></div>' +
        '<p class="lead">' + esc(gamble.result) + "</p></div>";
    }

    let body = '<p class="lead">Vinderne (<span class="accent">' + esc(names) + "</span>) kan satse deres point.</p>";
    if (mine && !picks[net.uid]) {
      body += '<div class="stakes">' +
        '<div class="stake"><small>I alt</small><b>' + total + "</b></div>" +
        '<div class="stake"><small>Fra runden</small><b>' + points + "</b></div>" +
        '<div class="stake"><small>Gamblere</small><b>' + winners.filter(function (uid) { return picks[uid] && picks[uid] !== "keep"; }).length + " af " + winners.length + "</b></div>" +
        "</div>" +
        '<div class="row">' +
        (points < total ? '<button onclick="flt.gamblePick(\'round\')">Rundens ' + points + "</button>" : "") +
        '<button onclick="flt.gamblePick(\'all\')">Alle ' + total + "</button>" +
        '<button class="ghost" onclick="flt.gamblePick(\'keep\')">Behold point</button></div>';
    } else if (mine) {
      body += '<p class="hint">Dit valg er gemt.</p>';
    }
    if (room.host === net.uid) {
      const decided = winners.filter(function (uid) { return picks[uid] && picks[uid] !== "keep"; });
      body += '<div class="row"><button class="primary primary--gold" onclick="flt.gambleRoll()"' +
        (decided.length ? "" : " disabled") + '>Træk vinderen</button>' +
        '<span class="hint">Alle valg skal ind, før kassen kan åbnes.</span></div>';
    }
    return '<div class="panel">' + body + "</div>";
  }

  function drawReveal(room) {
    const res = room.lastResult || {};
    const speed = !!res.sp;
    const cards = speed
      ? (room.spRes || []).map(questionCard).join("")
      : (res.q !== undefined ? '<h1 class="prompt">' + esc(res.q) + "</h1>" + questionCard({ q: "", list: res.list || [] }) : "");
    let controls = "";
    if (!speed) {
      if (room.gamble) controls = gambleCard(room);
      else if ((res.winners || []).length) {
        const names = (res.winners || []).map(function (uid) { return nameOf(room, uid); }).join(", ");
        controls = '<div class="panel"><p class="lead">Rundens vindere: <span class="accent">' + esc(names) + "</span></p>" +
          (room.host === net.uid
            ? '<div class="row"><button class="primary primary--gold" onclick="flt.gambleStart()">Gamble point</button></div>'
            : '<p class="hint">Værten åbner kassen.</p>') +
          "</div>";
      }
    }
    const last = room.round >= room.rounds;
    const next = room.host === net.uid
      ? '<button class="primary" onclick="flt.next()">' + (last ? "Se vinderen" : "Næste runde") + "</button>"
      : '<p class="hint">Venter på værten…</p>';
    app.innerHTML = topbar(pill("Runde " + room.round + " af " + room.rounds, "quiet")) +
      '<section class="stage">' +
        '<div class="col">' +
          '<p class="roundline">' + (speed ? "Speedrunde færdig" : "Resultat") + "</p>" +
          cards + '<div class="actions">' + next + "</div>" +
        "</div>" +
        '<aside class="col col--side">' +
          '<div class="panel"><div class="panel-head"><h2>Stilling</h2></div>' + board() + "</div>" +
          controls +
        "</aside>" +
      "</section>";
  }

  function drawEnd(room) {
    const names = S.players.slice().sort(function (a, b) { return (S.scores[b] || 0) - (S.scores[a] || 0); });
    const best = names.length ? S.scores[names[0]] || 0 : 0;
    const winners = names.filter(function (n) { return (S.scores[n] || 0) === best; });
    app.innerHTML = topbar(pill("Slut", "quiet")) +
      '<section class="stage">' +
        '<div class="col">' +
          '<div class="panel winner">' +
            '<span class="winner-icon">' + IC.trophy + "</span>" +
            '<p class="roundline">' + room.rounds + (room.rounds === 1 ? " runde" : " runder") + " senere</p>" +
            '<h1 class="winner-name">' + winners.map(esc).join(" & ") + "</h1>" +
            '<p class="lead">' + (winners.length > 1 ? "deler sejren. I tænker lige ens." : "tænkte mest som flokken og vandt med " + best + " point.") + "</p>" +
            '<div class="row">' +
              (room.host === net.uid
                ? '<button class="primary" onclick="flt.again()">Spil igen</button>'
                : '<button class="ghost" onclick="flt.again()" disabled>Værten starter forfra</button>') +
            "</div>" +
          "</div>" +
          '<button class="link" onclick="flt.leave()">Forlad kampen</button>' +
        "</div>" +
        '<aside class="col col--side"><div class="panel"><div class="panel-head"><h2>Slutstilling</h2></div>' + board() + "</div></aside>" +
      "</section>";
    confetti();
  }

  function draw() {
    if (!net.code) { drawStart(); return; }
    if (!net.room) {
      app.innerHTML = topbar("") + '<section class="stage stage--narrow"><div class="col"><div class="panel"><p class="hint">Forbinder til kampen…</p></div></div></section>';
      return;
    }
    const room = net.room;
    syncState(room);
    if (room.phase === "lobby") return drawLobby(room);
    if (room.phase === "ask") return drawAsk(room);
    if (room.phase === "reveal") return drawReveal(room);
    return drawEnd(room);
  }

  // -------------------------------------------------------------------- actions
  async function onlineSetup() {
    net.err = "";
    net.code = null;
    net.room = null;
    if (net.unsub) { net.unsub(); net.unsub = null; }
    clearTimer();
    if (!net.fb) drawStart();
    try {
      await init();
    } catch (e) {
      net.loading = false;
      net.err = "Firebase kunne ikke indlæses: " + errText(e);
    }
    drawStart();
    // Arrived from a chat invite: walk straight into that room.
    if (net.pendingCode && net.uid && !net.code) {
      const code = net.pendingCode;
      net.pendingCode = "";
      joinTo(code);
    }
  }

  async function create() {
    net.err = "";
    try {
      await init();
      if (!net.uid) { drawStart(); return; }
      const name = accountName();
      if (!name) { net.err = "Din konto har intet brugernavn."; drawStart(); return; }
      const dbMod = net.fb.dbMod;
      let code = code4();
      let ref = dbMod.doc(net.db, COL, code);
      let snap = await dbMod.getDoc(ref);
      let guard = 0;
      while (snap.exists() && guard++ < 6) {
        code = code4();
        ref = dbMod.doc(net.db, COL, code);
        snap = await dbMod.getDoc(ref);
      }
      const now = Date.now();
      const players = {};
      players[net.uid] = { name: name, at: now };
      await dbMod.setDoc(ref, {
        code: code,
        host: net.uid,
        createdAt: now,
        updatedAt: now,
        phase: "lobby",
        round: 0,
        rounds: 5,
        speed: 0,
        plan: [],
        qi: 0,
        prompts: [],
        answers: {},
        spRes: [],
        scores: {},
        lastResult: null,
        gamble: null,
        roundStart: 0,
        players: players
      });
      enter(code);
    } catch (e) {
      net.err = "Kunne ikke oprette kampen: " + errText(e);
      drawStart();
    }
  }

  function join() {
    const field = document.getElementById("joincode");
    return joinTo(field ? field.value : "");
  }

  // An invite link already carries the code, so joinTo runs on load: pressing
  // Join in Damp lands you in the room without typing or pressing anything.
  async function joinTo(wanted) {
    const code = String(wanted || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    if (code.length < 4) { net.err = "Koden er fire tegn."; drawStart(); return; }
    net.err = "";
    try {
      await init();
      if (!net.uid) { net.pendingCode = code; drawStart(); return; }
      const name = accountName();
      if (!name) { net.err = "Din konto har intet brugernavn."; drawStart(); return; }
      const dbMod = net.fb.dbMod;
      const ref = dbMod.doc(net.db, COL, code);
      const snap = await dbMod.getDoc(ref);
      if (!snap.exists()) { net.err = "Der findes ingen kamp med koden " + code + "."; drawStart(); return; }
      const room = snap.data();
      if (!(room.players || {})[net.uid]) {
        if (roster(room).length >= MAX) { net.err = "Kampen er fuld. Der er plads til otte."; drawStart(); return; }
        const patchDoc = {};
        patchDoc["players." + net.uid] = { name: freeName(room, name), at: Date.now() };
        await dbMod.updateDoc(ref, patchDoc);
      }
      enter(code);
    } catch (e) {
      net.err = "Kunne ikke deltage: " + errText(e);
      drawStart();
    }
  }

  function enter(code) {
    net.code = code;
    if (net.unsub) net.unsub();
    const dbMod = net.fb.dbMod;
    net.unsub = dbMod.onSnapshot(dbMod.doc(net.db, COL, code), function (snap) {
      if (!snap.exists()) {
        if (net.unsub) { net.unsub(); net.unsub = null; }
        net.code = null; net.room = null;
        net.err = "Kampen findes ikke længere.";
        drawStart();
        return;
      }
      net.room = snap.data();
      if (!net.frozen) draw();
    }, function (e) {
      net.err = "Kunne ikke læse kampen: " + errText(e);
      draw();
    });
    try { history.replaceState(null, "", location.pathname + "?room=" + code); } catch (e) { /* fine */ }
    draw();
  }

  async function start() {
    const room = net.room;
    if (!room || room.host !== net.uid) return;
    const nr = Math.max(1, Math.min(15, +document.getElementById("rn").value || 5));
    const ns = Math.max(0, Math.min(10, +document.getElementById("sr").value || 0));
    const total = nr + ns;
    const plan = [];
    for (let i = 0; i < total; i++) plan.push("n");
    for (let i = 0; i < ns; i++) plan[Math.min(total - 1, Math.floor(((i + 1) * total) / (ns + 1)))] = "s";
    const scores = {};
    roster(room).forEach(function (p) { scores[p.uid] = 0; });
    try {
      await patch({
        phase: "ask", rounds: total, speed: ns, plan: plan, round: 1, qi: 0,
        prompts: [pick()], roundStart: Date.now(), answers: {}, spRes: [],
        scores: scores, gamble: null, lastResult: null, updatedAt: Date.now()
      });
    } catch (e) { net.err = "Kunne ikke starte: " + errText(e); draw(); }
  }

  // The answer is kept in net.draft while it is on its way, so a redraw (another
  // player answering, or a save that fails) never throws away what was typed.
  function keepDraft(text) {
    net.draft = String(text || "").slice(0, 60);
    return net.draft;
  }

  async function answer(value) {
    const room = net.room;
    if (!room || room.phase !== "ask" || net.sending) return;
    if ((room.answers || {})[net.uid]) return;
    const field = document.getElementById("a");
    const typed = value !== undefined ? value : (field ? field.value : net.draft);
    const text = tidy(keepDraft(typed)).slice(0, 60);
    if (!text) {
      if (field) {
        field.classList.remove("shake");
        void field.offsetWidth;
        field.classList.add("shake");
        field.focus();
      }
      return;
    }
    net.sending = true;
    clearTimer();
    try {
      const patchDoc = {};
      patchDoc["answers." + net.uid] = { name: nameOf(room, net.uid), text: text, k: norm(text), at: Date.now() };
      await patch(patchDoc);
      net.draft = "";
    } catch (e) {
      net.err = "Svaret blev ikke gemt: " + errText(e);
      draw();
    }
    net.sending = false;
  }

  async function reveal() {
    const room = net.room;
    if (!room || room.host !== net.uid || room.phase !== "ask") return;
    if (!Object.keys(room.answers || {}).length) return;
    const speed = (room.plan || [])[room.round - 1] === "s";
    const list = groupAnswers(Object.keys(room.answers || {}).map(function (uid) {
      const a = room.answers[uid];
      return { key: a.k || norm(a.text || ""), text: a.text, u: uid, m: nameOf(room, uid) };
    })).map(function (g) {
      return {
        t: g.t,
        m: g.list.map(function (e) { return e.m; }),
        u: g.list.map(function (e) { return e.u; }),
        v: g.v
      };
    });
    const top = list.length ? list[0].m.length : 0;
    const scores = Object.assign({}, room.scores || {});
    const points = {};
    list.forEach(function (g) {
      const plus = g.m.length - 1;
      g.u.forEach(function (uid) {
        scores[uid] = (scores[uid] || 0) + plus;
        points[uid] = plus;
      });
    });
    const winners = top > 1
      ? list.filter(function (g) { return g.m.length === top; })
          .reduce(function (all, g) { return all.concat(g.u); }, [])
          .filter(function (uid) { return (scores[uid] || 0) > 0; })
      : [];
    const entry = {
      q: (room.prompts || [])[room.qi] || "",
      list: list.map(function (g) { return { t: g.t, m: g.m, v: g.v }; }),
      points: points,
      winners: winners,
      sp: speed
    };
    const spRes = (room.spRes || []).concat(speed ? [entry] : []);
    try {
      if (speed && room.qi < 2) {
        await patch({
          scores: scores, answers: {}, spRes: spRes, qi: room.qi + 1,
          prompts: (room.prompts || []).concat([pick()]), roundStart: Date.now(), updatedAt: Date.now()
        });
      } else {
        await patch({
          scores: scores, answers: {}, spRes: spRes, phase: "reveal",
          lastResult: entry, gamble: null, roundStart: Date.now(), updatedAt: Date.now()
        });
      }
    } catch (e) { net.err = "Kunne ikke vise resultatet: " + errText(e); draw(); }
  }

  async function gambleStart() {
    const room = net.room;
    if (!room || room.host !== net.uid) return;
    try { await patch({ gamble: { picks: {}, result: null }, updatedAt: Date.now() }); }
    catch (e) { net.err = "Kunne ikke åbne kassen: " + errText(e); draw(); }
  }

  async function gamblePick(choice) {
    const room = net.room;
    if (!room || !room.gamble || room.gamble.result) return;
    const patchDoc = {};
    patchDoc["gamble.picks." + net.uid] = choice;
    try { await patch(patchDoc); } catch (e) { net.err = "Valget blev ikke gemt: " + errText(e); draw(); }
  }

  async function gambleRoll() {
    const room = net.room;
    if (!room || room.host !== net.uid || !room.gamble || room.gamble.result) return;
    const res = room.lastResult || {};
    const picks = room.gamble.picks || {};
    const winners = res.winners || [];
    const stake = {};
    winners.forEach(function (uid) {
      if (picks[uid] === "round") stake[uid] = (res.points || {})[uid] || 0;
      else if (picks[uid] === "all") stake[uid] = (room.scores || {})[uid] || 0;
    });
    const gamblers = Object.keys(stake).filter(function (uid) { return stake[uid] > 0; });
    const scores = Object.assign({}, room.scores || {});

    if (!gamblers.length) {
      try { await patch({ gamble: { picks: picks, result: "Ingen valgte at gamble denne gang." }, updatedAt: Date.now() }); }
      catch (e) { net.err = errText(e); draw(); }
      return;
    }

    net.frozen = true;
    clearTimer();
    const finish = async function (text) {
      net.frozen = false;
      try {
        await patch({ scores: scores, gamble: { picks: picks, result: text }, updatedAt: Date.now() });
      } catch (e) { net.err = "Kunne ikke gemme trækningen: " + errText(e); draw(); }
    };

    if (gamblers.length === 1) {
      const uid = gamblers[0];
      const amount = stake[uid];
      const win = Math.random() < 0.5;
      spin([
        { t: nameOf(room, uid) + " dobler", p: 0.5, c: "#8b7bff" },
        { t: "Ingenting", p: 0.5, c: "#5b5a80" }
      ], win ? 0 : 1, function () {
        if (win) { scores[uid] = (scores[uid] || 0) + amount; finish(nameOf(room, uid) + " fordoblede sin indsats til " + (amount * 2) + " point."); }
        else { scores[uid] = (scores[uid] || 0) - amount; finish(nameOf(room, uid) + " tabte sin indsats."); }
      });
      return;
    }

    const pool = gamblers.reduce(function (sum, uid) { return sum + stake[uid]; }, 0);
    let ticket = Math.random() * pool;
    let winner = gamblers[0];
    for (let i = 0; i < gamblers.length; i++) {
      if (ticket <= stake[gamblers[i]]) { winner = gamblers[i]; break; }
      ticket -= stake[gamblers[i]];
    }
    spin(gamblers.map(function (uid) { return { t: nameOf(room, uid), p: stake[uid] / pool }; }), gamblers.indexOf(winner), function () {
      gamblers.forEach(function (uid) { scores[uid] = (scores[uid] || 0) - stake[uid]; });
      scores[winner] = (scores[winner] || 0) + pool;
      finish(nameOf(room, winner) + " vandt puljen på " + pool + " point.");
    });
  }

  async function next() {
    const room = net.room;
    if (!room || room.host !== net.uid) return;
    try {
      if (room.round >= room.rounds) {
        await patch({ phase: "end", updatedAt: Date.now() });
      } else {
        await patch({
          phase: "ask", round: room.round + 1, qi: 0, prompts: [pick()],
          answers: {}, spRes: [], gamble: null, lastResult: null,
          roundStart: Date.now(), updatedAt: Date.now()
        });
      }
    } catch (e) { net.err = "Kunne ikke gå videre: " + errText(e); draw(); }
  }

  async function again() {
    const room = net.room;
    if (!room || room.host !== net.uid) return;
    const scores = {};
    roster(room).forEach(function (p) { scores[p.uid] = 0; });
    try {
      await patch({
        phase: "lobby", round: 0, qi: 0, answers: {}, spRes: [], scores: scores,
        gamble: null, lastResult: null, roundStart: 0, updatedAt: Date.now()
      });
    } catch (e) { net.err = "Kunne ikke starte forfra: " + errText(e); draw(); }
  }

  async function leave() {
    const room = net.room;
    const code = net.code;
    try {
      if (room && net.fb) {
        const dbMod = net.fb.dbMod;
        const people = roster(room).filter(function (p) { return p.uid !== net.uid; });
        const patchDoc = {};
        patchDoc["players." + net.uid] = dbMod.deleteField();
        if (room.host === net.uid && people.length) patchDoc.host = people[0].uid;
        await dbMod.updateDoc(dbMod.doc(net.db, COL, code), patchDoc);
      }
    } catch (e) { /* leaving is best effort */ }
    if (net.unsub) { net.unsub(); net.unsub = null; }
    net.code = null;
    net.room = null;
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* fine */ }
    onlineSetup();
  }

  function copy() {
    const link = location.origin + "/games/flertal/?room=" + net.code;
    const note = document.getElementById("copynote");
    const done = function (text) { if (note) note.textContent = text; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { done("Linket er kopieret."); }, function () { done(link); });
    } else {
      done(link);
    }
  }

  function inviteFriend() {
    const code = net.code;
    if (!code) return;
    const note = document.getElementById("copynote");
    if (!window.DampInvite) {
      if (note) note.textContent = "Invitationer kan ikke sendes lige nu — kopiér linket i stedet.";
      return;
    }
    window.DampInvite.open({
      game: "Flertal", code: code,
      link: location.origin + "/games/flertal/?room=" + code,
      accent: "#ffd23f", accentText: "#120a2e",
      font: "'VT323', ui-monospace, monospace",
      ink: "#ffffff", surface: "#100c34", soft: "rgba(255,255,255,.09)", radius: "16px",
      labels: {
        title: "Inviter en ven",
        pick: "Vælg en ven — de får en besked med en knap, der melder dem ind.",
        online: "Online", invited: "Inviteret", sending: "Sender…",
        sent: "Invitation sendt til ",
        nobody: "Fandt ingen andre Damp-spillere. Del koden i stedet.",
        signIn: "Log ind på Damp først, og kom så tilbage.",
        openDamp: "Åbn Damp",
        copy: "Kopiér link", copied: "Linket er kopieret",
        codeHint: "Rumkode", close: "Luk",
        failed: "Kunne ikke sende invitationen", loading: "Leder efter spillere…",
        of: " inviterer dig til et spil. "
      }
    });
  }

  async function recheck() {
    if (!net.fb) { onlineSetup(); return; }
    const authMod = net.fb.authMod;
    const user = authMod.getAuth(net.app).currentUser;
    net.uid = user ? user.uid : null;
    net.err = net.uid ? "" : "Du er ikke logget ind endnu.";
    drawStart();
    if (net.uid && net.pendingCode && !net.code) {
      const code = net.pendingCode;
      net.pendingCode = "";
      joinTo(code);
    }
  }

  window.flt = {
    setup: onlineSetup, create: create, join: join, start: start, answer: answer, draft: keepDraft, reveal: reveal,
    gambleStart: gambleStart, gamblePick: gamblePick, gambleRoll: gambleRoll, next: next,
    again: again, leave: leave, copy: copy, inviteFriend: inviteFriend, recheck: recheck
  };

  // The page opens on one phone, exactly as before.
  const params = new URLSearchParams(location.search);
  const invite = (params.get("room") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (invite) {
    net.pendingCode = invite;
    onlineSetup();
  } else {
    window.setup();
  }
})();
</script>
</body>
</html>
