#app>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}

.grp.top .pts{display:inline-block;animation:beat .9s ease-in-out 1.2s 3}

.cf{position:fixed;top:-14px;width:8px;height:12px;z-index:9;pointer-events:none;animation:fall linear forwards}

.tg{font-size:.72rem;background:var(--acc2);border-radius:20px;padding:2px 9px;margin-left:6px;white-space:nowrap}
.row2{margin:10px 0}
.rl{display:flex;justify-content:space-between;margin-bottom:4px}

h1{color:#fff;text-shadow:-3px -1px 0 #ff3c78,3px 1px 0 #1fd0ff}
h2{font-size:1.05rem}
.mut{color:#2d5a8c}.card .mut{color:#9fc7ea}
.card{color:#fff;border-radius:0;border:3px solid var(--bd);box-shadow:5px 5px 0 rgba(0,0,0,.35);backdrop-filter:none}

.who{color:#9fc7ea}
.tg{border-radius:0;background:#143a78;color:#9fe6ff;font-family:Silkscreen,monospace;font-size:.6rem}
