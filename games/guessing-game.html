<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higher or Lower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1012;--sf:#17181b;--sf2:#1e2024;--ln:#2b2d32;--tx:#f1efe9;--mu:#8e9197;--up:#43b883;--dn:#e2594b;--am:#f2c14e;--disp:"Barlow Condensed","Bahnschrift","Arial Narrow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.4 "Barlow","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:22px;padding:6px 0 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
.mark{display:flex;flex-direction:column;gap:2px}.mark svg{width:20px;height:14px;display:block}
h1{font:700 34px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.sc{display:flex;gap:26px}
.sc div{display:flex;flex-direction:column;line-height:1}
.sc small{font-size:13px;color:var(--mu);margin-bottom:4px}
.sc b{font:700 34px/1 var(--disp);font-variant-numeric:tabular-nums}
.sc b.pop{animation:pop .4s}
.sel{position:relative;display:flex;flex-direction:column;border:1px solid var(--ln);border-radius:8px;background:var(--sf);padding:6px 34px 6px 12px;min-width:170px}
.sel small{font-size:12px;color:var(--mu)}
.sel select{appearance:none;-webkit-appearance:none;background:none;border:0;font-weight:600;cursor:pointer;width:100%}
.sel select option{background:var(--sf)}
.sel:after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border:solid var(--mu);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
@media(hover:hover){.btn:hover{background:var(--sf2);border-color:#44474d}}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn svg{width:20px;height:20px}
.timer{height:4px;background:var(--sf);border-radius:2px;overflow:hidden;display:none}.timer.on{display:block}
.timer i{display:block;height:100%;width:100%;background:var(--am);transition:width .1s linear}
.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{display:flex;flex-direction:column;min-height:clamp(400px,60vh,640px);background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden;transition:box-shadow .25s}
.card.good{box-shadow:0 0 0 2px var(--up)}.card.bad{box-shadow:0 0 0 2px var(--dn);animation:shake .4s}
.card.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.pic{position:relative;flex:1;min-height:150px;background:var(--sf2);overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.pic.ok img{opacity:1}
.pic:not(.ok):after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff0d 50%,transparent 70%);background-size:200% 100%;animation:sk 1.3s infinite}
.logo .pic{background:#eceae4}.logo .pic img{object-fit:contain;padding:12%}
.logo .pic.fb{background:var(--sf2)}.logo .pic.fb img{object-fit:cover;padding:0}
.info{padding:18px 22px 20px}
.info h2{font:700 40px/1.05 var(--disp);letter-spacing:.005em}
.cat{color:var(--mu);font-size:14px;margin:4px 0 14px}
.lab{font-size:14px;color:var(--mu)}
.val{display:flex;align-items:baseline;gap:10px}
.val b{font:700 68px/1.05 var(--disp);font-variant-numeric:tabular-nums}
.val b.hid{color:var(--am);animation:pulse 1.4s infinite}
.good .val b{color:var(--up)}.bad .val b{color:var(--dn)}
.val span{color:var(--mu);font-size:17px}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--disp);background:var(--bg);border:2px solid var(--ln);z-index:2}
.topic{text-align:center;color:var(--mu);font-size:15px;margin-top:-2px}.topic b{color:var(--am);font-weight:600}
.dock{display:flex;flex-direction:column;gap:12px}
.ask{text-align:center;font-size:22px;line-height:1.3}.ask b{font-weight:600}.ask .s{color:var(--am)}.ask .h{color:var(--up)}.ask .l{color:var(--dn)}.ask .r{color:var(--mu);font-weight:500}
.meta{display:block;font-size:13px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.tagb{position:absolute;top:12px;left:12px;z-index:1;padding:5px 10px;border-radius:6px;background:#0f1012e8;color:var(--mu);font:600 14px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}.tagb.you{color:var(--am)}
.res{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 14px;display:flex;align-items:baseline;gap:10px;transform:translateY(101%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.res b{font:700 28px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}.res small{font-size:15px;font-weight:600}
.good .res{background:var(--up);color:#06170f;transform:none}.bad .res{background:var(--dn);color:#1c0805;transform:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.go{display:flex;align-items:center;justify-content:center;gap:14px;height:92px;border:0;border-radius:12px;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s,opacity .15s}
.go span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;min-width:0}.go b{font:700 36px var(--disp);letter-spacing:.04em;text-transform:uppercase}.go small{font-size:15px;font-weight:600;opacity:.8;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go.picked{outline:3px solid var(--tx);outline-offset:3px}
.go svg{width:32px;height:32px}
.go.hi{background:var(--up);color:#06170f;box-shadow:0 5px 0 #276e4d}
.go.lo{background:var(--dn);color:#1c0805;box-shadow:0 5px 0 #8b2f27}
@media(hover:hover){.go:hover:not(:disabled){filter:brightness(1.08)}}
.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #0006}
.go:disabled{cursor:not-allowed}.go:disabled:not(.picked){opacity:.4}
.foot{display:flex;align-items:center;gap:24px;padding-top:14px;border-top:1px solid var(--ln);color:var(--mu);font-size:14px;flex-wrap:wrap}
.foot details{flex:1;min-width:240px}.foot summary{cursor:pointer;color:var(--tx);font-weight:600;padding:6px 0}.foot .hw{padding-bottom:6px}
kbd{display:inline-block;min-width:28px;text-align:center;padding:2px 7px;border:1px solid #44474d;border-bottom-width:3px;border-radius:6px;color:var(--tx);font-size:13px}
.overlay{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:18px;background:#0a0a0cea}
.overlay.on{display:grid;animation:fade .25s}
.modal{width:min(440px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:28px;text-align:center;animation:rise .4s cubic-bezier(.2,.9,.3,1.1)}
.modal h3{font:700 22px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--dn)}.modal.win h3{color:var(--am)}
.big{font:700 120px/1 var(--disp);margin:4px 0 0}
.modal p{color:var(--mu)}.modal .msg{color:var(--tx);font-size:19px;font-weight:600;margin:8px 0 4px}
.ans{margin:18px 0;padding:12px 14px;border-radius:8px;background:var(--sf2);font-size:15px;color:var(--mu)}.ans b{color:var(--tx);font-weight:600}
.hs{display:flex;justify-content:center;gap:18px;margin-bottom:20px;color:var(--mu);font-size:14px;flex-wrap:wrap}.hs .me{color:var(--am);font-weight:600}
.mb{display:flex;gap:10px}
.mb button{flex:1;height:52px;border-radius:8px;border:1px solid #44474d;background:var(--sf2);font-weight:600;cursor:pointer;transition:filter .15s}
.mb button:first-child{background:var(--tx);color:#111;border:0}
.mb button:hover{filter:brightness(1.1)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--tx);color:#111;font-weight:600;padding:9px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes sk{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.45}}
@keyframes pop{40%{transform:scale(1.3)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes enter{from{opacity:0;transform:translateX(50px)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@keyframes enterY{from{opacity:0;transform:translateY(40px)}}
@media(max-width:760px){
body{padding:max(10px,env(safe-area-inset-top)) 12px 0}
.app{min-height:calc(100vh - 10px);min-height:calc(100dvh - 10px);gap:10px}
.bar{display:grid;grid-template-columns:1fr 1fr 46px 46px;gap:8px;padding:0 0 10px}
.brand{grid-column:1/3;min-width:0}.sc{grid-column:3/5;gap:14px;justify-self:end;align-items:center}
h1{font-size:25px}.sc b{font-size:28px}.sc small{font-size:12px;margin-bottom:2px}
.sel{min-width:0;padding:5px 28px 5px 10px}.sel:after{right:10px}
.hide-sm{display:none}#rst{padding:0;justify-content:center}
.topic{font-size:14px;margin-top:-4px}
.arena{flex:1;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:300px}
.card{min-height:0;flex-direction:row}.card.enter{animation-name:enterY}
.pic{flex:0 0 38%;min-height:0}
.info{flex:1;min-width:0;padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
.info h2{font-size:26px;overflow-wrap:anywhere}.cat{margin:2px 0 8px;font-size:13px}.lab{font-size:13px}
.val b{font-size:44px}.val span{font-size:15px}
.tagb{top:8px;left:8px;font-size:12px;padding:4px 8px}
.res{padding:8px 10px}.res b{font-size:20px}.res small{display:none}
.vs{width:44px;height:44px;font-size:17px}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--ln);margin:0 -12px;padding:10px 12px max(10px,env(safe-area-inset-bottom));gap:10px}
.ask{font-size:17px}.meta{font-size:12px}
.go{height:72px;gap:10px}.go svg{width:28px;height:28px}.go b{font-size:30px}.go small{font-size:13px;max-width:110px}
.acts{gap:10px}.keyhint{display:none}.big{font-size:96px}.foot{padding-bottom:16px}}
@media(hover:none){.keyhint{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {stat:'founding year',unit:'year',y:1,logo:1,items:[['Coca-Cola',1886],['Nintendo',1889],['Ford',1903,'Ford Motor Company'],['Disney',1923,'The Walt Disney Company'],['LEGO',1932,'Lego'],['Toyota',1937],['Samsung',1938],['IKEA',1943],['Sony',1946],['Nike',1964,'Nike, Inc.'],['Microsoft',1975],['Apple',1976,'Apple Inc.'],['Amazon',1994,'Amazon (company)'],['Netflix',1997],['Spotify',2006]]},
 {stat:'store count',unit:'locations',approx:1,logo:1,items:[['7-Eleven',83000],['McDonald\'s',41000],['Starbucks',38000],['Subway',37000,'Subway (restaurant)'],['KFC',30000],['Domino\'s',20000],['Burger King',19000],['Pizza Hut',18500],['Dunkin\'',13000],['Walmart',10500],['Apple Store',530],['IKEA',460]]},
 {stat:'annual revenue',unit:'US$ billion',approx:1,logo:1,items:[['Walmart',648],['Amazon',575,'Amazon (company)'],['Apple',383,'Apple Inc.'],['Alphabet',307,'Alphabet Inc.'],['Microsoft',212],['Meta',135,'Meta Platforms'],['Tesla',97,'Tesla, Inc.'],['Disney',89,'The Walt Disney Company'],['Nike',51,'Nike, Inc.'],['Coca-Cola',46],['Starbucks',36],['Netflix',34],['McDonald\'s',26]]}]
};
const MIX='Random Mix',CATS=Object.keys(DATA).concat(MIX);
const MODES={classic:'Classic',time:'Time Attack',sudden:'Sudden Death'};
const HOW={classic:'Compare the hidden number with the one on the left. Guess higher or lower. One wrong guess ends the run.',time:'Get as many right as you can in 60 seconds. A wrong guess scores nothing but the clock keeps running.',sudden:'Same rules as Classic, tracked on its own scoreboard. One wrong guess and it is over.'};

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const store={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const THE=['United States','United Kingdom','Philippines'];
function art(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;const r=k=>(h>>k)%100,hue=h%360;
 let ini=(n.match(/\b[A-Za-z0-9]/g)||[]).join('').slice(0,2).toUpperCase();if(ini.length<2)ini=n.slice(0,2).toUpperCase();
 const s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='hsl(${hue},28%,18%)'/><circle cx='${80+r(2)*3}' cy='${r(4)*2}' r='${90+r(6)}' fill='hsl(${hue+30},40%,30%)' opacity='.5'/><text x='200' y='175' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='110' fill='white' opacity='.85'>${ini}</text></svg>`;
 return 'data:image/svg+xml,'+encodeURIComponent(s)}
const ITEMS=[],SETS=[];
for(const [cat,sets] of Object.entries(DATA))sets.forEach((d,i)=>{const id=cat+i;SETS.push({id,cat});
 d.items.forEach(([name,stat,w])=>ITEMS.push({name,category:cat,set:id,label:d.stat,unit:d.unit,approx:!!d.approx,y:!!d.y,c:!!d.c,logo:!!d.logo||!!d.flag,stat,
  wiki:d.flag?'Flag of '+(THE.includes(name)?'the ':'')+name:(w||name),image:art(name)}))});
const compact=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1});
const fmtV=(v,it)=>it.y?String(Math.round(v)):it.c?compact.format(v):v.toLocaleString('en',{maximumFractionDigits:it.stat<10&&it.stat%1?1:0});

/* ===== pictures: fetched from Wikipedia at runtime, cached, generated art as fallback ===== */
const IMG=store.get('hol_img',{}),pend={};
function wikiImg(it){const k=it.wiki;
 if(IMG[k]!==undefined)return Promise.resolve(IMG[k]==='-'?'':IMG[k]);
 return pend[k]||(pend[k]=fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(k.replace(/ /g,'_')))
  .then(r=>r.ok?r.json():{}).then(j=>{const u=j&&j.thumbnail?j.thumbnail.source.replace(/\/\d+px-/,'/960px-'):'';IMG[k]=u||'-';store.set('hol_img',IMG);return u})
  .catch(()=>{delete pend[k];return ''}))}

/* ===== state ===== */
const S={mode:store.get('hol_mode','classic'),cat:store.get('hol_cat','Technology'),sound:store.get('hol_sound',true),score:0,round:1,since:0,set:null,L:null,R:null,lock:true,over:false,time:60,tid:null,recent:[]};
if(!MODES[S.mode])S.mode='classic';if(!CATS.includes(S.cat))S.cat='Technology';
const catSets=()=>SETS.filter(s=>S.cat===MIX||s.cat===S.cat).map(s=>s.id);
const bests=()=>store.get('hol_best',{});

/* ===== sound ===== */
let ac;
function tone(f,d,type='sine',v=.07,w=0){if(!S.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+w;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch{}}
const sfx={click:()=>tone(440,.08,'triangle'),win:()=>{tone(523,.12);tone(784,.2,'sine',.07,.1)},lose:()=>{tone(220,.25,'sawtooth',.05);tone(140,.4,'sawtooth',.05,.18)},tick:()=>tone(900,.04,'square',.02)};
function setSound(){$('#snd').innerHTML=S.sound?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.500 8.500a5 5 0 0 1 0 7M19 6a8.500 8.500 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>';$('#snd').setAttribute('aria-pressed',S.sound)}

/* ===== rendering ===== */
function fill(el,it,hidden,enter){
 el.className='card'+(it.logo?' logo':'')+(enter?' enter':'');el._it=it;
 el.innerHTML=`<div class="pic"><img alt=""><span class="tagb${hidden?' you':''}">${hidden?'Your guess':'Known value'}</span><div class="res"><b></b><small></small></div></div><div class="info"><h2>${it.name}</h2><p class="cat">${it.category}</p><div class="lab">${cap(it.label)}${it.approx?' (approx.)':''}</div><div class="val"><b class="${hidden?'hid':''}">${hidden?'?':fmtV(it.stat,it)}</b><span>${it.unit}</span></div></div>`;
 const img=el.querySelector('img'),box=el.querySelector('.pic');
 const fallback=()=>{img.onerror=null;box.classList.add('fb');img.src=it.image};
 img.onload=()=>box.classList.add('ok');img.onerror=fallback;
 wikiImg(it).then(u=>{if(el._it!==it)return;u?img.src=u:fallback()})}
function render(enter){fill($('#cL'),S.L,false,false);fill($('#cR'),S.R,true,enter)}
const poss=n=>n.endsWith('s')?n+"'":n+"'s";
function meta(){$('#meta').textContent=S.mode==='time'?Math.ceil(S.time)+'s left':'Round '+S.round;$('#tbar').style.width=S.time/60*100+'%'}
function hud(){$('#score').textContent=S.score;$('#best').textContent=bests()[S.mode]||0;
 const L=S.L,R=S.R,v=fmtV(L.stat,L)+(L.y?'':' '+L.unit);
 $('#topic').innerHTML=`Comparing <b>${L.label}</b> · ${L.y?'in years':'in '+L.unit}${L.approx?' · approx.':''}`;
 $('#ask').innerHTML=`<span class="meta" id="meta"></span>Is <b>${poss(R.name)}</b> <b class="s">${L.label}</b> <b class="h">higher</b> or <b class="l">lower</b> than <b>${poss(L.name)}</b> <span class="r">(${v})</span>?`;
 $('#hiS').textContent=$('#loS').textContent='than '+fmtV(L.stat,L);
 $('#timer').classList.toggle('on',S.mode==='time');meta()}
function setBtns(){$('#hi').disabled=$('#lo').disabled=S.lock||S.over;if(!S.lock&&!S.over)document.querySelectorAll('.go').forEach(b=>b.classList.remove('picked'))}

/* ===== game logic ===== */
function pickNext(from){
 const c=ITEMS.filter(i=>i.set===from.set&&i.name!==from.name&&i.stat!==from.stat);   // identical stats are never compared
 const fresh=c.filter(i=>!S.recent.includes(i.name));return rnd(fresh.length?fresh:c)}
function remember(n){S.recent=S.recent.concat(n).slice(-6)}
function newPair(hop){
 let ids=catSets();if(hop&&ids.length>1)ids=ids.filter(i=>i!==S.set);
 S.set=rnd(ids);S.L=rnd(ITEMS.filter(i=>i.set===S.set));S.R=pickNext(S.L);S.since=0;remember(S.L.name);remember(S.R.name)}
function advance(){
 S.round++;S.since++;
 if(S.since>=6&&catSets().length>1){newPair(true);toast('New topic: '+S.L.label)}
 else{S.L=S.R;S.R=pickNext(S.L);remember(S.R.name)}
 render(true);S.lock=false;setBtns();hud()}
function newGame(){
 clearInterval(S.tid);$('#over').classList.remove('on');Object.assign(S,{score:0,round:1,over:false,time:60,recent:[]});
 $('#how').textContent=HOW[S.mode];newPair(false);render(false);S.lock=false;setBtns();hud();
 if(S.mode==='time')S.tid=setInterval(()=>{S.time=Math.max(0,S.time-.1);if(S.time<=10&&S.time%1<.1)sfx.tick();meta();if(S.time<=0)end(null,true)},100)}
function countUp(el,it){const t0=performance.now();el.classList.remove('hid');
 const f=t=>{const p=Math.min(1,(t-t0)/750),e=1-Math.pow(1-p,3);el.textContent=fmtV(p<1?it.stat*e:it.stat,it);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function guess(dir){
 if(S.lock||S.over)return;S.lock=true;setBtns();sfx.click();
 const ok=dir==='higher'?S.R.stat>S.L.stat:S.R.stat<S.L.stat,cR=$('#cR');
 countUp(cR.querySelector('.val b'),S.R);cR.classList.add(ok?'good':'bad');$(dir==='higher'?'#hi':'#lo').classList.add('picked');
 const tr=S.R.stat>S.L.stat?'higher':'lower';cR.querySelector('.res b').textContent=ok?'✓ '+cap(tr):'✗ Actually '+tr;cR.querySelector('.res small').textContent='than '+S.L.name;
 setTimeout(()=>{
  if(S.over)return;
  if(ok){S.score++;sfx.win();const b=$('#score');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');advance()}
  else{sfx.lose();if(S.mode==='time')advance();else end(S.R,false)}
 },S.mode==='time'?750:1300)}
function msg(n,t){if(t)return n>=15?'Lightning fast.':n>=8?'Strong run. Quick and sharp.':'Time is up. Go again, faster.';
 return n>=20?'Legendary. You know your numbers.':n>=12?'Impressive streak.':n>=7?'Solid run.':n>=3?'Decent start. Keep going.':'Tough one. Shake it off and go again.'}
function end(R,timeout){
 if(S.over)return;S.over=true;clearInterval(S.tid);setBtns();
 const b=bests(),prev=b[S.mode]||0,newBest=S.score>prev;if(newBest){b[S.mode]=S.score;store.set('hol_best',b)}
 const hs=store.get('hol_scores',[]);hs.push({s:S.score,m:S.mode});hs.sort((a,c)=>c.s-a.s);
 const top=hs.filter(x=>x.m===S.mode).slice(0,5);store.set('hol_scores',hs.filter(x=>top.includes(x)||x.m!==S.mode).slice(0,40));
 $('#ovT').textContent=timeout?'Time is up':'Game over';$('#modal').classList.toggle('win',timeout);
 $('#ovS').textContent=S.score;$('#ovM').textContent=(newBest&&S.score>0?'New personal best. ':'')+msg(S.score,timeout);$('#ovB').textContent=Math.max(prev,S.score);
 $('#ovA').innerHTML=R?`<b>${S.R.name}</b> is <b>${fmtV(S.R.stat,S.R)} ${S.R.unit}</b>, ${S.R.stat>S.L.stat?'higher':'lower'} than ${S.L.name} (<b>${fmtV(S.L.stat,S.L)}</b>).`:`${MODES[S.mode]} · ${S.cat}`;
 let marked=false;$('#ovH').innerHTML=top.map((x,i)=>{const me=!marked&&x.s===S.score;if(me)marked=true;return `<span class="${me?'me':''}">${i+1}. ${x.s}</span>`}).join('');
 hud();setTimeout(()=>{$('#over').classList.add('on');$('#again').focus()},R?500:0)}
async function share(){
 const text=`I scored ${S.score} in Higher or Lower (${MODES[S.mode]}, ${S.cat}). Can you beat me?`;
 try{if(navigator.share){await navigator.share({title:'Higher or Lower',text});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch{}t.remove()}
 toast('Score copied to clipboard')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}

/* ===== wiring ===== */
$('#cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');$('#cat').value=S.cat;$('#mode').value=S.mode;
$('#cat').onchange=e=>{S.cat=e.target.value;store.set('hol_cat',S.cat);e.target.blur();newGame()};
$('#mode').onchange=e=>{S.mode=e.target.value;store.set('hol_mode',S.mode);e.target.blur();newGame()};
$('#hi').onclick=()=>guess('higher');$('#lo').onclick=()=>guess('lower');
$('#rst').onclick=newGame;$('#again').onclick=newGame;$('#share').onclick=share;
$('#snd').onclick=()=>{S.sound=!S.sound;store.set('hol_sound',S.sound);setSound();sfx.click()};
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey)return;
 if($('#over').classList.contains('on')){if(e.key==='Escape')newGame();return}
 if(e.key==='ArrowRight'){e.preventDefault();guess('higher')}else if(e.key==='ArrowLeft'){e.preventDefault();guess('lower')}});
setSound();if(innerWidth>760)$('#howd').open=true;newGame();
</script>
</body>
</html>
