<style>
:root{--gold:#ffd21f;--navy:#0b2a4f;--blue:#1a7ad4;--ink:#05070d;--fg:#f4f1ea;--dim:#9fb0cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--d:Anton,Impact,"Arial Narrow",sans-serif;--b:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

[data-s=menu] #hud,[data-s=menu] #help,[data-s=menu] #touch{display:none!important}

.pl{flex:1;display:flex;gap:10px;align-items:flex-start;min-width:0}.pl.r{flex-direction:row-reverse;text-align:right}
.pt{width:clamp(44px,8vw,64px);aspect-ratio:1;border:2px solid var(--gold);background:#111;flex:none;box-shadow:0 2px 8px #000a}.pt svg{display:block;width:100%}

.r .hb,.r .sb{transform:skewX(22deg);justify-content:flex-end;margin:0 6px 0 0}
.hb{height:clamp(14px,2.4vw,20px)}.sb{height:9px;margin-top:4px;width:72%}.r .sb{margin-left:auto}

.logo em{font-family:var(--b);font-size:clamp(13px,2vw,18px);letter-spacing:.2em;-webkit-text-stroke:0;background:none;color:#fff;font-weight:700;margin-top:6px;filter:none}

.ac{display:flex;gap:10px}#touch b{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;letter-spacing:.05em;background:#00000066;border:3px solid #ffd21f;width:62px;height:62px}
#touch b[data-k=k]{border-color:#2fe0ff}#touch b[data-k=l]{border-color:#9bd}.dp b{width:auto;height:auto;border:0;background:#0003;border-radius:8px;font-size:16px}#touch b:active{background:#ffd21f88}
@media (max-aspect-ratio:1/1){.ov{align-items:flex-end;background:linear-gradient(0deg,#05070df5 0,#05070dd9 55%,#05070d00 100%);padding-bottom:12px}.menu{gap:8px}.logo{font-size:clamp(34px,11vw,56px)}.fb small{display:none}.panel{display:grid;grid-template-columns:1fr 1fr}.info{display:none}}

.ac{gap:6px}#touch .ac b{width:52px;height:52px;font-size:11px}
.ub{height:6px;margin:3px 0 0 6px;width:60%;overflow:hidden;background:#000b;border:1px solid #fff4;display:flex;transform:skewX(-22deg)}.r .ub{transform:skewX(22deg);justify-content:flex-end;margin:3px 6px 0 auto}.ub i{height:100%;background:linear-gradient(#8ff0ff,#2f8bff)}.ub.full{box-shadow:0 0 12px #4cf;animation:pl .45s infinite alternate}@keyframes pl{to{filter:brightness(1.9)}}
.ac{display:grid!important;grid-template-columns:repeat(3,50px);gap:6px}#touch .ac b{width:50px;height:50px;font-size:10px}.dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
#game::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
.btns{display:flex;gap:12px;flex-wrap:wrap}button.alt{background:linear-gradient(#a6ecff,#2f8bff);border-color:#0b3a6e;color:#06203f;animation:pl .8s infinite alternate}

#hcw{width:min(260px,60%);height:5px;background:#fff2}#hcw i{display:block;height:100%;background:#ffd21f;width:0}

#tt{display:block;font-family:var(--d);font-size:clamp(18px,3vw,26px);color:#ffd21f;letter-spacing:.04em;text-transform:uppercase}#td{display:block;font-size:clamp(15px,2.4vw,19px);line-height:1.35;margin-top:4px}#td b{color:#ffd21f}
.tp{height:6px;background:#fff2;margin:8px 0}.tp i{display:block;height:100%;background:#3be26a;transition:width .4s;width:0}#tskip{background:none;border:0;color:var(--dim);font:inherit;text-decoration:underline;cursor:pointer;font-size:14px;pointer-events:auto}
[data-s=menu] #hint,[data-s=menu] #tut,[data-s=menu] #hurt{display:none!important}@media (pointer:coarse){#hint{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
#ncode{font-family:var(--d);font-size:clamp(44px,9vw,64px);letter-spacing:.2em;color:var(--gold);text-align:center;min-height:1.1em}#nst{color:var(--dim);text-align:center;line-height:1.4;font-size:17px}
.jn{display:flex;gap:10px}#njoin{flex:1;min-width:0;font-family:var(--d);font-size:30px;text-transform:uppercase;text-align:center;letter-spacing:.2em;background:#05121f;color:#fff;border:3px solid #28507a;padding:4px}
</style></head>
<body>

<div id="hud">
 <div class="pl"><div class="pt" id="pt1"></div><div class="bars"><div class="nm" id="n1"></div><div class="hb"><b id="t1"></b><i id="b1"></i></div><div class="sb"><i id="s1"></i></div><div class="ub"><i id="u1"></i></div><div class="pips" id="p1"></div></div></div>

</div>
<div class="ov" id="sel"><div class="menu">
 <div class="logo"><span>KNOCKOUT</span><span>NIGHT</span><em>ACTION ARCADE BOXING</em></div>

 <div class="panel" id="list"></div><div class="info" id="info"></div>
 <div class="btns"><button class="go" id="fight">FIGHT!</button><button class="go alt" id="train">TUTORIAL</button><button class="go alt" id="online">ONLINE</button></div>
</div></div>
<div class="ov hide" id="net"><div class="menu"><h2>Play with a friend</h2><div class="panel"><div id="ncode"></div><div id="nst"></div><div class="btns"><button class="go" id="ncreate">CREATE ROOM</button></div><div class="jn"><input id="njoin" maxlength="4" placeholder="CODE" autocomplete="off"><button class="go alt" id="njbtn">JOIN</button></div></div><button class="go" id="ncancel">BACK</button></div></div>

</div>

<script>
const ROSTER=[
 {name:'Bear',tag:'All-rounder',skin:0xc98a5b,hair:0x3b2a1e,beard:1,trunk:0x2f5f8a,glove:0xe03535,speed:5.4,hp:100,pd:7,kd:15},
 {name:'Diesel',tag:'Heavyweight',skin:0x8d5a3b,hair:0x151515,beard:0,trunk:0x2a8a4a,glove:0xf2f2f2,speed:4,hp:130,pd:9,kd:19},
 {name:'Flash',tag:'Fast hands',skin:0xf0c9a0,hair:0xe3b448,beard:0,trunk:0xe0a020,glove:0x2a6cf0,speed:7,hp:85,pd:5,kd:12},
 {name:'Ghost',tag:'Counter puncher',skin:0xe8b894,hair:0xdadada,beard:1,trunk:0x6a3fb5,glove:0x222222,speed:5.9,hp:92,pd:7,kd:14}];

const $=id=>document.getElementById(id),hex=c=>'#'+c.toString(16).padStart(6,'0'),lerp=(a,b,t)=>a+(b-a)*t;
const face=d=>`<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="#1b2540"/><path d="M5 60Q8 44 30 44Q52 44 55 60Z" fill="${hex(d.skin)}"/><ellipse cx="30" cy="26" rx="12" ry="14" fill="${hex(d.skin)}"/><path d="M17 25Q15 7 30 7Q45 7 43 25Q38 15 30 16Q22 15 17 25Z" fill="${hex(d.hair)}"/>${d.beard?`<path d="M18 28Q20 45 30 45Q40 45 42 28Q40 37 30 37Q20 37 18 28Z" fill="${hex(d.hair)}"/>`:''}<rect x="23" y="25" width="4" height="2.5" fill="#111"/><rect x="33" y="25" width="4" height="2.5" fill="#111"/></svg>`;
let AC;function snd(f,len,vol,type){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(f,n);if(type!='sine')o.frequency.exponentialRampToValueAtTime(40,n+len);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+len);o.start(n);o.stop(n+len)}catch(e){}}

let popT;function popText(t){const e=$('pop');e.textContent=t;e.classList.add('on');clearTimeout(popT);popT=setTimeout(()=>e.classList.remove('on'),350)}
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070d);scene.fog=new THREE.FogExp2(0x05070d,.011);
const camera=new THREE.PerspectiveCamera(42,1,.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
scene.add(new THREE.HemisphereLight(0x8fa6d8,0x20243a,.55));
const spot=new THREE.SpotLight(0xfff2dd,1.6,80,.8,.6);spot.position.set(0,28,3);spot.castShadow=true;spot.shadow.mapSize.set(2048,2048);scene.add(spot);
const rl=new THREE.PointLight(0xff3344,.7,30);rl.position.set(-10,5,-10);const bl=new THREE.PointLight(0x2f7bff,.8,30);bl.position.set(10,5,10);scene.add(rl,bl);
const std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
// ring
const cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d');
x.fillStyle='#e6e1d6';x.fillRect(0,0,512,512);x.fillStyle='#c8202f';x.fillRect(0,0,512,22);x.fillRect(0,490,512,22);x.fillStyle='#2457c5';x.fillRect(0,0,22,512);x.fillRect(490,0,22,512);
x.strokeStyle='#1b2a55';x.lineWidth=8;x.beginPath();x.arc(256,256,150,0,6.283);x.stroke();x.fillStyle='#c8202f';x.font='900 200px Anton,Impact,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('KO',256,262);
const rt=new THREE.CanvasTexture(cv);rt.anisotropy=4;
const ringTop=new THREE.Mesh(new THREE.PlaneGeometry(18.6,18.6),new THREE.MeshStandardMaterial({map:rt,roughness:.9}));ringTop.rotation.x=-Math.PI/2;ringTop.position.y=.01;ringTop.receiveShadow=true;scene.add(ringTop);
const base=new THREE.Mesh(new THREE.BoxGeometry(19,.6,19),std(0x1a2238));base.position.y=-.3;scene.add(base);
const skirt=new THREE.Mesh(new THREE.BoxGeometry(19.2,1.4,19.2),std(0x0e1f45));skirt.position.y=-1.3;scene.add(skirt);
const flo=new THREE.Mesh(new THREE.CircleGeometry(60,32),std(0x0a0d16));flo.rotation.x=-Math.PI/2;flo.position.y=-2;scene.add(flo);
const cPad=[0xd0202f,0xf0f0f0,0xf0f0f0,0x2457c5];
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b],i)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,2.6,10),std(0xcfcfd6,{metalness:.4}));p.position.set(a*9.1,1.3,b*9.1);scene.add(p);
 const pad=new THREE.Mesh(new THREE.BoxGeometry(.7,1.5,.7),std(cPad[i]));pad.position.set(a*8.75,1.55,b*8.75);pad.castShadow=true;scene.add(pad)});
[[.9,0x2457c5],[1.55,0xf0f0f0],[2.2,0xd0202f]].forEach(([y,c])=>[-9.1,9.1].forEach(s=>{
 const r1=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,18.2,6),std(c));r1.rotation.z=Math.PI/2;r1.position.set(0,y,s);scene.add(r1);
 const r2=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,18.2,6),std(c));r2.rotation.x=Math.PI/2;r2.position.set(s,y,0);scene.add(r2)}));
// arena: stands, crowd, light beams
const stands=new THREE.Mesh(new THREE.CylinderGeometry(26.5,14.8,5.4,48,1,true),std(0x0d121f,{side:THREE.DoubleSide}));stands.position.y=1.9;scene.add(stands);
const pts=[];for(let k=0;k<6;k++){const r=16+k*1.7,n=Math.floor(6.283*r/1.45);for(let i=0;i<n;i++){const a=i/n*6.283+k*.3;pts.push([Math.cos(a)*r,-.06+k*.75+.45,Math.sin(a)*r,Math.random()*6.283,2+Math.random()*3])}}
const pal=[0x394867,0x7a2e3b,0x2e5c4a,0x8a7a3a,0x4a3a6a,0x5a5f6a,0x9a4a2a],sk=[0xf1c27d,0xc68642,0x8d5524,0xe0ac69,0x5c3a21];
const cb=new THREE.InstancedMesh(new THREE.CylinderGeometry(.34,.4,.9,5),std(0xffffff,{flatShading:true}),pts.length),ch=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.26,0),std(0xffffff,{flatShading:true}),pts.length);
const cc=new THREE.Color();pts.forEach((p,i)=>{cb.setColorAt(i,cc.setHex(pal[i%7]));ch.setColorAt(i,cc.setHex(sk[(i*7)%5]))});cb.frustumCulled=ch.frustumCulled=false;scene.add(cb,ch);
const dm=new THREE.Object3D();
[[-13,-13],[13,-13],[-13,13],[13,13],[0,-16],[0,16]].forEach(([a,b])=>{const c=new THREE.Mesh(new THREE.ConeGeometry(3.4,32,16,1,true),new THREE.MeshBasicMaterial({color:0xaec6ff,transparent:true,opacity:.045,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));c.position.set(a,16,b);scene.add(c)});
