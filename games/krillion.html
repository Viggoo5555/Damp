/* krillion.io-inspired minimal dive */
.home{justify-content:center}
.home .masthead{margin-top:clamp(24px,6vh,70px)}
.home .wordmark{font-size:clamp(24px,4.2vw,44px);letter-spacing:.4em;color:#16324f;text-transform:uppercase;padding-left:.4em;line-height:1.15}
.home .wordmark span{display:block;font-size:11px;letter-spacing:.5em;color:#3f658a;margin-top:18px;padding-left:.5em}
.home .masthead .desc{font-size:15px;line-height:1.7;letter-spacing:.04em;color:#43688c;margin-top:20px;max-width:36ch;margin-left:auto;margin-right:auto}
.launch-pad{padding-top:clamp(26px,7vh,70px)}
.home .pack-desc{color:#9db6d2;margin-top:22px}
.sponsors{margin-top:46px;padding-top:20px;border-top:1px solid #2a4560;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:8px 18px;font-size:13px;letter-spacing:.18em;color:#6c86a4}
.sponsors span{letter-spacing:.32em;color:#52708f}
.sponsors a{color:#a6c5e3;text-decoration:none;letter-spacing:.14em;border-bottom:1px solid #2f4e6c;padding-bottom:2px;transition:color .15s,border-color .15s}
.sponsors a:hover{color:#fff;border-color:#5de3f9}
.locked-note{text-align:center;color:#7f9bbb;font-size:15px;letter-spacing:.05em;margin:22px 0 4px}
.log-question.static{padding:0}
.log-question .log-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:13px 15px}
.log-question .log-text{min-width:0}
.log-question .log-text small{display:block;margin-top:3px;color:#8fa9c6;font-size:15px;word-break:break-word}
.log-question .log-score small{display:block;margin-top:2px}
@media(max-width:520px){.home .wordmark{letter-spacing:.28em;padding-left:.28em}.sponsors{margin-top:30px}.log-question .log-row{gap:9px;padding:11px 10px}}

.sink-hud{position:fixed;inset:auto 0 auto 0;top:30vh;z-index:6;text-align:center;pointer-events:none;font-family:VT323,Pixel,monospace;transition:opacity .4s,transform .4s;background:radial-gradient(ellipse 60% 42% at 50% 52%,#06101ed9 0%,#06101e80 45%,transparent 72%)}
.sink-hud.out{opacity:0;transform:translateY(-14px)}
.sink-tag{font-size:14px;letter-spacing:.5em;color:#9fc0dd;text-shadow:0 2px 6px #000}
.sink-depth{display:flex;align-items:baseline;justify-content:center;gap:8px;color:#fff;line-height:.9;text-shadow:0 0 28px var(--tier),0 3px 10px #000}
.sink-depth b{font-weight:400;font-size:clamp(54px,9vw,96px);letter-spacing:-.02em}
.sink-depth span{font-size:16px;letter-spacing:.28em;color:var(--tier)}
.sink-tier{margin-top:12px;font-size:18px;letter-spacing:.22em;color:var(--tier);text-shadow:0 2px 8px #000}
@media(max-width:520px){.sink-hud{top:30vh}.sink-tag{font-size:11px;letter-spacing:.34em}.sink-tier{font-size:15px}}
