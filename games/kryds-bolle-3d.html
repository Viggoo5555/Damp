<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kryds &amp; Bolle 3D</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;color:#f4ecdd;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas{display:block}
  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:16px 20px;pointer-events:none}
  #brand{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#c9a24b;font-weight:700}
  #status{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#e8dcc6;
    background:rgba(10,12,14,.45);border:1px solid rgba(233,180,76,.25);
    padding:8px 16px;border-radius:999px;backdrop-filter:blur(6px)}
  #bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;
    gap:10px;padding:0 16px 26px;pointer-events:none}
  #bottom button{pointer-events:auto}
  #hint{font-size:11px;letter-spacing:.1em;color:#a3937c;text-align:center}
  #buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button.act{font:inherit;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:#1a1408;background:#e9b44c;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
  button.act.ghost{background:rgba(12,16,20,.6);color:#e6d9bd;border:1px solid rgba(233,180,76,.35)}
  button.act:active{transform:translateY(1px)}
  #splash{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
    background:radial-gradient(60% 55% at 50% 42%,rgba(20,14,10,.35),rgba(12,9,7,.9));
    text-align:center;padding:24px;transition:opacity .3s}
  #splash.gone{display:none}
  #splash .card{max-width:560px}
  #splash h1{font-size:clamp(38px,8.5vw,80px);line-height:.9;margin:0 0 16px;letter-spacing:-.02em;
    font-weight:800;color:#f7f0df}
  #splash p{margin:0 auto 24px;color:#bda98c;line-height:1.6;max-width:44ch}
  #splash .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #splash .seg{display:flex;border:1px solid rgba(233,180,76,.3);border-radius:10px;overflow:hidden}
  #splash .seg button{font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:#cbb894;border:0;padding:12px 16px;cursor:pointer;font-weight:700}
  #splash .seg button[aria-pressed="true"]{background:#e9b44c;color:#1a1408}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    font-size:clamp(30px,7vw,58px);font-weight:800;letter-spacing:-.02em;color:#f7f0df;
    text-shadow:0 8px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="top">
  <span id="brand">Kryds &amp; Bolle 3D</span>
  <span id="status" data-i18n="tica.turnX">X to move</span>
</div>
<div id="toast"></div>
<div id="bottom">
  <div id="hint" data-i18n="tica.hint">Click a square to place your piece · drag to look around</div>
  <div id="buttons">
    <button class="act" id="newBtn" data-i18n="tica.newGame">New game</button>
    <button class="act ghost" id="modeBtn" data-i18n="tica.vsComputer">Vs computer</button>
  </div>
</div>
<div id="splash">
  <div class="card">
    <h1 data-i18n="tica.title">Kryds &amp; Bolle 3D</h1>
    <p data-i18n="tica.sub">Gold pieces on black marble. Three in a row wins.</p>
    <div class="row">
      <div class="seg">
        <button id="mComp" aria-pressed="true" data-i18n="tica.vsComputer">Vs computer</button>
        <button id="mTwo" aria-pressed="false" data-i18n="tica.twoPlayers">2 players</button>
      </div>
      <button class="act" id="startBtn" data-i18n="tica.start">Start game</button>
    </div>
  </div>
</div>

<script src="../lang.js?v=2"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- language shortcuts ---------------- */
const L = window.DampLang;
const t = (k, v) => L ? L.t(k, v) : k;
const statusEl = document.getElementById('status');

/* ---------------- renderer ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171310);
scene.fog = new THREE.Fog(0x171310, 9, 22);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 80);

/* soft studio reflections make the brass read as metal */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

/* ---------------- textures ---------------- */
function marbleTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0d10';
  g.fillRect(0, 0, 1024, 1024);
  // cloudy base
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 1024, y = Math.random() * 1024, r = 90 + Math.random() * 260;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(44,44,52,' + (0.05 + Math.random() * 0.08) + ')');
    grd.addColorStop(1, 'rgba(12,12,16,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // veins
  for (let v = 0; v < 16; v++) {
    let x = Math.random() * 1024, y = Math.random() * 1024;
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 26; s++) {
      x += (Math.random() - 0.35) * 90;
      y += (Math.random() - 0.5) * 110;
      g.lineTo(x, y);
    }
    g.strokeStyle = 'rgba(214,206,188,' + (0.04 + Math.random() * 0.07) + ')';
    g.lineWidth = 0.6 + Math.random() * 1.6;
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function woodTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#3d2718';
  g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 260; i++) {
    const y = Math.random() * 1024;
    const w = 1 + Math.random() * 5;
    g.strokeStyle = 'rgba(' + (40 + Math.random() * 60) + ',' + (22 + Math.random() * 30) + ',12,' + (0.05 + Math.random() * 0.12) + ')';
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 1024; x += 64) {
      g.lineTo(x, y + Math.sin((x + i * 37) * 0.012) * 9 + (Math.random() - 0.5) * 4);
    }
    g.stroke();
  }
  // plank seams
  g.strokeStyle = 'rgba(20,10,6,.55)';
  g.lineWidth = 3;
  for (let i = 1; i < 4; i++) {
    const y = i * 256;
    g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2.2, 2.2);
  tex.anisotropy = 8;
  return tex;
}

/* ---------------- table + board ---------------- */
const table = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.62, metalness: 0.05 })
);
table.rotation.x = -Math.PI / 2;
table.position.y = -0.16;
table.receiveShadow = true;
scene.add(table);

const board = new THREE.Group();
scene.add(board);

const marble = new THREE.MeshPhysicalMaterial({
  map: marbleTexture(), roughness: 0.42, metalness: 0.0,
  clearcoat: 0.35, clearcoatRoughness: 0.45
});
const slab = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.26, 3.5), marble);
slab.position.y = -0.13;
slab.castShadow = true;
slab.receiveShadow = true;
board.add(slab);

const brass = new THREE.MeshStandardMaterial({ color: 0xc9a24b, metalness: 1, roughness: 0.33 });
const brassDim = new THREE.MeshStandardMaterial({ color: 0xa8853b, metalness: 1, roughness: 0.42 });

// gold inlay grid
const lineH = 0.012;
for (const i of [-0.5, 0.5]) {
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.022, lineH, 3.24), brass);
  v.position.set(i, 0.02, 0);
  board.add(v);
  const h = new THREE.Mesh(new THREE.BoxGeometry(3.24, lineH, 0.022), brass);
  h.position.set(0, 0.02, i);
  board.add(h);
}
// outer frame
const frame = new THREE.Mesh(new THREE.BoxGeometry(3.42, 0.02, 3.42), brassDim);
frame.position.y = -0.005;
frame.scale.set(1, 1, 1);
const frameInner = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.024, 3.3),
  new THREE.MeshPhysicalMaterial({ map: marble.map, roughness: 0.4, clearcoat: .3, clearcoatRoughness: .5 }));
frameInner.position.y = 0.002;
board.add(frameInner, frame);

/* ---------------- pieces ---------------- */
const CELL = 1.08;

function makeX() {
  const g = new THREE.Group();
  const bar = new THREE.BoxGeometry(0.96, 0.2, 0.26);
  const mat = brass.clone();
  const a = new THREE.Mesh(bar, mat);
  const b = new THREE.Mesh(bar, mat);
  a.rotation.y = Math.PI / 4;
  b.rotation.y = -Math.PI / 4;
  a.castShadow = b.castShadow = true;
  a.receiveShadow = b.receiveShadow = true;
  g.add(a, b);
  return g;
}

function makeO() {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.125, 22, 56), brass.clone());
  ring.rotation.x = -Math.PI / 2;
  ring.castShadow = true;
  ring.receiveShadow = true;
  g.add(ring);
  return g;
}

function cellPos(i) {
  const r = Math.floor(i / 3), c = i % 3;
  return { x: (c - 1) * CELL, z: (r - 1) * CELL };
}

const pieces = [];       // { mesh, cell, player, y, vy, settled }
const hover = { ghost: null, cell: -1 };

/* ---------------- game state ---------------- */
const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];
let boardState = new Array(9).fill(null);
let turn = 'X';
let mode = 'computer';   // 'computer' | 'two'
let over = false;
let running = false;
let wins = { X: 0, O: 0, draw: 0 };
let pendingTimer = null;

function setStatus(text) { statusEl.textContent = text; }

function statusForTurn() {
  if (mode === 'two') {
    setStatus(turn === 'X' ? t('tica.turnX') : t('tica.turnO'));
  } else {
    setStatus(turn === 'X' ? t('tica.yourTurn') : t('tica.computerTurn'));
  }
}

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1500);
}

function newRound(keepScore) {
  if (!keepScore) wins = { X: 0, O: 0, draw: 0 };
  for (const p of pieces) {
    board.remove(p.mesh);
    p.mesh.traverse(o => { if (o.geometry) o.geometry.dispose && o.geometry.dispose(); });
  }
  pieces.length = 0;
  boardState = new Array(9).fill(null);
  turn = 'X';
  over = false;
  clearTimeout(pendingTimer);
  statusForTurn();
}

function addPiece(cell, player) {
  const g = player === 'X' ? makeX() : makeO();
  const { x, z } = cellPos(cell);
  g.position.set(x, 3.0, z);
  if (player === 'O') g.rotation.y = Math.random() * Math.PI;
  board.add(g);
  const p = { mesh: g, cell, player, vy: 0, settled: false, t: 0 };
  pieces.push(p);
  boardState[cell] = player;
  click(300 + (player === 'X' ? 40 : 0), 0.05);
  return p;
}

function checkWinner(state) {
  for (const line of LINES) {
    const [a, b, c] = line;
    if (state[a] && state[a] === state[b] && state[a] === state[c]) return { player: state[a], line };
  }
  return state.every(Boolean) ? { player: 'draw', line: null } : null;
}

function finish(result) {
  over = true;
  running = false;
  if (result.player === 'draw') {
    wins.draw++;
    setStatus(t('tica.draw'));
    toast(t('tica.draw'));
    return;
  }
  const winner = result.player;
  const line = result.line;
  for (const p of pieces) {
    if (line.includes(p.cell)) {
      p.winner = true;
      p.glows = [];
      p.mesh.traverse(o => {
        if (o.isMesh) {
          o.material = o.material.clone();
          o.material.emissive = new THREE.Color(0xd99b1e);
          o.material.emissiveIntensity = 0.6;
          o.material.roughness = 0.22;
          p.glows.push(o.material);
        }
      });
    }
  }
  if (mode === 'computer') {
    toast(winner === 'X' ? t('tica.youWin') : t('tica.computerWins'));
    setStatus(winner === 'X' ? t('tica.youWin') : t('tica.computerWins'));
  } else {
    toast(winner === 'X' ? t('tica.winX') : t('tica.winO'));
    setStatus(winner === 'X' ? t('tica.winX') : t('tica.winO'));
  }
  wins[winner]++;
  chime(winner === 'X' ? [523, 659, 784] : [392, 330, 262]);
}

/* ---------------- computer ---------------- */
function bestMove(state, player) {
  const other = player === 'X' ? 'O' : 'X';
  function scoreFrom(s, depth, toMove) {
    const w = checkWinner(s);
    if (w) {
      if (w.player === 'draw') return 0;
      return w.player === player ? 10 - depth : depth - 10;
    }
    const opts = s.map((v, i) => v ? null : i).filter(i => i !== null);
    let best = toMove === player ? -99 : 99;
    for (const i of opts) {
      const copy = s.slice();
      copy[i] = toMove;
      const val = scoreFrom(copy, depth + 1, toMove === 'X' ? 'O' : 'X');
      best = toMove === player ? Math.max(best, val) : Math.min(best, val);
    }
    return best;
  }
  const free = state.map((v, i) => v ? null : i).filter(i => i !== null);
  if (!free.length) return -1;
  // a little imperfection keeps it fun
  if (Math.random() < 0.18) return free[(Math.random() * free.length) | 0];
  let bestScore = -99, choice = free[0];
  for (const i of free) {
    const copy = state.slice();
    copy[i] = player;
    const s = scoreFrom(copy, 1, player === 'X' ? 'O' : 'X');
    if (s > bestScore) { bestScore = s; choice = i; }
  }
  return choice;
}

function computerMove() {
  if (over || !running) return;
  const i = bestMove(boardState, 'O');
  if (i < 0) return;
  makeMove(i, 'O');
  const res = checkWinner(boardState);
  if (res) { finish(res); return; }
  turn = 'X';
  statusForTurn();
}

/* ---------------- placing ---------------- */
function makeMove(cell, player) {
  const piece = addPiece(cell, player);
  piece.onSettle = () => {
    if (piece.settled) return;
    piece.settled = true;
    piece.mesh.position.y = 0.12;
    piece.mesh.scale.set(1.03, 0.94, 1.03);
    click(170, 0.06);
  };
  return piece;
}

function playerMove(cell) {
  if (!running || over) return;
  if (boardState[cell]) return;
  if (mode === 'computer' && turn !== 'X') return;
  const player = turn;
  makeMove(cell, player);
  const res = checkWinner(boardState);
  if (res) { finish(res); return; }
  turn = player === 'X' ? 'O' : 'X';
  statusForTurn();
  if (mode === 'computer' && turn === 'O') {
    pendingTimer = setTimeout(computerMove, 560);
  }
}

/* ---------------- pointer + camera ---------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const cellPlanes = [];
for (let i = 0; i < 9; i++) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(CELL * 0.92, CELL * 0.92),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  const { x, z } = cellPos(i);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.02, z);
  m.userData.cell = i;
  board.add(m);
  cellPlanes.push(m);
}

const cam = { yaw: 0, pitch: 0.5, dist: 6.0, dragging: false, sx: 0, sy: 0, moved: 0 };
const camTarget = new THREE.Vector3(0, 0.12, 0);

function updateCamera(dt) {
  const y = Math.sin(cam.pitch) * cam.dist;
  const r = Math.cos(cam.pitch) * cam.dist;
  const x = Math.sin(cam.yaw) * r;
  const z = Math.cos(cam.yaw) * r;
  camera.position.lerp(new THREE.Vector3(x, y + 0.1, z), Math.min(1, dt * 8 + 0.05));
  camera.lookAt(camTarget);
}

renderer.domElement.addEventListener('pointerdown', e => {
  cam.dragging = true; cam.sx = e.clientX; cam.sy = e.clientY; cam.moved = 0;
});
addEventListener('pointerup', () => { cam.dragging = false; });
addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  if (!cam.dragging) return;
  const dx = e.clientX - cam.sx, dy = e.clientY - cam.sy;
  cam.sx = e.clientX; cam.sy = e.clientY;
  cam.moved += Math.abs(dx) + Math.abs(dy);
  cam.yaw -= dx * 0.005;
  cam.pitch = Math.max(0.32, Math.min(1.1, cam.pitch - dy * 0.004));
});
renderer.domElement.addEventListener('click', e => {
  if (cam.moved > 8) return;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(cellPlanes, false)[0];
  if (!hit) return;
  playerMove(hit.object.userData.cell);
});

/* ---------------- audio ---------------- */
let actx = null;
function click(freq, dur) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.value = 0.05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (_) {}
}
function chime(freqs) {
  freqs.forEach((f, i) => setTimeout(() => click(f, 0.22), i * 110));
}

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xffe7c4, 0x2a1d13, 0.75));
const key = new THREE.DirectionalLight(0xfff0d2, 3.1);
key.position.set(3.4, 5.6, 2.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.camera.far = 16;
key.shadow.bias = -0.0006;
scene.add(key);
const rim = new THREE.SpotLight(0xffd9a0, 26, 14, 0.7, 0.6, 1.6);
rim.position.set(-3.6, 4.2, -2.4);
rim.target.position.set(0, 0, 0);
scene.add(rim, rim.target);
const fill = new THREE.PointLight(0xfff4e2, 6, 10, 2);
fill.position.set(2.6, 2.2, -3.2);
scene.add(fill);

/* ---------------- UI wiring ---------------- */
const splash = document.getElementById('splash');
const modeBtn = document.getElementById('modeBtn');
const mComp = document.getElementById('mComp');
const mTwo = document.getElementById('mTwo');

function syncModeButtons() {
  const label = mode === 'computer' ? t('tica.vsComputer') : t('tica.twoPlayers');
  modeBtn.textContent = label;
  mComp.setAttribute('aria-pressed', String(mode === 'computer'));
  mTwo.setAttribute('aria-pressed', String(mode === 'two'));
}
function setMode(next) {
  mode = next;
  syncModeButtons();
  newRound(true);
}
mComp.addEventListener('click', () => setMode('computer'));
mTwo.addEventListener('click', () => setMode('two'));
modeBtn.addEventListener('click', () => setMode(mode === 'computer' ? 'two' : 'computer'));

function begin() {
  splash.classList.add('gone');
  running = true;
  newRound(true);
  if (actx && actx.state === 'suspended') actx.resume();
}
document.getElementById('startBtn').addEventListener('click', begin);
document.getElementById('newBtn').addEventListener('click', () => {
  if (!running) { begin(); return; }
  newRound(true);
});

/* ---------------- render loop ---------------- */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(0.033, clock.getDelta());

  for (const p of pieces) {
    if (!p.settled) {
      p.vy -= 26 * dt;
      p.mesh.position.y += p.vy * dt;
      if (p.mesh.position.y <= 0.1) {
        p.mesh.position.y = 0.1;
        p.vy = 0;
        if (p.onSettle) p.onSettle();
      }
      if (p.player === 'O') p.mesh.rotation.y += dt * 0.6;
    } else {
      // settle squash back to normal
      p.mesh.scale.x += (1 - p.mesh.scale.x) * Math.min(1, dt * 10);
      p.mesh.scale.y += (1 - p.mesh.scale.y) * Math.min(1, dt * 10);
      p.mesh.scale.z += (1 - p.mesh.scale.z) * Math.min(1, dt * 10);
      if (p.winner) {
        p.mesh.position.y += (0.2 - p.mesh.position.y) * Math.min(1, dt * 4);
        const pulse = 0.5 + Math.sin(performance.now() * 0.005) * 0.3;
        for (const m of p.glows) m.emissiveIntensity = pulse;
      }
    }
  }

  // hover ghost
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(cellPlanes, false)[0];
  const cell = hit ? hit.object.userData.cell : -1;
  const canPlay = cell >= 0 && running && !over && !boardState[cell] && (mode === 'two' || turn === 'X');
  if (canPlay && cell !== hover.cell) {
    if (hover.ghost) { board.remove(hover.ghost); hover.ghost = null; }
    hover.cell = cell;
    if (cell >= 0) {
      const g = turn === 'X' ? makeX() : makeO();
      g.traverse(o => {
        if (o.isMesh) {
          o.material = new THREE.MeshStandardMaterial({ color: 0xe9b44c, metalness: 1, roughness: .4, transparent: true, opacity: 0.28, depthWrite: false });
        }
      });
      const { x, z } = cellPos(cell);
      g.position.set(x, 0.13, z);
      board.add(g);
      hover.ghost = g;
    }
  } else if ((!canPlay || cell === -1) && hover.ghost) {
    board.remove(hover.ghost);
    hover.ghost = null;
    hover.cell = -1;
  }

  updateCamera(dt);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* language switch: repaint status and buttons */
if (L) {
  L.onChange(() => {
    syncModeButtons();
    if (!over && running) statusForTurn();
    else if (over) setStatus(statusEl.textContent);
  });
  L.apply();
}

syncModeButtons();
statusForTurn();
tick();

window.__tica = {
  begin, newRound, playerMove, computerMove, bestMove, setMode,
  get board() { return boardState; }, get turn() { return turn; },
  get over() { return over; }, get running() { return running; }, pieces
};
</script>
