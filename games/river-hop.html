<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Hop</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07131a;color:#e9f4ef;overflow:hidden;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  #wrap{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
  canvas{display:block;max-width:100%;max-height:100%;background:#07131a}
  #ui{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:13px 20px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#7fa392;
    pointer-events:none}
  #ui b{color:#a6f0c6}
  #over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,12,16,.86);
    text-align:center;padding:24px}
  #over.hide{display:none}
  #over h1{margin:0 0 12px;font-size:clamp(38px,8vw,74px);letter-spacing:-.03em;line-height:.95;color:#c8f7dd}
  #over p{margin:0 0 20px;color:#8fae9e;max-width:440px;line-height:1.55}
  #over button{font:inherit;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:#a6f0c6;color:#07211a;border:0;border-radius:10px;padding:14px 32px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="720" height="720"></canvas>
  <div id="ui"><span><span data-i18n="common.score">Score</span> <b id="score">0</b></span><span><span data-i18n="common.time">Time</span> <b id="time">60</b></span><span><span data-i18n="common.lives">Lives</span> <b id="lives">3</b></span></div>
  <div id="over">
    <div>
      <h1 id="title" data-i18n="river.title">RIVER HOP</h1>
      <p id="sub" data-i18n="river.sub">Cross five lanes of traffic, ride the logs and reach the lily pads. One hop at a time. Arrow keys or WASD.</p>
      <button id="go" data-i18n="river.start">Hop in</button>
    </div>
  </div>
</div>
<script src="../lang.js?v=2"></script>
<script>
(() => {
  const L = window.DampLang;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, COL = 11, ROW = 13;
  const CELL = Math.floor(Math.min(W / COL, H / ROW));
  const OX = (W - CELL * COL) / 2, OY = (H - CELL * ROW) / 2 + 18;
  const $ = id => document.getElementById(id);

  // rows: 0 = goal bank, 1-5 river, 6 = middle bank, 7-11 road, 12 = start bank
  const LANES = [
    { row: 7, dir: -1, speed: 130, gap: 250, len: 92, color: '#ff7b6b' },
    { row: 8, dir: 1, speed: 190, gap: 300, len: 120, color: '#ffd166' },
    { row: 9, dir: -1, speed: 160, gap: 230, len: 78, color: '#8be9fd' },
    { row: 10, dir: 1, speed: 220, gap: 340, len: 140, color: '#c3a6ff' },
    { row: 11, dir: -1, speed: 110, gap: 210, len: 84, color: '#9be59b' }
  ];
  const LOGS = [
    { row: 1, dir: 1, speed: 70, gap: 250, len: 132 },
    { row: 2, dir: -1, speed: 95, gap: 300, len: 170 },
    { row: 3, dir: 1, speed: 60, gap: 230, len: 120 },
    { row: 4, dir: -1, speed: 110, gap: 320, len: 190 },
    { row: 5, dir: 1, speed: 80, gap: 260, len: 145 }
  ];
  const goals = [1, 3, 5, 7, 9].map(col => ({ col, cat: false }));

  let state = 'menu', score = 0, lives = 3, timeLeft = 60;
  let cars = [], logs = [], hop = 0, pad = 0;
  const player = { cx: 5, cy: 12, x: 0, y: 0, riding: null };
  const keys = {};

  function pos(cx, cy) {
    return { x: OX + cx * CELL + CELL / 2, y: OY + cy * CELL + CELL / 2 };
  }
  player.x = pos(player.cx, player.cy).x;
  player.y = pos(player.cx, player.cy).y;

  function buildTraffic() {
    cars = [];
    for (const lane of LANES) {
      const y = OY + lane.row * CELL + CELL / 2;
      for (let x = -200; x < W + 400; x += lane.gap) {
        cars.push({ x, y: y + 2, len: lane.len, h: CELL - 18, vx: lane.speed * lane.dir,
          color: lane.color, row: lane.row });
      }
    }
    logs = [];
    for (const lane of LOGS) {
      const y = OY + lane.row * CELL + CELL / 2;
      for (let x = -150; x < W + 400; x += lane.gap) {
        logs.push({ x, y, len: lane.len, h: CELL - 14, vx: lane.speed * lane.dir, row: lane.row });
      }
    }
    pad = 0;
    goals.forEach(g => g.cat = false);
  }

  function start() {
    score = 0; lives = 3; timeLeft = 60;
    player.cx = 5; player.cy = 12; player.riding = null;
    const p = pos(player.cx, player.cy); player.x = p.x; player.y = p.y;
    buildTraffic();
    state = 'play';
    $('over').classList.add('hide');
    sync();
  }

  function sync() {
    $('score').textContent = score;
    $('lives').textContent = Math.max(0, lives);
    $('time').textContent = Math.ceil(Math.max(0, timeLeft));
  }

  function die() {
    if (state !== 'play') return;
    lives--; sync();
    beep(160, .3, 'sawtooth', .05);
    player.cx = 5; player.cy = 12; player.riding = null;
    const p = pos(player.cx, player.cy); player.x = p.x; player.y = p.y;
    timeLeft = Math.max(timeLeft, 12);
    if (lives <= 0) end('river.over', 'river.overSub', { score });
  }

  let endState = null;
  function paintEnd() {
    if (!endState) return;
    $('title').textContent = L.t(endState.titleKey);
    $('sub').textContent = L.t(endState.subKey, endState.vars);
    $('go').textContent = L.t('river.again');
  }
  L.onChange(() => { if (state === 'over') paintEnd(); });

  function end(titleKey, subKey, vars) {
    state = 'over';
    endState = { titleKey, subKey, vars: vars || {} };
    paintEnd();
    $('over').classList.remove('hide');
  }

  function beep(freq, dur = .08, type = 'square', gain = .03) {
    try {
      if (!beep.ctx) beep.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = beep.ctx.createOscillator(), g = beep.ctx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = gain;
      o.connect(g); g.connect(beep.ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(.0001, beep.ctx.currentTime + dur);
      o.stop(beep.ctx.currentTime + dur);
    } catch (_) {}
  }

  function move(dx, dy) {
    if (state !== 'play') return;
    const nx = player.cx + dx, ny = player.cy + dy;
    if (nx < 0 || nx >= COL || ny < 0 || ny > 12) return;
    // lily pads are only on odd columns in the goal row
    if (ny === 0 && !goals.some(g => g.col === nx)) return;
    player.cx = nx; player.cy = ny;
    player.riding = null;
    if (ny === 0) {
      const done = goals.filter(g => g.cat).length + 1;
      goals.find(g => g.col === nx).cat = true;
      score += 200; pad = done;
      beep(760, .18, 'sine', .05);
      if (goals.every(g => g.cat)) { end('river.allSafe', 'river.allSafeSub', { score }); return; }
      player.cx = 5; player.cy = 12;
      timeLeft = Math.max(timeLeft, 20);
    } else if (dy < 0) {
      score += 10;
      beep(520, .05);
    }
    sync();
  }

  addEventListener('keydown', e => {
    if (keys[e.code]) return;
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state !== 'play') { start(); return; }
    if (e.code === 'ArrowUp' || e.code === 'KeyW') move(0, -1);
    if (e.code === 'ArrowDown' || e.code === 'KeyS') move(0, 1);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1, 0);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1, 0);
  });
  addEventListener('keyup', e => keys[e.code] = false);
  $('go').addEventListener('click', start);
  cv.addEventListener('pointerdown', () => { if (state !== 'play') start(); });

  function update(dt) {
    for (const c of cars) {
      c.x += c.vx * dt;
      if (c.vx < 0 && c.x + c.len < -60) c.x = W + 120;
      if (c.vx > 0 && c.x > W + 60) c.x = -c.len - 120;
    }
    for (const l of logs) {
      l.x += l.vx * dt;
      if (l.vx < 0 && l.x + l.len < -60) l.x = W + 120;
      if (l.vx > 0 && l.x > W + 60) l.x = -l.len - 120;
    }

    if (state !== 'play') return;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; sync(); die(); return; }
    sync();

    // ride a log
    const target = pos(player.cx, player.cy);
    if (player.cy >= 1 && player.cy <= 5) {
      const hit = logs.find(l => l.row === player.cy &&
        player.x > l.x && player.x < l.x + l.len);
      if (hit) {
        player.riding = hit;
        player.x += hit.vx * dt;
        // keep an eye on the column under the centre so hops stay on logs
        player.cx = Math.round((player.x - OX - CELL / 2) / CELL);
        if (player.cx < 0 || player.cx >= COL) { die(); return; }
      } else {
        die(); return;
      }
    } else {
      player.x += (target.x - player.x) * Math.min(1, dt * 18);
      player.y += (target.y - player.y) * Math.min(1, dt * 18);
    }
    if (player.cy < 1 || player.cy > 5) {
      player.x += (target.x - player.x) * Math.min(1, dt * 18);
    }
    player.y += (target.y - player.y) * Math.min(1, dt * 18);

    // car hits
    for (const c of cars) {
      if (c.row !== player.cy) continue;
      if (player.x > c.x && player.x < c.x + c.len && Math.abs(player.y - c.y) < CELL * .42) {
        die(); return;
      }
    }
  }

  function draw() {
    // water
    ctx.fillStyle = '#0d2b3a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#12384a';
    ctx.fillRect(0, OY, W, CELL * 6);
    // banks
    ctx.fillStyle = '#1f4636';
    ctx.fillRect(0, OY + CELL * 11, W, CELL * 2);
    ctx.fillStyle = '#163a2c';
    ctx.fillRect(0, OY, W, CELL);
    // road
    ctx.fillStyle = '#20242b';
    ctx.fillRect(0, OY + CELL * 7, W, CELL * 5);
    for (let r = 7; r < 12; r++) {
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.setLineDash([18, 22]);
      ctx.beginPath();
      ctx.moveTo(0, OY + r * CELL + CELL);
      ctx.lineTo(W, OY + r * CELL + CELL);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // lily pads
    for (const g of goals) {
      const x = OX + g * CELL + CELL / 2, y = OY + CELL / 2;
      ctx.fillStyle = g.cat ? '#4ade80' : '#2f7d4f';
      ctx.beginPath(); ctx.ellipse(x, y, CELL * .34, CELL * .3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = g.cat ? '#0b2a1a' : '#1b4a30';
      ctx.beginPath(); ctx.ellipse(x + CELL * .06, y, CELL * .12, CELL * .1, 0, 0, 7); ctx.fill();
    }

    // logs
    for (const l of logs) {
      ctx.fillStyle = '#6b4a2b';
      roundRect(l.x, l.y - l.h / 2, l.len, l.h, 9); ctx.fill();
      ctx.fillStyle = '#8a6038';
      roundRect(l.x + 5, l.y - l.h / 2 + 4, l.len - 10, 4, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.moveTo(l.x + l.len - 8, l.y - l.h / 2 + 3); ctx.lineTo(l.x + l.len - 8, l.y + l.h / 2 - 3); ctx.stroke();
    }

    // cars
    for (const c of cars) {
      ctx.fillStyle = c.color;
      roundRect(c.x, c.y - c.h / 2, c.len, c.h, 8); ctx.fill();
      ctx.fillStyle = 'rgba(8,14,20,.55)';
      roundRect(c.x + c.len * .22, c.y - c.h / 2 + 4, c.len * .3, c.h - 8, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      const fx = c.vx > 0 ? c.x + c.len - 6 : c.x + 2;
      ctx.fillRect(fx, c.y - 4, 4, 8);
    }

    // player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#ffd166';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, CELL * .3, CELL * .26, 0, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.fillStyle = '#173a2a';
    ctx.beginPath(); ctx.arc(-5, -3, 2.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -3, 2.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#173a2a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 2, 5, .2, Math.PI - .2); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildTraffic();
  requestAnimationFrame(loop);
  window.__rh = { start, move, player, get state() { return state; }, get score() { return score; } };
})();
</script>
</body>
</html>
