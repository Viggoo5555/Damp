<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Swarm</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050810;color:#e8f0fa;overflow:hidden;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  #wrap{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
  canvas{display:block;max-width:100%;max-height:100%;background:#050810}
  #ui{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:14px 20px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#7f93ad;
    pointer-events:none}
  #ui b{color:#8be9fd}
  #over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,6,12,.84);
    text-align:center;padding:24px}
  #over.hide{display:none}
  #over h1{margin:0 0 12px;font-size:clamp(36px,8vw,72px);letter-spacing:-.03em;line-height:.95;
    color:#d7f7ff;text-shadow:0 0 30px rgba(80,220,255,.35)}
  #over p{margin:0 0 20px;color:#93a7c0;max-width:430px;line-height:1.55}
  #over button{font:inherit;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:#8be9fd;color:#06121a;border:0;border-radius:10px;padding:14px 32px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="620"></canvas>
  <div id="ui"><span><span data-i18n="common.score">Score</span> <b id="score">0</b></span><span><span data-i18n="common.wave">Wave</span> <b id="wave">1</b></span><span><span data-i18n="common.lives">Lives</span> <b id="lives">3</b></span></div>
  <div id="over">
    <div>
      <h1 id="title" data-i18n="star.title">STAR SWARM</h1>
      <p id="sub" data-i18n="star.sub">The swarm descends in formation. Hold the line, use the bunkers, and clear every wave. Arrows or A/D to move, space to fire.</p>
      <button id="go" data-i18n="star.launch">Launch</button>
    </div>
  </div>
</div>
<script src="../lang.js?v=2"></script>
<script>
(() => {
  const L = window.DampLang;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = id => document.getElementById(id);

  const ALIEN_COLORS = ['#ff6b9d', '#ffd166', '#7bdff2', '#b388ff', '#8be9fd'];
  const ROWS = 5, COLS = 9;
  let state = 'menu', score = 0, wave = 1, lives = 3;
  let aliens = [], bullets = [], bombs = [], shields = [], particles = [], ufo = null;
  let marchDir = 1, marchTimer = 0, marchStep = 0, waveBreak = 0;
  const player = { x: W / 2, y: H - 56, w: 46, h: 26, speed: 430, cool: 0, dead: 0 };
  const keys = {};

  function buildWave() {
    aliens = [];
    const startX = 130, startY = 96, gapX = 68, gapY = 48;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        aliens.push({
          x0: startX + c * gapX, y0: startY + r * gapY,
          x: startX + c * gapX, y: startY + r * gapY,
          row: r, alive: true, hp: r === 0 ? 2 : 1,
          color: ALIEN_COLORS[r % ALIEN_COLORS.length]
        });
      }
    }
    marchDir = 1; marchStep = 0; marchTimer = 0;
    bombs = [];
  }

  function buildShields() {
    shields = [];
    const bw = 12, bh = 10;
    for (const cx of [W * 0.22, W * 0.5, W * 0.78]) {
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 6; c++) {
          if (r === 0 && (c === 0 || c === 5)) continue;
          shields.push({ x: cx - 36 + c * bw, y: H - 168 + r * bh, w: bw, h: bh, hp: 3 });
        }
      }
    }
  }

  function start() {
    score = 0; wave = 1; lives = 3;
    player.x = W / 2; player.dead = 0;
    buildWave(); buildShields(); bullets = []; bombs = []; particles = []; ufo = null;
    state = 'play';
    $('over').classList.add('hide');
    sync();
  }

  function sync() {
    $('score').textContent = score;
    $('wave').textContent = wave;
    $('lives').textContent = Math.max(0, lives);
  }

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space' && state !== 'play') start();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  $('go').addEventListener('click', start);

  function shoot() {
    if (player.cool > 0 || player.dead > 0) return;
    bullets.push({ x: player.x, y: player.y - 18, vy: -620 });
    player.cool = 0.22;
    sfx(880, .05, 'square', .02);
  }

  function sfx(freq, dur = .08, type = 'square', gain = .03) {
    try {
      if (!sfx.ctx) sfx.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = sfx.ctx.createOscillator(), g = sfx.ctx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = gain;
      o.connect(g); g.connect(sfx.ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(.0001, sfx.ctx.currentTime + dur);
      o.stop(sfx.ctx.currentTime + dur);
    } catch (_) {}
  }

  function boom(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .3, color });
    }
  }

  function paintOver() {
    if (state === 'over') {
      $('title').textContent = L.t('star.over');
      $('sub').textContent = L.t('star.overSub', { score, waves: wave });
      $('go').textContent = L.t('star.again');
    } else {
      $('title').textContent = L.t('star.title');
      $('sub').textContent = L.t('star.sub');
      $('go').textContent = L.t('star.launch');
    }
  }
  L.onChange(paintOver);

  function gameOver() {
    state = 'over';
    paintOver();
    $('over').classList.remove('hide');
  }

  function update(dt) {
    player.cool = Math.max(0, player.cool - dt);
    if (state !== 'play') return;

    if (player.dead > 0) {
      player.dead -= dt;
      if (player.dead <= 0) {
        if (lives <= 0) { gameOver(); return; }
        player.x = W / 2;
        // clear nearby bombs so respawn is fair
        bombs = bombs.filter(b => b.y < H - 200);
      }
      return;
    }

    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * dt;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * dt;
    player.x = Math.max(40, Math.min(W - 40, player.x));
    if (keys['Space']) shoot();

    // bullets
    for (const b of bullets) b.y += b.vy * dt;
    bullets = bullets.filter(b => b.y > 40);

    // shields
    for (const b of bullets) {
      for (const s of shields) {
        if (s.hp > 0 && b.x > s.x && b.x < s.x + s.w && b.y < s.y + s.h && b.y > s.y) {
          s.hp--; b.y = -99;
          boom(b.x, b.y, '#7bdff2', 3);
        }
      }
    }
    bullets = bullets.filter(b => b.y > -20);

    // alien march
    const alive = aliens.filter(a => a.alive);
    if (alive.length) {
      marchTimer += dt;
      const speed = Math.max(0.16, 0.55 - wave * 0.05 - (1 - alive.length / (ROWS * COLS)) * 0.3);
      if (marchTimer > speed) {
        marchTimer = 0;
        marchStep++;
        const stepX = marchDir * 16;
        const stepY = marchStep % 6 === 0 ? 18 : 0;
        let hitEdge = false;
        for (const a of alive) {
          a.x += stepX;
          a.y += stepY;
          if (a.x < 44 || a.x > W - 44) hitEdge = true;
        }
        if (hitEdge) marchDir *= -1;
        // fire
        if (Math.random() < 0.55) {
          const shooter = alive[(Math.random() * alive.length) | 0];
          bombs.push({ x: shooter.x, y: shooter.y + 14, vy: 190 + wave * 12 });
        }
      }
    }

    // bombs
    for (const b of bombs) b.y += b.vy * dt;
    for (const b of bombs) {
      for (const s of shields) {
        if (s.hp > 0 && b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
          s.hp--; b.y = H + 99;
          boom(b.x, b.y, '#ffd166', 4);
        }
      }
      if (b.y > player.y - 16 && b.y < player.y + 16 && Math.abs(b.x - player.x) < player.w / 2) {
        b.y = H + 99;
        lives--; sync();
        player.dead = 1.1;
        boom(player.x, player.y, '#8be9fd', 22);
        sfx(120, .4, 'sawtooth', .06);
      }
    }
    bombs = bombs.filter(b => b.y < H + 20);

    // bullets vs aliens
    for (const b of bullets) {
      for (const a of aliens) {
        if (!a.alive) continue;
        if (Math.abs(b.x - a.x) < 22 && Math.abs(b.y - a.y) < 18) {
          b.y = -99;
          a.hp--;
          if (a.hp <= 0) {
            a.alive = false;
            score += 20 + (ROWS - a.row) * 5;
            boom(a.x, a.y, a.color, 10);
            sfx(320, .06, 'square', .025);
            if (Math.random() < .07) ufo = { x: -40, y: 70, vx: 150, hp: 1 };
            sync();
          }
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.y > -20);

    // ufo bonus
    if (ufo) {
      ufo.x += ufo.vx * dt;
      if (ufo.x > W + 60) ufo = null;
      else {
        for (const b of bullets) {
          if (Math.abs(b.x - ufo.x) < 30 && Math.abs(b.y - ufo.y) < 16) {
            b.y = -99;
            score += 150; sync();
            boom(ufo.x, ufo.y, '#ffd166', 18);
            ufo = null; break;
          }
        }
      }
    }

    // landing = loss
    if (aliens.some(a => a.alive && a.y > player.y - 30)) {
      lives = 0; sync(); player.dead = .01;
    }

    // particles
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    // wave clear
    if (!aliens.some(a => a.alive) && state === 'play') {
      waveBreak += dt;
      if (waveBreak > 1.1) {
        waveBreak = 0; wave++;
        buildWave(); buildShields(); bombs = [];
        sync();
      }
    }
  }

  function drawAlien(a) {
    const s = 14;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.fillStyle = a.color;
    ctx.shadowColor = a.color; ctx.shadowBlur = 12;
    // body
    ctx.beginPath();
    ctx.moveTo(-s, -s * .35);
    ctx.lineTo(-s * .55, -s * .75);
    ctx.lineTo(s * .55, -s * .75);
    ctx.lineTo(s, -s * .35);
    ctx.lineTo(s * .7, s * .6);
    ctx.lineTo(0, s * .95);
    ctx.lineTo(-s * .7, s * .6);
    ctx.closePath();
    ctx.fill();
    // eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#050810';
    ctx.beginPath(); ctx.arc(-s * .35, 0, 2.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(s * .35, 0, 2.4, 0, 7); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // stars
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 70; i++) {
      const x = (i * 137.5) % W, y = (i * 271.3 + performance.now() * .008) % H;
      ctx.fillRect(x, y, 1.6, 1.6);
    }

    // shields
    for (const s of shields) {
      if (s.hp <= 0) continue;
      ctx.fillStyle = ['#2a4a63', '#3c6a8a', '#8be9fd'][Math.min(2, s.hp - 1)];
      ctx.globalAlpha = .9;
      ctx.fillRect(s.x, s.y, s.w - 1, s.h - 1);
    }
    ctx.globalAlpha = 1;

    for (const a of aliens) if (a.alive) drawAlien(a);

    if (ufo) {
      ctx.save();
      ctx.translate(ufo.x, ufo.y);
      ctx.fillStyle = '#ffd166';
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.ellipse(0, 0, 30, 10, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -5, 11, Math.PI, 0); ctx.fill();
      ctx.restore();
    }

    // bullets
    for (const b of bullets) {
      ctx.fillStyle = '#d7fbff';
      ctx.shadowColor = '#8be9fd'; ctx.shadowBlur = 12;
      ctx.fillRect(b.x - 2, b.y - 12, 4, 14);
      ctx.shadowBlur = 0;
    }

    // bombs
    for (const b of bombs) {
      ctx.fillStyle = '#ff9f43';
      ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
    }

    // player
    if (player.dead <= 0 && state === 'play') {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#8be9fd';
      ctx.shadowColor = '#8be9fd'; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(24, 14);
      ctx.lineTo(8, 8);
      ctx.lineTo(0, 14);
      ctx.lineTo(-8, 8);
      ctx.lineTo(-24, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    // floor line
    ctx.strokeStyle = 'rgba(139,233,253,.25)';
    ctx.beginPath(); ctx.moveTo(0, H - 22); ctx.lineTo(W, H - 22); ctx.stroke();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildWave(); buildShields();
  requestAnimationFrame(loop);
  window.__ss = { get state() { return state; }, get score() { return score; }, start, aliens: () => aliens };
})();
</script>
</body>
</html>
