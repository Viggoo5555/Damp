<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic-Tac-Toe</title>
  <style>
    body { background: #10121f; color: #eceef9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    h2 { margin-bottom: 15px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 8px; }
    .cell { width: 100px; height: 100px; background: #191c30; border: 2px solid #2b2f4b; border-radius: 8px; font-size: 3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #8b8dff; }
    .cell:hover { border-color: #8b8dff; }
    button { margin-top: 20px; padding: 10px 20px; background: #8b8dff; color: #11132a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <h2 id="status">Player X's Turn</h2>
  <div class="board" id="board">
    <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
  </div>
  <button id="restart">Restart Game</button>
  <script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    const restartBtn = document.getElementById("restart");
    let options = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let running = true;
    const winConditions = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function initializeGame() {
      board.querySelectorAll(".cell").forEach(cell => cell.addEventListener("click", cellClicked));
      restartBtn.addEventListener("click", restartGame);
      statusText.textContent = `Player ${currentPlayer}'s Turn`;
    }
    function cellClicked() {
      const index = this.getAttribute("data-index");
      if (options[index] !== "" || !running) return;
      options[index] = currentPlayer;
      this.textContent = currentPlayer;
      checkWinner();
    }
    function checkWinner() {
      let roundWon = false;
      for (let i = 0; i < winConditions.length; i++) {
        const [a, b, c] = winConditions[i];
        if (options[a] === "" || options[b] === "" || options[c] === "") continue;
        if (options[a] === options[b] && options[b] === options[c]) { roundWon = true; break; }
      }
      if (roundWon) {
        statusText.textContent = `Player ${currentPlayer} Wins!`;
        running = false;
      } else if (!options.includes("")) {
        statusText.textContent = `Draw!`;
        running = false;
      } else {
        currentPlayer = (currentPlayer === "X") ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s Turn`;
      }
    }
    function restartGame() {
      options = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      running = true;
      statusText.textContent = `Player ${currentPlayer}'s Turn`;
      board.querySelectorAll(".cell").forEach(cell => cell.textContent = "");
    }
    initializeGame();
  </script>
</body>
</html>
