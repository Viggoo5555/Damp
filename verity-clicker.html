<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Verity Clicker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky character stage on the left, tabbed control panel on the right; stacks on phones. */
:root{
  --bg:#06020d; --bg2:#0d0620; --panel:#130a28; --panel2:#1b0f3a; --line:#34196b;
  --fg:#f3ecff; --dim:#a08dcf; --pink:#ff3df2; --cyan:#2df7ff; --lime:#b6ff3d;
  --gold:#ffd23d; --evil:#ff2e55; --form:#ffd400; --form2:#ff9a00;
  --display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1200px 700px at 20% -10%,#2a0d5c55,transparent 60%),radial-gradient(900px 600px at 100% 100%,#5a0a6a33,transparent 60%),var(--bg);
  color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 40px;min-height:100vh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
#app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.04em;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #ff3df255)}
.cur{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;min-width:0;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 0 18px #7a2cff22 inset}
.chip small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.chip b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}
.chip.vp b{color:var(--gold);text-shadow:0 0 10px #ffd23d88}
.chip.ep b{color:var(--evil);text-shadow:0 0 10px #ff2e5588}
.chip.rt b{color:var(--cyan);text-shadow:0 0 10px #2df7ff88}
.chip.mp b{color:var(--lime);text-shadow:0 0 10px #b6ff3d88}
.iconbtns{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px}
.ib:hover{border-color:var(--pink);box-shadow:0 0 12px #ff3df255}
.ib[aria-pressed=false]{opacity:.45}

/* grid */
.grid{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* stage */
.stage{position:sticky;top:10px;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#160a30cc,#0a0418ee);box-shadow:0 0 40px color-mix(in srgb,var(--form) 20%,transparent),0 0 0 1px #000 inset;transition:box-shadow .6s}
@media(max-width:860px){.stage{position:static}}
.formname{text-align:center}
.formname h2{font-size:28px;color:var(--form);text-shadow:0 0 16px var(--form);line-height:1.1}
.formname p{margin:2px 0 0;color:var(--dim);font-size:13px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.tag.hot{border-color:var(--form);color:var(--form)}
.arena{position:relative;width:100%;aspect-ratio:1/1;max-height:420px;margin:0 auto;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--form) 22%,#10062a),#07020f 72%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#face{cursor:pointer}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 0 8px var(--form),0 0 2px #000;white-space:nowrap;animation:floatup 1s ease-out forwards;will-change:transform,opacity}
.floater.crit{font-size:34px;color:var(--gold);text-shadow:0 0 14px var(--gold),0 0 3px #000}
.floater.evil{color:var(--evil);text-shadow:0 0 10px var(--evil)}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.golden{position:absolute;width:64px;height:64px;border:0;background:none;padding:0;z-index:5;filter:drop-shadow(0 0 14px var(--gold));animation:goldfloat 3s ease-in-out infinite}
@keyframes goldfloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
.bossbar{display:none;flex-direction:column;gap:4px}
.bossbar.on{display:flex}
.bar{height:12px;border-radius:99px;background:#000a;border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));box-shadow:0 0 12px var(--pink);transition:width .15s}
.bar.evil>i{background:linear-gradient(90deg,#7a0020,var(--evil));box-shadow:0 0 12px var(--evil)}
.bar.cor>i{background:linear-gradient(90deg,#5b19c9,var(--evil))}
.barrow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.buffs{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.buff{font-size:12px;padding:3px 9px;border-radius:99px;background:#2a1257;border:1px solid var(--gold);color:var(--gold);box-shadow:0 0 10px #ffd23d33}
.buff.evil{border-color:var(--evil);color:var(--evil);box-shadow:0 0 10px #ff2e5533}
.abil{display:none;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.abil.on{display:grid}
.abtn{position:relative;overflow:hidden;padding:7px 8px;border-radius:10px;border:1px solid var(--evil);background:#2a0716;font-size:12px;text-align:left}
.abtn b{display:block;font-family:var(--display);font-weight:400;font-size:14px;color:#ffb0c0}
.abtn:disabled{opacity:.45;cursor:not-allowed}
.abtn i{position:absolute;left:0;bottom:0;height:3px;background:var(--evil)}
.evo{display:flex;gap:10px;align-items:center}
.evo .bar{flex:1}
.btn{border:1px solid var(--pink);background:linear-gradient(180deg,#3b0f72,#22084a);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;letter-spacing:.02em;transition:transform .08s,box-shadow .2s}
.btn:hover:not(:disabled){box-shadow:0 0 16px #ff3df288;transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.btn.go{border-color:var(--lime);background:linear-gradient(180deg,#2f6d12,#15380a);box-shadow:0 0 18px #b6ff3d55;animation:pulse 1.4s infinite}
.btn.evil{border-color:var(--evil);background:linear-gradient(180deg,#701029,#3a0615)}
.btn.small{padding:4px 10px;font-size:13px}
@keyframes pulse{50%{box-shadow:0 0 28px #b6ff3daa}}

/* panel */
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tab{flex:none;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;position:relative;white-space:nowrap}
.tab[aria-selected=true]{border-color:var(--pink);background:linear-gradient(180deg,#3a0f6e,#220849);box-shadow:0 0 14px #ff3df255}
.tab.dot::after{content:"";position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.tab.locked{opacity:.5}
.view{display:none;flex-direction:column;gap:8px}
.view.on{display:flex}
.hint{color:var(--dim);font-size:13px;margin:0}
.sec{margin:6px 0 0;font-size:18px;color:var(--pink);text-shadow:0 0 10px #ff3df266}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.row.can{border-color:#7a3dff;box-shadow:0 0 14px #7a3dff33}
.row.done{opacity:.8;border-color:var(--lime)}
.row.locked{opacity:.55}
.row .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#0006;border:1px solid var(--line)}
.row h3{font-size:16px}
.row p{margin:1px 0 0;font-size:12.5px;color:var(--dim)}
.row .lv{color:var(--cyan);font-weight:800}
.row .buy{min-width:98px;text-align:center}
.row.evilrow{border-color:#5d1230}
.row.evilrow .ico{border-color:#5d1230}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center;font-size:12px;color:var(--dim)}
.fcard canvas{width:84px;height:84px}
.fcard b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--fg)}
.fcard.cur{border-color:var(--form);box-shadow:0 0 16px color-mix(in srgb,var(--form) 40%,transparent)}
.fcard.lock canvas{filter:brightness(0) contrast(.6) opacity(.5)}
.fcard button{margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.stat span{color:var(--dim)}
.stat b{font-variant-numeric:tabular-nums;text-align:right}
.set{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.set input[type=range]{accent-color:var(--pink);width:150px;max-width:100%}
select,textarea{font:inherit;background:#0b0418;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.toggle{width:46px;height:26px;border-radius:99px;border:1px solid var(--line);background:#0b0418;position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.2s}
.toggle[aria-pressed=true]{border-color:var(--lime)}
.toggle[aria-pressed=true]::after{left:23px;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.card{padding:12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column;gap:8px}
.card.evilcard{border-color:#6b1531;background:linear-gradient(180deg,#2a0716,#14040c)}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bulk button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}

/* toasts + modal */
#toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;z-index:50;pointer-events:none;width:min(92vw,420px)}
.toast{padding:9px 14px;border-radius:12px;border:1px solid var(--pink);background:#150a2ce8;box-shadow:0 0 22px #ff3df266;font-weight:800;animation:tin .3s ease-out,tout .4s 3.2s forwards}
.toast small{display:block;font-weight:600;color:var(--dim)}
.toast.good{border-color:var(--lime);box-shadow:0 0 22px #b6ff3d55}
.toast.bad{border-color:var(--evil);box-shadow:0 0 22px #ff2e5566}
.toast.gold{border-color:var(--gold);box-shadow:0 0 22px #ffd23d66}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:60;padding:16px}
#modal.on{display:grid}
#modal .box{max-width:460px;width:100%;padding:20px;border:1px solid var(--pink);border-radius:18px;background:linear-gradient(180deg,#1d0f42,#0c0520);box-shadow:0 0 50px #ff3df255;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
#modal h2{font-size:26px;color:var(--gold)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(circle,#fff,var(--form) 40%,transparent 75%);mix-blend-mode:screen}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){.golden,.btn.go{animation:none}}
.foot{text-align:center;color:var(--dim);font-size:12px}
</style>
<div id="app">
  <header class="top">
    <div class="logo">VERITY CLICKER</div>
    <div class="cur" id="cur"></div>
    <div class="iconbtns">
      <button class="ib" id="btnSound" aria-pressed="true" title="Sound effects" aria-label="Toggle sound effects">🔊</button>
      <button class="ib" id="btnMusic" aria-pressed="true" title="Music" aria-label="Toggle music">🎵</button>
    </div>
  </header>
  <div class="grid">
    <section class="stage" aria-label="Character">
      <div class="formname"><h2 id="formName">Verity</h2><p id="formDesc"></p><div class="tags" id="formTags"></div></div>
      <div class="arena" id="arena">
        <canvas id="fx"></canvas>
        <canvas id="face" aria-label="Click Verity to earn points" role="button" tabindex="0"></canvas>

        <div class="barrow"><span id="bossName"></span><span id="bossTime"></span></div>

      <div class="buffs" id="buffs"></div>
      <div class="abil" id="abil"></div>
      <div id="corWrap" hidden>
        <div class="barrow"><span>Corruption</span><span id="corTxt"></span></div>
        <div class="bar cor"><i id="corBar"></i></div>

      <div>
        <div class="barrow"><span id="evoLabel"></span><span id="evoPct"></span></div>
        <div class="evo"><div class="bar"><i id="evoBar"></i></div><button class="btn" id="evoBtn" disabled>Evolve</button></div>
      </div>

    <section class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div id="views"></div>
    </section>
  </div>
  <p class="foot">Verity Clicker saves automatically in this browser. Use Settings to export a backup.</p>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>

/* ---------- formatting ---------- */
function trim(s){return s.indexOf('.')>=0?s.replace(/\.?0+$/,''):s}
function fmt(n,d=2){
  if(!isFinite(n)) return 'Infinity'; n=Number(n); if(n<0) return '-'+fmt(-n,d);
  const f=(S&&S.set&&S.set.fmt)||'short';
  if(n<1000) return n>=100?String(Math.floor(n)):trim(n.toFixed(n<10?d:1));
  if(f==='sci'){let e=Math.floor(Math.log10(n)),s=(n/Math.pow(10,e)).toFixed(2);if(parseFloat(s)>=10){e++;s=(n/Math.pow(10,e)).toFixed(2)}return trim(s)+'e'+e}
  if(f==='eng'){let e=Math.floor(Math.log10(n)/3)*3,s=(n/Math.pow(10,e)).toFixed(2);if(parseFloat(s)>=1000){e+=3;s=(n/Math.pow(10,e)).toFixed(2)}return trim(s)+'e'+e}
  let e=Math.floor(Math.log10(n)/3);if(e>=SUFFIX.length){const x=Math.floor(Math.log10(n));return trim((n/Math.pow(10,x)).toFixed(2))+'e'+x}
  let s=(n/Math.pow(1000,e)).toFixed(2);if(parseFloat(s)>=1000){e++;s=(n/Math.pow(1000,e)).toFixed(2)}
  return trim(s)+SUFFIX[e];
}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`}

/* ---------- derived values ---------- */
const lv=id=>S.up[id]||0, ev=id=>S.ev[id]||0, ru=id=>S.ru[id]||0, mu=id=>S.mu[id]||0;
const evilUnlocked=()=>S.maxForm>=4;
const achCount=()=>Object.keys(S.ach).length;
function buffMul(k){let m=1;for(const b of T.buffs)if(b.k===k)m*=b.m;return m}
function buffAdd(k){let m=0;for(const b of T.buffs)if(b.k===k)m+=b.m;return m}
function recompute(){
  const d={};
  const tier=(1+.25*S.rebirths[0])*(1+.75*S.rebirths[1])*(1+3*S.rebirths[2]);
  let sk=1;for(const k in S.skins){const s=SKINS.find(x=>x.id===k);if(s)sk*=s.mult}
  for(const k in S.secrets){const s=SECRETS.find(x=>x.id===k);if(s)sk*=s.mult}
  let bm=1;S.bossDone.forEach((x,i)=>{if(x)bm*=BOSSES[i].m});
  d.formMul=FORMS[S.form].mult;
  d.global=d.formMul*Math.pow(1.2,lv('power'))*tier*(1+.02*achCount())*(1+.1*Math.pow(S.totalTokens,.6))*bm*sk*(1+.02*S.corruption)*Math.pow(1.6,ev('pact'))*Math.pow(1.5,ru('tpower'))*buffMul('all');
  const baseAuto=lv('auto')*(1+.05*lv('auto'))+150*lv('factory')+2e4*lv('multi')+5e9*lv('forge');
  d.pps=baseAuto*(1+ru('eauto'))*(1+.25*mu('mauto'))*Math.pow(1.25,ev('engine'))*d.global;
  const cb=1+lv('click')*(1+.05*lv('click'))+baseAuto*.01;
  d.clickVal=cb*(1+ru('eclick'))*(1+.25*mu('mclick'))*Math.pow(1.3,ev('dclick'))*buffMul('click')*d.global;
  d.critCh=clamp((lv('crit')>0?.02+.012*lv('crit'):0)+.015*ev('hcrit')+buffAdd('crit'),0,.8);
  d.critMul=8+.2*lv('crit')+ev('hcrit');
  d.priceMul=Math.max(.05,Math.pow(.97,ev('disc'))*buffMul('price'));
  d.evoMul=Math.pow(.97,lv('evo'))*Math.pow(.93,ru('edisc'));
  d.eps=evilUnlocked()?.5*(1+.5*lv('evil'))*Math.pow(2,Math.max(0,S.form-4))*Math.pow(1.35,ev('soul'))*(1+.25*mu('mevil'))*buffMul('ep'):0;
  d.avgClick=d.clickVal*(1+d.critCh*(d.critMul-1));
  D=d;return d;
}
const upCost=(u,l)=>Math.floor(u.base*Math.pow(u.g,l)*D.priceMul);
const evCost=(u,l)=>Math.floor(u.base*Math.pow(u.g,l));
const ruCost=(u,l)=>Math.ceil(u.base*Math.pow(u.g,l));
const evoCostOf=i=>Math.floor(FORMS[i].cost*D.evoMul);
const addPts=v=>{S.pts+=v;S.total+=v;S.run+=v};
const addEP=v=>{S.evilPts+=v;S.totalEvil+=v};
function addBuff(k,m,sec,label,evil){
  const ex=T.buffs.find(b=>b.label===label);
  if(ex){ex.until=Math.max(ex.until,now()+sec*1000);return}
  T.buffs.push({k,m,until:now()+sec*1000,label,evil:!!evil});
}

/* ---------- clicking ---------- */
function doClick(x,y){
  recompute();
  let v=D.clickVal,crit=Math.random()<D.critCh;
  if(crit){v*=D.critMul;S.crits++}
  addPts(v);if(evilUnlocked())addEP(D.eps*.1);
  S.clicks++;if(v>S.bestClick)S.bestClick=v;
  if(T.boss)hitBoss(v);
  const t=now();T.idle=0;T.squish=1;
  T.combo=(t-T.lastClick<450)?Math.min(12,(T.combo||0)+1):0;T.lastClick=t;
  T.clickTimes.push(t);if(T.clickTimes.length>24)T.clickTimes.shift();
  if(T.clickTimes.length>=24&&t-T.clickTimes[0]<2000)unlockSecret('moggity');
  H.floater('+'+fmt(v),crit?'crit':'',x,y);
  H.burst(x,y,crit?26:8,{crit});
  H.sfx(crit?'crit':'click',T.combo);
  if(crit&&S.set.shake)H.shake();
}

/* ---------- shop ---------- */
function bulkCost(kind,u,n){
  const lvl=kind==='up'?lv(u.id):kind==='ev'?ev(u.id):ru(u.id);
  const f=kind==='up'?upCost:kind==='ev'?evCost:ruCost;
  const wallet=kind==='up'?S.pts:kind==='ev'?S.evilPts:S.tokens;
  const mx=isFinite(u.max)?u.max-lvl:Infinity;
  const lim=n==='max'?500:n;let total=0,cnt=0;
  while(cnt<Math.min(lim,mx)){const c=f(u,lvl+cnt);if(n==='max'&&total+c>wallet)break;total+=c;cnt++}
  if(cnt===0&&mx>0){total=f(u,lvl);cnt=1}
  return{total,cnt};
}
function buy(kind,id,n=1){
  const list=kind==='up'?UPG:kind==='ev'?EVU:RUP,u=list.find(x=>x.id===id);if(!u)return false;
  const store=kind==='up'?S.up:kind==='ev'?S.ev:S.ru;
  const f=kind==='up'?upCost:kind==='ev'?evCost:ruCost;
  recompute();let bought=0;
  const lim=n==='max'?1e4:n;
  while(bought<lim){
    const l=store[id]||0;if(l>=u.max)break;
    const c=f(u,l);
    const wallet=kind==='up'?S.pts:kind==='ev'?S.evilPts:S.tokens;
    if(wallet<c)break;
    if(kind==='up')S.pts-=c;else if(kind==='ev')S.evilPts-=c;else S.tokens-=c;
    store[id]=l+1;bought++;S.buys++;
    if(kind==='ev'){addCorruption(u.cor)}
    if(kind==='ru'&&id==='sform')S.form=Math.max(S.form,0);
    recompute();
  }
  if(bought){H.sfx('buy');H.refresh('shop');}else H.sfx('no');
  return bought>0;
}
function addCorruption(n){
  const before=S.corruption;S.corruption=Math.min(100,S.corruption+n);S.maxCor=Math.max(S.maxCor,S.corruption);
  for(const m of COR_MS)if(before<m.at&&S.corruption>=m.at){H.toast('Corruption: '+m.n,m.d,'bad');H.sfx('evil');H.flash()}
}

/* ---------- evolution ---------- */
function secretReqOK(){return S.form>=14&&S.maxCor>=100&&BOSSES.every((_,i)=>S.bossDone[i])&&S.golden>=7}
function secretReqs(){return[
  ['Reach Omniversal Verity',S.form>=14],['Reach 100% corruption (once)',S.maxCor>=100],
  ['Defeat all six bosses',BOSSES.every((_,i)=>S.bossDone[i])],['Catch 7 golden Verities',S.golden>=7]]}
function canEvolve(){
  const n=S.form+1;if(n>=FORMS.length)return{ok:false,why:'Max form'};
  recompute();const f=FORMS[n];
  if(f.secret&&!secretReqOK())return{ok:false,why:'Hidden requirements'};
  if(lv('evil')<f.evil)return{ok:false,why:'Needs Evil Energy '+f.evil};
  const c=evoCostOf(n);if(S.pts<c)return{ok:false,why:'Not enough points',cost:c};
  return{ok:true,cost:c};
}
function evolve(){
  const r=canEvolve();if(!r.ok){H.sfx('no');return false}
  S.pts-=r.cost;S.form++;
  if(S.form>S.maxForm){S.maxForm=S.form;if(S.form>=9)S.mp++}
  S.look=null;recompute();
  H.sfx('evolve');H.flash();H.shake();
  H.toast('Evolved into '+FORMS[S.form].n+'!','×'+fmt(FORMS[S.form].mult)+' power','good');
  H.burst(...Object.values(H.center()),60,{big:true});
  H.refresh('all');return true;
}

}
function luckyEvent(){

/* ---------- rebirth ---------- */
function tokenGain(t){return Math.floor(Math.pow(Math.max(0,S.run)/1e18,.12)*TIERS[t].tok*(1+.1*mu('mtok')))}
function canRebirth(t){return S.form>=TIERS[t].form&&tokenGain(t)>=1}
function doRebirth(t){
  if(!canRebirth(t))return false;
  const g=tokenGain(t);
  S.tokens+=g;S.totalTokens+=g;S.rebirths[t]++;S.mp+=TIERS[t].mp;
  if(S.run>S.bestRun)S.bestRun=S.run;
  S.pts=ru('head')>0?250*Math.pow(8,ru('head')):0;S.run=0;S.up={};S.ev={};S.evilPts=0;
  S.corruption=Math.floor(S.corruption*.2*ru('dark'));
  S.form=Math.min(ru('sform'),FORMS.length-2);S.maxForm=Math.max(S.maxForm,S.form);S.look=null;
  T.boss=null;T.buffs=[];T.cd={};recompute();
  H.sfx('rebirth');H.flash();H.toast(TIERS[t].n+' complete!','+'+fmt(g)+' Rebirth Tokens','good');
  save();H.refresh('all');return true;
}
function buySkin(id){
  const s=SKINS.find(x=>x.id===id);if(!s||S.skins[id])return;
  if(S.tokens<s.cost||S.rebirths[1]<s.req){H.sfx('no');return}
  S.tokens-=s.cost;S.skins[id]=true;S.look='skin:'+id;recompute();H.sfx('evolve');H.toast(s.n+' unlocked!','×'+fmt(s.mult)+' permanent power','good');H.refresh('all');
}
function buyMastery(id){
  const u=MUP.find(x=>x.id===id),l=mu(id),c=l+1;
  if(l>=u.max||S.mp<c){H.sfx('no');return}
  S.mp-=c;S.mu[id]=l+1;recompute();H.sfx('buy');H.refresh('all');
}

/* ---------- quests ---------- */
const metric=k=>({clicks:S.clicks,earned:S.total,buys:S.buys,crit:S.crits,golden:S.golden,boss:S.bossWins+S.bossFails,evil:S.totalEvil})[k]||0;
function newQuest(){
  recompute();const have=S.quests.map(q=>q.k);
  const opts=['clicks','earned','buys'];
  if(lv('crit')>0)opts.push('crit');opts.push('golden');
  if(S.maxForm>=3)opts.push('boss');if(evilUnlocked())opts.push('evil');
  let k=pick(opts.filter(o=>!have.includes(o)));if(!k)k=pick(opts);
  const vpR=D.pps*600+D.clickVal*150+200;let goal,label,reward={vp:vpR};
  if(k==='clicks'){goal=pick([100,200,400,800,1500]);label=`Click Verity ${fmt(goal)} times`}
  else if(k==='earned'){goal=Math.max(2000,D.pps*900+D.clickVal*300);label=`Earn ${fmt(goal)} points`}
  else if(k==='buys'){goal=pick([8,15,25,40]);label=`Buy ${goal} upgrades`}
  else if(k==='crit'){goal=pick([10,25,40]);label=`Land ${goal} critical clicks`;reward={vp:vpR*1.5}}
  else if(k==='golden'){goal=1;label='Catch a golden Verity';reward={vp:vpR*3}}
  else if(k==='boss'){goal=1;label='Fight a boss';reward={ep:Math.max(50,D.eps*300)}}
  else{goal=Math.max(50,D.eps*600);label=`Earn ${fmt(goal)} Evil Points`;reward={ep:goal*.8}}

}
function ensureQuests(){while(S.quests.length<3)S.quests.push(newQuest())}
const qProg=q=>Math.min(q.goal,metric(q.k)-q.start);
function claimQuest(i){
  const q=S.quests[i];if(!q||qProg(q)<q.goal)return;
  if(q.reward.vp){addPts(q.reward.vp);H.toast('Quest complete!','+'+fmt(q.reward.vp)+' points','good')}
  if(q.reward.ep){addEP(q.reward.ep);H.toast('Quest complete!','+'+fmt(q.reward.ep)+' Evil Points','good')}
  S.questsDone++;S.quests.splice(i,1);ensureQuests();H.sfx('ach');H.refresh('quests');
}

/* ---------- daily ---------- */
const today=()=>{try{return new Date().toLocaleDateString('en-CA')}catch(e){return new Date().toISOString().slice(0,10)}};
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);try{return d.toLocaleDateString('en-CA')}catch(e){return d.toISOString().slice(0,10)}};
const dailyReady=()=>S.daily.last!==today();
function dailyDay(){return S.daily.last===yesterday()?S.daily.streak%7:S.daily.last===today()?(S.daily.streak-1)%7:0}
function claimDaily(){
  if(!dailyReady())return;recompute();
  const day=dailyDay(),min=DAILY[day];
  S.daily.streak=S.daily.last===yesterday()?S.daily.streak+1:1;S.daily.last=today();S.dailyClaims++;
  const vp=Math.max(500,D.pps*60*min+D.clickVal*50);addPts(vp);let msg='+'+fmt(vp)+' points';
  if(evilUnlocked()&&(day===2||day===4)){const e=Math.max(20,D.eps*60*min);addEP(e);msg+=', +'+fmt(e)+' EP'}
  if(day===6){if(S.rebirths[0]+S.rebirths[1]+S.rebirths[2]>0){S.tokens++;msg+=', +1 Rebirth Token'}else{addPts(vp);msg+=' (doubled)'}}
  H.toast('Daily reward claimed!',msg,'gold');H.sfx('ach');H.refresh('all');
}

/* ---------- tick ---------- */
function tick(dt){
  recompute();
  S.playtime+=dt;T.idle+=dt;
  if(D.pps>0)addPts(D.pps*dt);
  if(D.eps>0)addEP(D.eps*dt);
  const t=now();T.buffs=T.buffs.filter(b=>b.until>t);
  for(const k in T.cd)if(T.cd[k]>0)T.cd[k]=Math.max(0,T.cd[k]-dt);
  T.goldIn-=dt;if(T.goldIn<=0){T.goldIn=rnd(60,180)*luckMul();H.golden()}
  T.eventIn-=dt;if(T.eventIn<=0){T.eventIn=rnd(110,260)*luckMul();luckyEvent()}
  if(T.boss){T.boss.t-=dt;T.boss.hp-=D.pps*.1*dt;if(T.boss.hp<=0)endBoss(true);else if(T.boss.t<=0)endBoss(false)}
  T.achT+=dt;if(T.achT>=.5){T.achT=0;checkAch();checkSecrets();}
  T.squish=Math.max(0,T.squish-dt*5);
}

/* ---------- save / load ---------- */
function mergeDeep(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')mergeDeep(a[k],b[k]);else a[k]=b[k]}return a}
function serialize(){S.lastSave=now();return JSON.stringify(S)}
function save(){try{localStorage.setItem(SAVE_KEY,serialize())}catch(e){}}
function loadFromString(str){
  try{const o=JSON.parse(str);const s=mergeDeep(newState(),o);if(!Array.isArray(s.rebirths)||s.rebirths.length<3)s.rebirths=[0,0,0];
    s.form=clamp(s.form|0,0,FORMS.length-1);return s}catch(e){return null}
}
function exportSave(){try{return btoa(unescape(encodeURIComponent(serialize())))}catch(e){return''}}
function importSave(txt){
  try{const s=loadFromString(decodeURIComponent(escape(atob(txt.trim()))));if(!s)return false;S=s;recompute();save();return true}catch(e){return false}
}
function offlineGain(){
  recompute();const dt=(now()-S.lastSave)/1000;if(dt<60||!isFinite(dt))return null;
  const cap=(8+mu('moff'))*3600,eff=Math.min(1,.5+.1*mu('moff')),secs=Math.min(dt,cap);
  const pts=D.pps*secs*eff,ep=D.eps*secs*eff*.5;
  if(pts<=0&&ep<=0)return null;
  addPts(pts);addEP(ep);return{away:dt,secs,eff,pts,ep,capped:dt>cap};
}
/* ============ AUDIO ============ */
let AC=null,sfxG=null,musG=null,musTimer=null,musStep=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    sfxG=AC.createGain();musG=AC.createGain();sfxG.connect(AC.destination);musG.connect(AC.destination);
    applyAudio();
  }catch(e){AC=null}
}
function applyAudio(){
  if(!AC)return;
  sfxG.gain.value=S.set.sfx?S.set.sfxv:0;musG.gain.value=S.set.music?S.set.musv*.5:0;
  if(S.set.music&&!musTimer)musTimer=setInterval(musTick,340);
  if(!S.set.music&&musTimer){clearInterval(musTimer);musTimer=null}
}
function tone(f,dur,type='sine',vol=.3,delay=0,slideTo=null,dest){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.05);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function sfx(name,arg){
  if(!AC||!S.set.sfx)return;
  const c=arg||0;
  switch(name){
    case'click':tone(380+c*45+Math.random()*30,.09,'triangle',.28,0,(380+c*45)*1.5);tone(NOTE(84+Math.min(c,7)),.05,'sine',.08);break;
    case'crit':[76,83,88].forEach((n,i)=>tone(NOTE(n),.14,'sawtooth',.14,i*.045));tone(120,.2,'square',.12,0,60);break;
    case'buy':tone(520,.08,'sine',.25);tone(780,.12,'sine',.22,.06);break;
    case'no':tone(140,.12,'square',.12,0,90);break;
    case'evolve':[60,64,67,72,76,79,84].forEach((n,i)=>tone(NOTE(n),.35,'triangle',.22,i*.07));tone(NOTE(48),.9,'sawtooth',.1,0,NOTE(36));break;
    case'evil':tone(220,.7,'sawtooth',.2,0,45);tone(110,.7,'square',.12,0,40);break;
    case'golden':[88,91,95,100,103].forEach((n,i)=>tone(NOTE(n),.4,'sine',.2,i*.06));break;
    case'lucky':[72,76,79].forEach((n,i)=>tone(NOTE(n),.25,'triangle',.2,i*.08));break;
    case'ach':tone(NOTE(76),.2,'triangle',.22);tone(NOTE(83),.35,'triangle',.22,.1);break;
    case'boss':tone(70,.35,'sawtooth',.3,0,40);tone(70,.35,'sawtooth',.3,.3,40);tone(55,.6,'sawtooth',.3,.6,35);break;
    case'win':[67,71,74,79,83].forEach((n,i)=>tone(NOTE(n),.3,'square',.12,i*.09));break;
    case'lose':[67,64,60,55].forEach((n,i)=>tone(NOTE(n),.3,'triangle',.2,i*.14));break;
    case'rebirth':tone(100,1.4,'sawtooth',.18,0,1600);[84,88,91,96].forEach((n,i)=>tone(NOTE(n),.6,'sine',.2,.6+i*.1));break;
    case'secret':[69,72,76,81,84].forEach((n,i)=>tone(NOTE(n),.5,'sine',.2,i*.12));break;
  }
}
const SCALES={bright:[0,2,4,7,9,12,14,16],dark:[0,3,5,7,10,12,15,17],cosmic:[0,2,7,9,11,14,16,19]};
function musTick(){
  if(!AC||!S.set.music||document.hidden)return;
  const f=S.form,sc=f>=3&&f<=8?SCALES.dark:f>=11?SCALES.cosmic:SCALES.bright;
  const prog=f>=3&&f<=8?[45,41,43,40]:[48,45,41,43];
  const bar=Math.floor(musStep/8)%4,root=prog[bar],st=musStep%8;
  if(st===0){tone(NOTE(root-12),2.6,'sine',.5,0,null,musG);tone(NOTE(root),2.6,'triangle',.12,0,null,musG);tone(NOTE(root+(f>=3&&f<=8?3:4)),2.6,'sine',.12,0,null,musG)}
  if(st%2===0||Math.random()<.4){const n=root+12+sc[Math.floor(Math.random()*sc.length)];tone(NOTE(n),.5,'triangle',.18,0,null,musG)}
  musStep++;
}

/* ============ DRAWING ============ */
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
function star(ctx,x,y,r,p=5,inner=.45){ctx.beginPath();for(let i=0;i<p*2;i++){const a=-Math.PI/2+i*Math.PI/p,rr=i%2?r*inner:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
function heart(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y-s*.2,x-s*.6,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.4,y-s*.2,x,y+s*.9);ctx.closePath()}
function horn(ctx,x,dir,r,len,col){ctx.save();ctx.translate(x,-r*.82);ctx.rotate(dir*.35);ctx.beginPath();ctx.moveTo(-r*.13,0);ctx.quadraticCurveTo(dir*r*.05,-len*.6,dir*r*.12,-len);ctx.quadraticCurveTo(r*.15*dir,-len*.4,r*.13,0);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore()}
function eyesDraw(ctx,k,r,t,ink,red){
  const ex=r*.33,ey=-r*.14,rx=r*.085,ry=r*.14;
  const dot=(x,y,a,b,c)=>{ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,7);ctx.fillStyle=c||ink;ctx.fill()};
  const hl=(x,y)=>{ctx.beginPath();ctx.arc(x-rx*.25,y-ry*.35,rx*.28,0,7);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill()};
  const blink=(Math.sin(t*.9)>.985)?.15:1;
  ctx.lineCap='round';ctx.lineWidth=r*.055;ctx.strokeStyle=ink;
  if(red){for(const s of[-1,1]){ctx.save();ctx.shadowColor='#ff1030';ctx.shadowBlur=r*.2;dot(s*ex,ey,rx*1.05,ry*blink,'#ff1030');ctx.restore()}return}
  switch(k){
    case'dot':for(const s of[-1,1]){dot(s*ex,ey,rx,ry*blink);if(blink>.5&&ink[1]==='1'||ink==='#1a0a00')hl(s*ex,ey)}break;
    case'happy':for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*ex,ey+ry*.5,rx*1.3,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}break;
    case'glow':for(const s of[-1,1]){ctx.save();ctx.shadowColor='#2df7ff';ctx.shadowBlur=r*.25;dot(s*ex,ey,rx*1.1,ry*blink,'#c9fbff');ctx.restore()}break;
    case'angry':for(const s of[-1,1]){dot(s*ex,ey+ry*.2,rx,ry*.85);ctx.beginPath();ctx.moveTo(s*ex*1.65,ey-ry*1.45);ctx.lineTo(s*ex*.45,ey-ry*.55);ctx.lineWidth=r*.07;ctx.stroke()}break;
    case'slit':for(const s of[-1,1]){ctx.save();ctx.shadowColor='#ffb000';ctx.shadowBlur=r*.2;dot(s*ex,ey,rx*1.25,ry*.9,'#ffcc00');ctx.restore();dot(s*ex,ey,rx*.28,ry*.85,'#000');ctx.beginPath();ctx.moveTo(s*ex*1.7,ey-ry*1.5);ctx.lineTo(s*ex*.4,ey-ry*.7);ctx.lineWidth=r*.07;ctx.stroke()}break;
    case'void':for(const s of[-1,1]){ctx.save();ctx.shadowColor='#b45cff';ctx.shadowBlur=r*.3;dot(s*ex,ey,rx*1.2,ry*1.15,'#000');ctx.restore();ctx.beginPath();ctx.ellipse(s*ex,ey,rx*1.2,ry*1.15,0,0,7);ctx.strokeStyle='#b45cff';ctx.lineWidth=r*.02;ctx.stroke()}break;
    case'multi':for(const s of[-1,1]){dot(s*ex,ey,rx,ry);dot(s*ex*.55,ey-ry*1.9,rx*.55,ry*.55);dot(s*ex*1.35,ey-ry*1.7+Math.sin(t*5+s)*2,rx*.4,rx*.4)}break;
    case'star':for(const s of[-1,1]){ctx.save();ctx.shadowColor='#fff27a';ctx.shadowBlur=r*.15;star(ctx,s*ex,ey,ry*1.35);ctx.fillStyle='#fff7a8';ctx.fill();ctx.restore();ctx.lineWidth=r*.02;star(ctx,s*ex,ey,ry*1.35);ctx.strokeStyle=ink;ctx.stroke()}break;
    case'spiral':for(const s of[-1,1]){ctx.beginPath();for(let a=0;a<14;a+=.3){const rr=a*r*.0105;ctx.lineTo(s*ex+Math.cos(a+t*3)*rr,ey+Math.sin(a+t*3)*rr)}ctx.lineWidth=r*.035;ctx.stroke()}break;
    case'cosmic':for(const s of[-1,1]){ctx.save();ctx.shadowColor='#8fd0ff';ctx.shadowBlur=r*.2;dot(s*ex,ey,rx*1.2,ry*1.2,'#0a0a30');ctx.restore();ctx.fillStyle='#fff';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(s*ex+Math.cos(t*2+i*1.6)*rx*.7,ey+Math.sin(t*2+i*1.6)*ry*.7,r*.014,0,7);ctx.fill()}}break;
    case'split':dot(-ex,ey,rx,ry*blink);ctx.save();ctx.shadowColor='#ff3df2';ctx.shadowBlur=r*.2;dot(ex,ey,rx*1.1,ry*.9,'#ff3df2');ctx.restore();dot(ex,ey,rx*.3,ry*.85,'#000');break;

    case'light':pt.vx*=.3;pt.vy*=.3;pt.size=rnd(4,10);pt.col='#fff';pt.max=1.3;break;

/* tiny DOM morpher so buttons keep focus/hover while numbers update */
function morph(el,html){const t=document.createElement('template');t.innerHTML=html;patch(el,t.content)}
function patch(a,b){
  const ac=Array.from(a.childNodes),bc=Array.from(b.childNodes);
  for(let i=0;i<bc.length;i++){
    const x=ac[i],y=bc[i];
    if(!x){a.appendChild(y.cloneNode(true));continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}
    if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    if(x.nodeType!==1)continue;
    if(x.nodeName!=='CANVAS'){
      for(const at of Array.from(y.attributes))if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
      for(const at of Array.from(x.attributes))if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
    }else{for(const at of Array.from(y.attributes))if(at.name.startsWith('data-')||at.name==='class')x.setAttribute(at.name,at.value)}
    patch(x,y);
  }
  while(a.childNodes.length>bc.length)a.removeChild(a.lastChild);
}

    case'skin':buySkin(id);break;
    case'mast':buyMastery(id);break;
    case'rebirth':{const t=+v;openModal(`<h2>${TIERS[t].n}?</h2><p>You will gain <b>${fmt(tokenGain(t))} Rebirth Tokens</b>${TIERS[t].mp?` and ${TIERS[t].mp} Mastery Points`:''}. Points, shop upgrades, Evil Points and your form reset.</p>`,[{l:'Cancel'},{l:TIERS[t].n,cls:'go',fn:()=>{doRebirth(t)}}]);break}
    case'set':S.set[b.dataset.k]=!S.set[b.dataset.k];applyAudio();ui.dirtySet=true;renderAll(true);break;
    case'saveNow':save();pushCloud(true);H.toast('Game saved');break;
    case'export':{const box=$('saveBox');box.value=exportSave();box.select();try{navigator.clipboard.writeText(box.value).then(()=>H.toast('Save code copied'),()=>H.toast('Save code ready','Select the text and copy it'))}catch(er){H.toast('Save code ready','Select the text and copy it')}break}
    case'import':{const box=$('saveBox');if(box.value.trim()&&importSave(box.value)){T.boss=null;ensureQuests();H.toast('Save imported','','good');ui.dirtySet=true;renderAll(true)}else H.toast('Import failed','That code is not a valid save','bad');break}
    case'reset1':ui.confirmReset=true;ui.dirtySet=true;renderAll(true);break;
    case'resetNo':ui.confirmReset=false;ui.dirtySet=true;renderAll(true);break;
    case'reset2':S=newState();T.boss=null;T.buffs=[];ensureQuests();ui.confirmReset=false;ui.dirtySet=true;save();pushCloud(true);applyBody();renderAll(true);H.toast('Progress erased');break;
  }
});
document.addEventListener('input',e=>{
  const s=e.target.dataset&&e.target.dataset.s;if(!s)return;audioInit();
  if(e.target.type==='range')S.set[s]=e.target.value/100;else S.set[s]=e.target.value;
  applyAudio();applyBody();if(s==='fmt'||s==='anim'||s==='part'){renderAll(true)}
});
$('evoBtn').addEventListener('click',()=>{audioInit();evolve()});
function applyBody(){document.body.classList.toggle('noanim',S.set.anim==='off')}
arena.addEventListener('pointerdown',e=>{
  if(e.button>0)return;audioInit();
  const r=arena.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(Math.hypot(x-FACE.x,y-FACE.y)<=FACE.r*1.25)doClick(x,y);else{S.bgClicks++;}
});
faceC.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();audioInit();doClick(FACE.x,FACE.y)}});
$('btnSound').addEventListener('click',e=>{S.set.sfx=!S.set.sfx;audioInit();applyAudio();e.currentTarget.setAttribute('aria-pressed',S.set.sfx);ui.dirtySet=true});
$('btnMusic').addEventListener('click',e=>{S.set.music=!S.set.music;audioInit();applyAudio();e.currentTarget.setAttribute('aria-pressed',S.set.music);ui.dirtySet=true});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(arena);

/* ----- cloud backup (optional, only when the viewer is signed in) ----- */
let cloudRef=null,cloudLast=0;
async function initCloud(){
  try{
    if(!window.claude||!claude.use){ui.cloud='off';return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){ui.cloud='off';return}
    const id=await user.id();if(!id){ui.cloud='off';return}cloudRef=db.doc('data/users/'+id+'/verity');
    const snap=await cloudRef.get();ui.cloud='on';
    if(snap.exists){const d=snap.data();
      if(d&&d.json&&d.t>S.lastSave+5000){const ns=loadFromString(d.json);if(ns){S=ns;T.boss=null;recompute();ensureQuests();const off=offlineGain();save();applyBody();applyAudio();renderAll(true);H.toast('Cloud save loaded','Your newest progress was restored','good');if(off)showOffline(off)}}
    }
    pushCloud(true);
  }catch(e){ui.cloud='off'}
  ui.dirtySet=true;
}
async function pushCloud(force){
  if(!cloudRef)return;const t=now();if(!force&&t-cloudLast<45000)return;cloudLast=t;
  try{await cloudRef.set({json:serialize(),t:S.lastSave,total:S.total})}catch(e){}
}
function showOffline(o){
  openModal(`<h2>Welcome back!</h2><p>You were away for <b>${fmtTime(o.away)}</b>${o.capped?` (rewards capped at ${fmtTime(o.secs)})`:''}. Verity kept working at ${(o.eff*100).toFixed(0)}% efficiency.</p><div class="stat"><span>Verity Points earned</span><b style="color:var(--gold)">+${fmt(o.pts)}</b></div>${o.ep>0?`<div class="stat"><span>Evil Points earned</span><b style="color:var(--evil)">+${fmt(o.ep)}</b></div>`:''}`,[{l:'Collect',cls:'go'}]);
}

/* ----- boot ----- */
(function boot(){
  let raw=null;try{raw=localStorage.getItem(SAVE_KEY)}catch(e){}
  if(raw){const s=loadFromString(raw);if(s)S=s}
  recompute();ensureQuests();applyBody();
  const off=offlineGain();
  resize();renderAll(true);
  $('btnSound').setAttribute('aria-pressed',S.set.sfx);$('btnMusic').setAttribute('aria-pressed',S.set.music);
  if(off)showOffline(off);
  let last=performance.now(),acc=0,uiT=0;
  setInterval(()=>{
    const n=performance.now();let dt=(n-last)/1000;last=n;dt=Math.min(dt,7200);
    tick(dt);acc+=dt;uiT+=dt;
    if(uiT>=.2){uiT=0;renderCur();renderStage();if(!T.uiN)T.uiN=0;if(++T.uiN%2===0){renderTabs();renderView(false)}}
    if(acc>=10){acc=0;save();pushCloud(false)}
  },50);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){save();pushCloud(true)}});
  window.addEventListener('pagehide',()=>{save()});
  requestAnimationFrame(frame);
  initCloud();
  window.__vc={S:()=>S,D:()=>D,T,tick,buy,evolve,doClick,recompute,canEvolve,startBoss,doRebirth,canRebirth,tokenGain,claimDaily,save,exportSave,importSave,unlockSecret,addPts,fmt,useAbility,endBoss,goldenCaught,luckyEvent,ensureQuests,newState,load:s=>{S=s},renderAll};
})();
</script>
